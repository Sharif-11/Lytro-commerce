# Local development database (Phase 0). Requires Docker.
# Schemas `control` and `tenant` are created by migrations in Phase 1 (see docs/DATABASE-SCHEMA.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lytronix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: lytronix
    ports:
      # Host port 5433: a PostgreSQL 17 Windows service already uses 5432 on this machine.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on a fresh volume: creates the non-superuser application role (see scripts/db/).
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
