name: CI

# A pull request runs the checks it could fail (.github/scripts/ci-scope.mjs). Main's one full run is Deploy's verify job,
# which calls this workflow, so a merge isn't checked twice.
on:
  pull_request:
  # Lets deploy.yml call this workflow directly for its own verify step, instead of keeping a second,
  # separately-maintained copy of these same steps — the drift that let the Postgres service and the E2E
  # steps below get added to this file without deploy.yml ever following along was exactly this problem.
  workflow_call:

jobs:
  # The ruleset requires this job, so a check a change can't fail is skipped step by step: a path filter on the workflow
  # would leave the pull request waiting for a result that never comes.
  verify:
    runs-on: ubuntu-latest
    # Database tests need a real Postgres; the superuser here creates the test database and roles.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_ADMIN_URL: postgres://postgres:ci_only_password@localhost:5432/postgres
      # What a pull request is compared with to see what it affects; read only with --affected.
      TURBO_SCM_BASE: origin/${{ github.base_ref }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: in a shallow checkout Turborepo counts everything as changed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 24, the active LTS (Node 20 reached its end of life in April 2026); the media Worker's tests run in
      # Miniflare, which needs Node 22 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test the rules for what runs
        run: node --test .github/scripts/ci-scope.test.mjs

      - name: Work out what this change can affect
        id: scope
        run: node .github/scripts/ci-scope.mjs

      - name: Typecheck
        if: steps.scope.outputs.code == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.scope.outputs.code == 'true'
        run: pnpm exec turbo run lint ${{ steps.scope.outputs.affected }}

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        if: steps.scope.outputs.code == 'true'
        # Through Turborepo directly: `pnpm test` is pnpm's own command, and refuses --affected.
        run: pnpm exec turbo run test ${{ steps.scope.outputs.affected }}

      # The dashboard's Help row opens the support WhatsApp the deployment names, and shows only with one; the browser
      # tests below check it with this number, which is not a real one and never deployed.
      - name: Build all apps
        if: steps.scope.outputs.code == 'true'
        run: pnpm build
        env:
          VITE_SUPPORT_WHATSAPP: '8801000000000'

      - name: Install the test browser
        if: steps.scope.outputs.browser == 'true'
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium

      # The dashboard's screens in a real browser against a mocked API, on a phone and a desktop
      # (TENANT-DASHBOARD-DESIGN §11), and each one beside the prototype's drawing of it, kept as pictures for the
      # pull request. The walkthrough against a real server follows.
      - name: Dashboard browser tests
        if: steps.scope.outputs.dashboard == 'true'
        working-directory: apps/dashboard
        run: pnpm exec playwright test

      # The storefront's pages in a real browser against a mocked server, on a phone and a desktop (KNOWN-GAPS §105), and
      # each one beside the prototype's drawing of it, kept as pictures for the pull request.
      - name: Storefront browser tests
        if: steps.scope.outputs.storefront == 'true'
        working-directory: apps/storefront
        run: pnpm exec playwright test

      # Slice 5.8's part 2: the payment page in a real browser, drawn from fixtures under its real policy, on a phone and a
      # desktop, each screen beside the prototype's drawing of it, kept as pictures for the pull request.
      - name: Payment page browser tests
        if: steps.scope.outputs.paymentPage == 'true'
        working-directory: apps/server
        run: pnpm exec playwright test

      # Slice 11.13b (PHASE-3-PLAN Slice 11's "done when"): a clothing, a cosmetics and a grocery seller sign up, make a
      # product, add stock, count it and buy more, on a phone in Bangla, against the built server and a fresh database
      # (walkthrough/global-setup.ts), never meeting inventory jargon or a field the shop type does not use.
      - name: Dashboard walkthrough against the real server
        if: steps.scope.outputs.walkthrough == 'true'
        working-directory: apps/dashboard
        run: pnpm exec playwright test -c playwright.walkthrough.config.ts

      - name: Keep the dashboard's pictures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-tests
          if-no-files-found: ignore
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 14

      - name: Keep the storefront's pictures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-tests
          if-no-files-found: ignore
          path: |
            apps/storefront/test-results/
            apps/storefront/playwright-report/
          retention-days: 14

      - name: Keep the payment page's pictures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-page-browser-tests
          if-no-files-found: ignore
          path: |
            apps/server/test-results/
            apps/server/playwright-report/
          retention-days: 14
