name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy.yml call this workflow directly for its own verify step, instead of keeping a second,
  # separately-maintained copy of these same steps — the drift that let the Postgres service and the E2E
  # steps below get added to this file without deploy.yml ever following along was exactly this problem.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Database tests need a real Postgres; the superuser here creates the test database and roles.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_ADMIN_URL: postgres://postgres:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build all apps
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx --prefix apps/admin playwright install --with-deps chromium

      - name: Admin E2E
        run: pnpm test:e2e
