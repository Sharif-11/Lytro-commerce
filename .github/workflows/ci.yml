name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy.yml call this workflow directly for its own verify step, instead of keeping a second,
  # separately-maintained copy of these same steps — the drift that let the Postgres service and the E2E
  # steps below get added to this file without deploy.yml ever following along was exactly this problem.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Database tests need a real Postgres; the superuser here creates the test database and roles.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_ADMIN_URL: postgres://postgres:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Node 24, the active LTS (Node 20 reached its end of life in April 2026); the media Worker's tests run in
      # Miniflare, which needs Node 22 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # The dashboard's Help row opens the support WhatsApp the deployment names, and shows only with one; the browser
      # tests below check it with this number, which is not a real one and never deployed.
      - name: Build all apps
        run: pnpm build
        env:
          VITE_SUPPORT_WHATSAPP: '8801000000000'

      # The dashboard's screens in a real browser against a mocked API, on a phone and a desktop
      # (TENANT-DASHBOARD-DESIGN §11), and each one beside the prototype's drawing of it, kept as pictures for the
      # pull request. The walkthrough against a real server joins in Slice 11.13.
      - name: Dashboard browser tests
        working-directory: apps/dashboard
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      - name: Keep the dashboard's pictures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-tests
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 14
