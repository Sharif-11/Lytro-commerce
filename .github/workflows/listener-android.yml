name: Listener app

# Slice 5.5 (agreed 2026-11-03): the Android app's own job, on its own files, and on the server's definitions it has to
# follow: ContractTest reads those, so a change to one of them is checked here too.
on:
  push:
    branches: [main]
    paths:
      - 'apps/listener-android/**'
      - '.github/workflows/listener-android.yml'
      - 'packages/validators/src/common/limits.ts'
      - 'packages/validators/src/api/listener/**'
      - 'apps/server/src/modules/listener-receipts/services/receipt-parser.ts'
  pull_request:
    paths:
      - 'apps/listener-android/**'
      - '.github/workflows/listener-android.yml'
      - 'packages/validators/src/common/limits.ts'
      - 'packages/validators/src/api/listener/**'
      - 'apps/server/src/modules/listener-receipts/services/receipt-parser.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/listener-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # A throwaway debug key signs what PRs build; the real key never comes near GitHub (agreed 2026-11-03).
      - name: Logic tests, lint and both builds
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listener-app-reports
          path: |
            apps/listener-android/app/build/reports/
            apps/listener-android/app/build/test-results/
          retention-days: 14

  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest phone the app promises to run on (Android 7), and a recent one.
        api-level: [24, 34]
    defaults:
      run:
        working-directory: apps/listener-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Real SMS through the emulator's radio, and every screen, with no person (agreed 2026-11-03). Its console token is the
      # file the emulator writes on starting. A crashed run's report says only that it crashed, so its log goes to this job's.
      - name: Tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          arch: x86_64
          working-directory: apps/listener-android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain "-Pandroid.testInstrumentationRunnerArguments.consoleToken=$(cat ~/.emulator_console_auth_token)" || { adb logcat -d -b crash | tail -60; exit 1; }

      - name: Keep the emulator's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listener-app-emulator-report-${{ matrix.api-level }}
          path: apps/listener-android/app/build/reports/androidTests/
          retention-days: 14
