name: Deploy rehearsal

# Slice 9.1 (D9-10 to D9-12, PHASE-9-PLAN §10: "anything a server runs is proven"): on a pull request that changes how
# Lytro is built or deployed, every image is built, and deploy/scripts/deploy.sh deploys them on this runner exactly as on
# a server: a fresh database made by its first-start script, migrations, the two API processes and the worker each
# checked on this release, the files, the edge, the website and the storefront. Every host is then called by name over
# HTTPS (deploy/scripts/outside-check.sh), and the same release is deployed a second time, as a rerun would be.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-rehearsal.yml
      - apps/server/src/main.ts
      - apps/server/src/app/**
      - apps/server/src/config/**
      - apps/*/next.config.ts
      - package.json
      - pnpm-lock.yaml
      - turbo.json

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LYTRO_HOME: ${{ github.workspace }}/../lytro-home
      REGISTRY: lytro-rehearsal
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Name the edge and pooler images
        id: names
        run: |
          echo "edge_tag=$(sh deploy/caddy/image-tag.sh)" >> "$GITHUB_OUTPUT"
          echo "pgbouncer_tag=$(sh deploy/pgbouncer/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          build-args: RELEASE=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/lytro-server:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Website image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: website
          build-args: RELEASE=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/lytro-website:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=release

      - name: Storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: storefront
          build-args: RELEASE=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/lytro-storefront:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=release

      - name: Dashboard and console files image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: static
          build-args: RELEASE=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/lytro-static:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=release

      - name: Edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy/Dockerfile
          tags: ${{ env.REGISTRY }}/lytro-edge:${{ steps.names.outputs.edge_tag }}
          load: true
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max

      - name: Pooler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pgbouncer/Dockerfile
          tags: ${{ env.REGISTRY }}/lytro-pgbouncer:${{ steps.names.outputs.pgbouncer_tag }}
          load: true

      # The settings a server's setup makes (make-env.sh), for PLATFORM_DOMAIN=localhost so Caddy signs every host's
      # certificate itself. In production the server refuses to start without its outside services' keys, so stand-ins
      # are given; nothing here sends a message.
      - name: The server's settings
        run: |
          sudo groupadd --force deploy
          sudo LYTRO_HOME="$LYTRO_HOME" PLATFORM_DOMAIN=localhost PLATFORM_ADDRESSES=127.0.0.1 \
            ACME_EMAIL=rehearsal@example.com ROBOTS=robots_noindex bash deploy/scripts/make-env.sh
          printf '%s\n' BULKSMSBD_API_KEY=rehearsal BULKSMSBD_SENDER_ID=8809600000000 RESEND_API_KEY=re_rehearsal \
            RESEND_WEBHOOK_SECRET=whsec_rehearsal GEMINI_API_KEY=rehearsal | sudo tee -a "$LYTRO_HOME/env/server.env" > /dev/null
          echo WILDCARD_TLS=wildcard_tls_auto | sudo tee -a "$LYTRO_HOME/env/edge.env" > /dev/null
          echo "REGISTRY=$REGISTRY" | sudo tee "$LYTRO_HOME/settings.env" > /dev/null
          sudo install -d "$LYTRO_HOME/state" "$LYTRO_HOME/releases" "$LYTRO_HOME/backups"

      - name: Deploy
        run: sudo LYTRO_HOME="$LYTRO_HOME" LYTRO_SKIP_PULL=1 bash deploy/scripts/deploy.sh "${{ github.sha }}" "${{ steps.names.outputs.edge_tag }}"

      - name: Every host answers
        run: CHECK_ADDRESS=127.0.0.1 CHECK_INSECURE=1 bash deploy/scripts/outside-check.sh localhost

      # Slice 9.2 (D9-13, DAT-23, DAT-45): through PgBouncer, the API's role runs under the 5-second transaction limit and
      # the 10-second statement limit, and the read role can read but never write.
      - name: The pooler holds its limits and the read role only reads
        run: |
          app="$(sudo sed -n 's/^PGBOUNCER_APP_PASSWORD=//p' "$LYTRO_HOME/env/pgbouncer.env")"
          reader="$(sudo sed -n 's/^PGBOUNCER_READ_PASSWORD=//p' "$LYTRO_HOME/env/pgbouncer.env")"
          psql_via_pooler() {
            sudo docker exec -i lytro-postgres-1 psql -X -A -t -v ON_ERROR_STOP=1 "postgres://$1@pgbouncer:6432/lytronix" -c "$2"
          }
          test "$(psql_via_pooler "lytronix_app:$app" 'SHOW transaction_timeout')" = '5s'
          test "$(psql_via_pooler "lytronix_app:$app" 'SHOW statement_timeout')" = '10s'
          test "$(psql_via_pooler "lytronix_read:$reader" 'SHOW default_transaction_read_only')" = 'on'
          test "$(psql_via_pooler "lytronix_read:$reader" 'SELECT count(*) >= 0 FROM control.plans')" = 't'
          if psql_via_pooler "lytronix_read:$reader" 'DELETE FROM control.plans WHERE false' 2> read-write.err; then
            echo 'the read role wrote'; exit 1
          fi
          grep -E 'read-only transaction|permission denied' read-write.err
          if psql_via_pooler "lytronix_app:$app" 'SELECT pg_sleep(6)' 2> sleep.err; then
            echo 'a 6-second statement ran past the 5-second transaction limit'; exit 1
          fi
          cat sleep.err

      - name: Staging's hosts aren't indexed
        run: |
          curl --silent --insecure --head --resolve app.localhost:443:127.0.0.1 https://app.localhost/ \
            | grep -i '^x-robots-tag: noindex, nofollow'

      - name: Deploy the same release again
        run: sudo LYTRO_HOME="$LYTRO_HOME" LYTRO_SKIP_PULL=1 bash deploy/scripts/deploy.sh "${{ github.sha }}" "${{ steps.names.outputs.edge_tag }}"

      - name: Every host still answers
        run: CHECK_ADDRESS=127.0.0.1 CHECK_INSECURE=1 WAIT_SECONDS=30 bash deploy/scripts/outside-check.sh localhost

      - name: What ran, if anything failed
        if: failure()
        run: |
          sudo docker ps --all --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          for name in $(sudo docker ps --all --format '{{.Names}}'); do
            echo "::group::$name"
            sudo docker logs --tail 80 "$name" 2>&1 || true
            echo '::endgroup::'
          done
