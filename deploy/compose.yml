# One server's deployment (Phase 9 Slice 9.1, D9-9 to D9-12): staging today, production later, the same file. Run by
# deploy/scripts/deploy.sh from a release's own copy of deploy/, never edited on the server. What differs between
# servers is in /opt/lytro (LYTRO_HOME): the root-only env files and release.env (which images to run), never here.
#
#   edge        Caddy: TLS, every host's routing (deploy/Caddyfile), the dashboard and console files
#   api-1/2     the API, two processes replaced one at a time (D9-11, D9-12)
#   worker      every job (D9-11), never routed to
#   website     the marketing site        storefront  every shop's storefront
#   postgres    the database (17), sending its write-ahead log to R2 when backups are set up (Slice 9.3)
#   backup      the nightly backups at 05:30 Dhaka: the encrypted dump, then the base backup (Slice 9.3, D9-18)
#   redis       the shared limits and gateway tokens (Slice 9.4, D9-1, D9-15), password-protected, nothing kept
#   pgbouncer   the API's pooler (Slice 9.2, D9-13): the worker and the migrations connect to postgres directly
#   migrate     one-off: migrations, then pg-boss's schema, as the owner (deploy.sh, after a dump)
#   static      one-off: publishes a release's dashboard and console files into the edge's volume
#
# Memory: every process has a ceiling (D9-11), set for staging's 2 vCPU / 3 GB by default and raised for production in
# release.env. PostgreSQL has none, and the kernel is told to kill it last.
name: lytro

x-server: &server
  image: ${REGISTRY:?}/lytro-server:${RELEASE:?}
  init: true
  restart: unless-stopped
  env_file: ${LYTRO_HOME:-/opt/lytro}/env/server.env
  depends_on:
    postgres:
      condition: service_healthy
  networks: [internal]
  # The API's own shutdown waits 10 s for requests in flight; a job worker's pg-boss waits up to 30 s for running jobs.
  stop_grace_period: 45s
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

x-api: &api
  <<: *server
  # server-api.env over server.env: the API reaches the database through PgBouncer, which sets its limits (DAT-23).
  env_file:
    - ${LYTRO_HOME:-/opt/lytro}/env/server.env
    - ${LYTRO_HOME:-/opt/lytro}/env/server-api.env
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
  mem_limit: ${API_MEMORY:-384m}
  environment: &api-environment
    SERVER_ROLE: api
    RELEASE: ${RELEASE:?}
    NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-256}

services:
  edge:
    image: ${REGISTRY:?}/lytro-edge:${EDGE_TAG:?}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/edge.env
    environment:
      SERVER_UPSTREAM: api-1:3000 api-2:3000
      WEBSITE_UPSTREAM: website:3003
      STOREFRONT_UPSTREAM: storefront:3001
      DASHBOARD_DIST_PATH: /srv/static/current/dashboard
      OPERATOR_DIST_PATH: /srv/static/current/operator
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - static:/srv/static:ro
    networks: [internal]
    mem_limit: ${EDGE_MEMORY:-128m}
    logging: *logging

  api-1:
    <<: *api
  api-2:
    <<: *api

  worker:
    <<: *server
    mem_limit: ${WORKER_MEMORY:-768m}
    environment:
      SERVER_ROLE: worker
      RELEASE: ${RELEASE:?}
      NODE_OPTIONS: --max-old-space-size=${WORKER_HEAP_MB:-320}
      # Video conversion writes its files here (media-processor); a folder in the container, kept off the image.
      TMPDIR: /tmp
      # Straight to postgres, so it sets its own limits: a background job (a shop's deletion, a night's purge) may hold a
      # transaction longer than the API's 5 s, never without end (DAT-23; the API's are PgBouncer's).
      DATABASE_TRANSACTION_TIMEOUT_MS: ${WORKER_TRANSACTION_TIMEOUT_MS:-60000}

  website:
    image: ${REGISTRY:?}/lytro-website:${RELEASE:?}
    init: true
    restart: unless-stopped
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/website.env
    environment:
      # The API, balanced and health-checked by the edge's internal listener (deploy/Caddyfile).
      SERVER_URL: http://edge:8080
      NODE_OPTIONS: --max-old-space-size=${WEBSITE_HEAP_MB:-160}
    networks: [internal]
    mem_limit: ${WEBSITE_MEMORY:-256m}
    logging: *logging

  storefront:
    image: ${REGISTRY:?}/lytro-storefront:${RELEASE:?}
    init: true
    restart: unless-stopped
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/storefront.env
    environment:
      SERVER_URL: http://edge:8080
      NODE_OPTIONS: --max-old-space-size=${STOREFRONT_HEAP_MB:-200}
    networks: [internal]
    mem_limit: ${STOREFRONT_MEMORY:-320m}
    logging: *logging

  postgres:
    # 17 for transaction_timeout, DAT-23's whole-transaction limit (Slice 9.2's read), with WAL-G and the backup scripts
    # (deploy/database, Slice 9.3), tagged by what goes into it as the pooler's image is.
    image: ${REGISTRY:?}/lytro-database:${DATABASE_TAG:?}
    restart: unless-stopped
    # backup.env: the archive's key, for archive_command. The app's containers never get it (DAT-28).
    env_file:
      - ${LYTRO_HOME:-/opt/lytro}/env/postgres.env
      - ${LYTRO_HOME:-/opt/lytro}/env/backup.env
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-192MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - log_min_duration_statement=1000
      # Point-in-time recovery (DAT-34): every finished write-ahead-log file to R2, at least each minute. deploy.sh
      # sets PG_ARCHIVE_MODE=on once backup.env holds the archive's settings, off before (CI's rehearsal).
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=lytro-archive %p
      - -c
      - archive_timeout=60
    # The first-start scripts (deploy/postgres), from the one folder deploy.sh copies them to. Never from a release's own
    # folder: lytro-ssh makes that again on every run, which emptied this mount under the running database, and a mount
    # that moved with each release would replace the database on every deploy (staging, 2026-11-13).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${LYTRO_HOME:-/opt/lytro}/state/postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    # Killed last when memory runs out (D9-11).
    oom_score_adj: -900
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

  pgbouncer:
    image: ${REGISTRY:?}/lytro-pgbouncer:${PGBOUNCER_TAG:?}
    restart: unless-stopped
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/pgbouncer.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: ${PGBOUNCER_MEMORY:-48m}
    logging: *logging

  # The nightly backups (Slice 9.3, D9-18): lytro-scheduler runs lytro-nightly at 23:30 UTC, 05:30 in Dhaka (the owner's
  # time), and at once if the last good night is over 26 hours old. It reads the database's files read-only for the
  # base backup and connects as the owner for the dump; it holds both backup keys and the database's owner password,
  # and nothing routes to it. Without backup settings it only waits.
  backup:
    image: ${REGISTRY:?}/lytro-database:${DATABASE_TAG:?}
    restart: unless-stopped
    user: postgres
    command: ['lytro-scheduler']
    env_file:
      - ${LYTRO_HOME:-/opt/lytro}/env/postgres.env
      - ${LYTRO_HOME:-/opt/lytro}/env/backup.env
    environment:
      PGHOST: postgres
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-23:30}
      # WAL-G is a Go program: kept under the container's ceiling.
      GOMEMLIMIT: ${BACKUP_GOMEMLIMIT:-200MiB}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - backup-work:/var/lib/lytro-backup
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: ${BACKUP_MEMORY:-320m}
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Limits, leases' companions and shared tokens only (Slice 9.4): nothing in it has to survive a restart, and every
    # key Lytro writes expires. Hardened as RED-01 says (D9-1): a password (given on standard input, never on a command
    # line a process list shows), the commands that wipe or reconfigure it switched off, no persistence, and eviction
    # only among keys with an expiry. REDIS_MAXMEMORY in settings.env: 64mb on staging, 256mb in production.
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/redis.env
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" |
        exec redis-server - --save '' --appendonly no --maxmemory ${REDIS_MAXMEMORY:-64mb}
        --maxmemory-policy volatile-lru --rename-command FLUSHALL '' --rename-command FLUSHDB ''
        --rename-command CONFIG '' --rename-command DEBUG '' --rename-command KEYS '' --rename-command SHUTDOWN ''
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    mem_limit: ${REDIS_MEMORY:-96m}
    logging: *logging

  migrate:
    <<: *server
    profiles: [tools]
    restart: 'no'
    # The owner's DATABASE_URL: migrations change the schema, which the app role can't (deploy/README.md).
    env_file: ${LYTRO_HOME:-/opt/lytro}/env/migrate.env
    environment:
      RELEASE: ${RELEASE:?}
    command:
      - sh
      - -c
      - node node_modules/@lytronix/db/dist/migrate.js && node node_modules/@lytronix/db/dist/bootstrap-queue.js

  static:
    image: ${REGISTRY:?}/lytro-static:${RELEASE:?}
    profiles: [tools]
    restart: 'no'
    volumes:
      - static:/srv/static
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  backup-work:
  caddy-data:
  caddy-config:
  static:
