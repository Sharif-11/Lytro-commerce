<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro operator console prototype</title>
<meta name="description" content="Operator console design prototype for Lytro: light, desktop-first, phone-capable, English with a Bangla toggle, every screen the backend serves today and the places later work will fill. Spec: docs/OPERATOR-CONSOLE-DESIGN.md">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
/* ---------- Lytro tokens (docs/brand/tokens.css) ---------- */
:root{
  --teal-50:#effaf8;--teal-100:#ddf5f2;--teal-200:#b9ece6;--teal-300:#7fdcd3;--teal-400:#3ec4b9;--teal-500:#17a89e;--teal-600:#107f78;--teal-700:#0e6b66;--teal-800:#0a4f4b;--teal-900:#063b38;
  --mar-100:#fdf0d1;--mar-300:#f8cf6e;--mar-500:#f2a516;--mar-700:#9a6004;
  --ink:#10201f;--band:#061211;--n700:#2c3f3e;--n500:#5b6e6d;--n400:#7e8f8e;--n300:#a9b9b8;--n200:#d5dfde;--n100:#eaf0ef;--n50:#f6f9f8;--white:#fff;
  --success:#1b7a43;--success-soft:#e3f3e9;--warning:#9a6004;--warning-soft:#fdf0d1;--danger:#c8323b;--danger-soft:#fbe7e8;--info:#0e6b66;--info-soft:#ddf5f2;
  --bg:var(--n50);--surface:var(--white);--line:var(--n200);--line-strong:var(--n300);--text:var(--ink);--muted:var(--n700);--subtle:var(--n500);
  --primary:var(--teal-700);--primary-hover:var(--teal-800);--on-primary:#fff;--primary-soft:var(--teal-50);--accent:var(--mar-500);--on-accent:var(--ink);--accent-text:var(--mar-700);
  --font-ui:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;--font-display:'Plus Jakarta Sans','Inter','Noto Sans Bengali',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-control:6px;--r-card:10px;--r-sheet:16px;--shadow:0 1px 2px rgba(16,32,31,.06),0 4px 12px rgba(16,32,31,.06);--shadow-pop:0 12px 40px rgba(16,32,31,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);color:var(--text);background:#e6ebea;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* brand lockup: the operator icon tile (icon-operator.svg) and the wordmark (lytro-wordmark*.svg) */
svg.mk{stroke-width:10}
.tile{background:var(--teal-900);color:var(--mar-500);border-radius:22%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tile svg.i{width:66%;height:66%}
.wm{display:inline-flex;align-items:baseline;font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.wm svg{height:.75em;width:.75em;margin-right:.07em;flex:none}
.wm.light svg{color:var(--teal-700)}
.wm.light span{color:var(--ink)}
.wm.dark svg{color:var(--teal-400)}
.wm.dark span{color:#fff}
.mono{font-family:var(--font-mono);font-size:13px;letter-spacing:0;font-variant-numeric:tabular-nums}
.money{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ---------- Harness (not product UI) ---------- */
.tb{position:sticky;top:0;z-index:50;background:var(--ink);color:#eaf0ef;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;font-size:13px}
.tb .brand{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;font-size:16px;color:#fff;margin-right:8px}
.tb .brand em{font-style:normal;color:var(--mar-300);font-size:11px;letter-spacing:.08em;margin-left:6px;vertical-align:middle}
.tb label{display:flex;align-items:center;gap:6px;color:#a9b9b8}
.tb select{background:#1a3230;color:#fff;border:1px solid #335450;border-radius:6px;padding:5px 8px;font-size:13px;max-width:340px}
.tb .seg{display:inline-flex;border:1px solid #335450;border-radius:6px;overflow:hidden}
.tb .seg button{padding:5px 10px;color:#a9b9b8}
.tb .seg button.on{background:var(--teal-400);color:var(--ink);font-weight:600}
.tb .note{margin-left:auto;color:#7e8f8e}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.frame{container-type:inline-size;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(16,32,31,.25)}
.frame.phone{width:390px;height:844px;border-radius:40px;border:8px solid #0b1514}
.frame.tablet{width:820px;height:1000px;border-radius:24px;border:8px solid #0b1514}
.frame.desktop{width:1366px;height:860px;border-radius:12px;border:1px solid #c9d3d2}
.frame .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;background:var(--band);color:#fff}
.frame.desktop .statusbar{display:none}
.frame .urlbar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;background:#f1f4f3;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.frame.desktop .urlbar{display:flex}
.frame .urlbar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d5dfde;margin-right:6px}
.frame .urlbar .url{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;flex:1;max-width:520px}
.caption{max-width:1366px;margin:0 auto;padding:0 16px 40px;color:#2c3f3e;font-size:13px;line-height:1.6}
.caption b{color:var(--ink)}

/* ---------- Shell ---------- */
.shell{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.frame.phone .shell,.frame.tablet .shell{top:44px}
.frame.desktop .shell{top:40px}
.body{flex:1;display:flex;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
/* identity band: the one cue that this is the operator's console, never a seller's dashboard */
.band{flex:none;height:52px;background:var(--band);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px}
.band .id{display:flex;align-items:center;gap:10px;min-width:0}
.band .tile{width:32px;height:32px}
.band .words{display:flex;flex-direction:column;line-height:1.1;gap:2px}
.band .eyebrow-op{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mar-300)}
.band .word{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.02em;color:#fff}
.band .wm{font-size:17px}
.band .ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#d5dfde;position:relative}
.band .spacer{flex:1}
.band .env{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#a9b9b8;border:1px solid #2a4542;border-radius:999px;padding:3px 8px}
.band .ib .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--mar-500);color:var(--ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sidebar{display:none}
.topbar{display:none}
.tabbar{flex:none;height:64px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 0 0}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--n700);position:relative}
.tabbar button svg.i{width:24px;height:24px}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar .pill{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------- Page ---------- */
.page{display:flex;flex-direction:column;gap:16px;padding:16px 16px 28px;min-height:100%}
.frame[data-lang=bn] .page,.frame[data-lang=bn] .sheet,.frame[data-lang=bn] .sidebar{line-height:1.6}
.ttl{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.ttl h1{font-size:22px;font-weight:700;line-height:1.3;flex:1 1 auto;min-width:0;letter-spacing:-.01em}
.ttl .sub{font-size:14px;color:var(--muted);margin-top:2px;max-width:720px}
.ttl .actions{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ttl .actions .btn{flex:1 1 auto}
.crumbs{font-size:13px;color:var(--subtle);display:flex;gap:6px;align-items:center}
.crumbs a{color:var(--primary);text-decoration:none;cursor:pointer}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.frame[data-lang=bn] .eyebrow{text-transform:none;letter-spacing:0;font-size:14px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead h2{font-size:16px;font-weight:600}
.sechead .lnk{font-size:14px;color:var(--primary);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--n700);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-size:12px;font-weight:600;padding:0 6px;height:18px;border-radius:999px;background:var(--n100);color:var(--n700);display:inline-flex;align-items:center}
.chip.on .c{background:rgba(255,255,255,.22);color:#fff}
.chip.off{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.card .hint{font-size:13px;color:var(--muted)}
.card.later{border-style:dashed;background:transparent}
.card.later h3{color:var(--n700)}
.card.later .hint{color:var(--subtle)}
.soon{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--n100);color:var(--n700);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.frame[data-lang=bn] .soon{text-transform:none;letter-spacing:0}
.list{display:flex;flex-direction:column}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;width:100%;text-align:left;color:inherit;text-decoration:none}
.row[onclick]{cursor:pointer}
.row .lead{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--n100);color:var(--n700);font-weight:600;overflow:hidden}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .l1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .l2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .trail{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-weight:600;font-size:15px}
.row .time{font-size:13px;color:var(--subtle)}
.row .chev{color:var(--n400)}

/* status chips: one meaning each */
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;vertical-align:middle}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--success-soft);color:var(--success)}
.st.warn{background:var(--warning-soft);color:var(--warning)}
.st.bad{background:var(--danger-soft);color:var(--danger)}
.st.info{background:var(--info-soft);color:var(--info)}
.st.mute{background:var(--n100);color:var(--n700)}
.st.plain::before{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-control);font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.accent{background:var(--accent);color:var(--ink)}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.quiet{color:var(--primary);background:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg.i{width:18px;height:18px}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--n700);cursor:pointer}
.iconbtn:hover{background:var(--n100)}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--n700);background:var(--surface)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--n700)}
.field .help{font-size:13px;color:var(--subtle)}
.field .err{font-size:13px;color:var(--danger)}
.input,.select,.textarea{height:44px;border:1px solid var(--line-strong);border-radius:var(--r-control);padding:0 12px;background:var(--surface);font-size:15px;width:100%;color:var(--ink)}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.5}
.input.mono{font-family:var(--font-mono);font-size:14px}
.input[disabled],.select[disabled]{background:var(--n50);color:var(--subtle)}
.input.inline{height:36px;font-size:14px;width:120px;text-align:right}
.inwrap{position:relative}
.inwrap .pre{position:absolute;left:12px;top:0;height:44px;display:flex;align-items:center;color:var(--subtle)}
.inwrap .input{padding-left:30px}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%232c3f3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch .trk{width:40px;height:24px;border-radius:999px;background:var(--n300);position:relative;flex:none;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .trk{background:var(--primary)}
.switch.on .trk::after{left:19px}
.switch .lbl{font-size:14px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check .bx{width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);flex:none}
.check.on .bx{background:var(--primary);border-color:var(--primary);color:#fff}
.check.on .bx svg.i{width:14px;height:14px;stroke-width:3}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.grid2>*{min-width:0}
.card{min-width:0}
.row.wrap .l1,.row.wrap .l2{white-space:normal;overflow:visible;text-overflow:clip}
.form{display:flex;flex-direction:column;gap:14px}
.consequence{background:var(--n50);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55}
.consequence.danger{border-left-color:var(--danger)}
.consequence.ok{border-left-color:var(--success)}
.consequence b{font-weight:600}

/* search */
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-control);padding:0 12px;background:var(--surface);color:var(--subtle)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.search .kbd{margin-left:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v.warn{color:var(--warning)}
.stat .d{font-size:13px;color:var(--subtle)}
.stat.flag{border-color:var(--mar-300);background:#fffaf0}

/* tables: one column list, table from 640 px, cards below */
.tbl{display:flex;flex-direction:column}
.tbl .thead{display:none}
.tbl .tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.tbl .tr:first-child{border-top:0}
.tbl .tr[onclick]{cursor:pointer}
.tbl .tr.faded{opacity:.55}
.tbl .td{min-width:0;font-size:14px}
.tbl .td .cl{display:block;font-size:11px;color:var(--subtle);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.frame[data-lang=bn] .tbl .td .cl{text-transform:none;letter-spacing:0;font-size:12px}
.tbl .td.main{grid-column:1/-1;font-size:15px;font-weight:600}
.tbl .td.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.tbl .td.r{text-align:left}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg.i{width:32px;height:32px;color:var(--n300)}
.empty b{color:var(--ink);font-weight:600;font-size:15px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--n100),var(--n50),var(--n100));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;font-size:14px;border:1px solid}
.banner.bad{background:var(--danger-soft);border-color:#f3c3c6;color:#7a1f25}
.banner.warn{background:var(--warning-soft);border-color:#f1d996;color:#6a4203}
.banner.info{background:var(--info-soft);border-color:#b9ece6;color:#0a4f4b}
.banner svg.i{width:18px;height:18px;margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500;min-width:0;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:12px;color:var(--subtle);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.frame[data-lang=bn] .fact .k{text-transform:none;letter-spacing:0;font-size:13px}
.fact .v{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.fact .v.mono{font-size:13px;font-weight:500}
.toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.divider{height:1px;background:var(--line)}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.pricecell{height:36px;width:92px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;text-align:right;font-family:var(--font-mono);font-size:13px;background:var(--surface)}
.pricecell.empty{color:var(--n300)}
.pricecell[disabled]{background:var(--n50);color:var(--n300);border-style:dashed}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:middle;margin-right:6px}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:var(--n100);color:var(--n700);font-size:13px;font-weight:500}
.tag.strike{text-decoration:line-through;color:var(--subtle)}
.tag.on{background:var(--teal-100);color:var(--teal-800)}

/* ---------- every platform setting, in nine groups ---------- */
function settingValue(s) {
  if (s.unit === 'list') return `<span style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end">${s.value.map((v) => `<span class="st mute plain mono">${v}</span>`).join('')}</span>`;
  if (s.unit === 'choice') return `<span style="font-weight:600;text-align:right">${t('ol_' + s.value)}</span>`;
  if (s.unit === 'version' || s.unit === 'text') return `<span class="mono" style="font-weight:600">${s.value}</span>`;
  if (s.unit === '৳') return `<span class="money" style="font-size:20px">${money(s.value)}</span>`;
  return `<span class="money" style="font-size:20px">${s.value} <span style="font-size:13px;font-weight:500;color:var(--subtle)">${t(s.unit)}</span></span>`;
}
function settingEditor(s, editorFor) {
  const save = `${btn(t('save'), 'primary sm', "go('settings')")}${btn(t('cancel'), 'ghost sm', "go('settings')")}`;
  const reason = `<input class="input" placeholder="${t('reason')}" style="height:36px;width:220px;max-width:100%">`;
  if (s.unit === 'list') return `<div style="flex:1 1 100%;display:flex;flex-direction:column;gap:8px">${field(t('sn_' + s.key), textarea(s.value.join('\n')), t('se_senders_help'))}<span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${reason}${save}</span></div>`;
  if (s.unit === 'choice') return `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${select([['block', t('ol_block')], ['allow_with_prompt', t('ol_allow_with_prompt')]], s.value)}${reason}${save}</span>`;
  if (s.unit === 'version') return `<div style="flex:1 1 100%;display:flex;flex-direction:column;gap:8px"><div class="banner warn">${I.warn}<div>${t('se_version_warn')}</div></div><span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="input inline mono" value="${s.value}" style="width:140px">${reason}${save}</span></div>`;
  return `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="input inline mono" value="${s.value}" style="width:110px">${reason}${save}</span>`;
}

      <div class="tstep"><div class="t">${g}–${r} · ${t('sn_read_only_days')}</div><div class="d">${t('tl_ro')}</div></div>
      <div class="tstep"><div class="t">${r}–${l} · ${t('sn_locked_days')}</div><div class="d">${t('tl_locked')}</div></div>
      <div class="tstep"><div class="t">${l}–${a} · ${t('sn_archived_days')}</div><div class="d">${t('tl_arch')}</div></div>

function p37Md(text) {
  const inline = (s) => p37Esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return `<div class="p37-md">${String(text).split(/\n\s*\n/).map((block) => { const lines = block.split('\n'); return lines.every((l) => l.startsWith('- ')) ? `<ul>${lines.map((l) => `<li>${inline(l.slice(2))}</li>`).join('')}</ul>` : `<p>${lines.map(inline).join('<br>')}</p>`; }).join('')}</div>`;
}

    } };
  });
  const chips = `<div class="chips"><button class="chip on">${t('all')}</button>${P37_CATS.map((c) => `<button class="chip">${t('p37_cat_' + c)}</button>`).join('')}</div>`;
  return `<div class="ttl"><div><h1>${t('notices')}</h1><div class="sub">${t('p37_sub')}</div></div><div class="actions">${btn(I.plus + t('p37_new'), 'primary', "go('p37-notice-start')")}</div></div>

}

/* ---------- a new notice: blank or a template (POST /operator/notices/template fills it) ---------- */
function p37StartSheet(pick) {
  const opt = (k, extra) => p37Radio(pick === k, t('p37_tp_' + k), t('p37_tp_' + k + '_d'), pick === k ? extra : '');
  const win = `<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">${p37Fld(t('p37_win_start'), '', input('2026-11-10T02:00', '', '', 'type=datetime-local'))}${p37Fld(t('p37_win_end'), '', input('2026-11-10T04:00', '', '', 'type=datetime-local'))}</div>`;
  const changes = `<div class="p37-radios" style="margin-top:8px"><div class="p37-cap">${t('p37_which_change')}</div>${p37Radio(true, t('rn_sms_per_unit'), t('p37_change_line', { o: '৳0.55', n: '৳0.65', d: dateT(P37_CHANGE.at) }) + ` · ${t('p37_no_notice')}`)}${p37Radio(false, t('rn_payg_order_fee_pct'), t('p37_change_line', { o: '2%', n: '1.5%', d: dateS('2026-10-02') }) + ` · ${t('p37_no_notice')}`)}${p37Radio(false, t('p37_own_rate'), '')}</div>`;
  const next = pick === 'rate_change' ? 'p37-notice-from-rate' : 'p37-notice-new';
  return sheet(t('p37_new'), t('p37_start_sub'), `<div class="p37-radios">${opt('blank')}${opt('rate_change', changes)}${opt('maintenance', win)}${opt('outage')}${opt('policy_update')}</div>`, `${backTo('p37-notices')}${btn(t('continue_'), 'primary', `go('${next}')`)}`, { row: true, close: 'p37-notices' });
}

/* ---------- the editor: both languages, a preview, then what it is and who and when ---------- */
function p37EditorPage(e) {
  const n = e.n;
  const lang = e.lang || 'bn';
  const errs = e.errs || {};
  const title = (lang === 'bn' ? n.titleBn : n.titleEn) || '';
  const body = (lang === 'bn' ? n.bodyBn : n.bodyEn) || '';
  const tcount = (e.counts && e.counts[lang + '_title']) || title.length;
  const bcount = (e.counts && e.counts[lang + '_body']) || body.length;
  const errOf = (k) => errs[lang + '_' + k];
  const tab = (l) => {
    const whole = (l === 'bn' ? n.titleBn && n.bodyBn : n.titleEn && n.bodyEn);
    const bad = Object.keys(errs).some((k) => k.startsWith(l + '_'));
    const mark = bad ? `<span style="color:var(--danger);font-weight:700">!</span>` : whole ? `<span class="p37-tabchk">${I.check}</span>` : `<span class="c">${t('p37_empty_lang')}</span>`;
    return `<button class="chip ${lang === l ? 'on' : ''}" onclick="${e.tabTo && e.tabTo[l] ? `go('${e.tabTo[l]}')` : ''}">${l === 'bn' ? 'বাংলা' : 'English'} ${mark}</button>`;
  };
  const otherEmpty = lang === 'en' ? !n.titleBn : !n.titleEn;
  const words = `<div class="card"><div class="sechead"><h3>${t('p37_words')}</h3></div><div class="chips" style="margin-top:8px;margin-bottom:12px">${tab('bn')}${tab('en')}</div><div class="form">
    ${p37Fld(t('p37_title'), p37Cnt(tcount, 120, !!errOf('title')), `<input class="input" value="${p37Esc(title)}"${errOf('title') ? ' style="border-color:var(--danger)"' : ''}>`, '', errOf('title'))}
    ${p37Fld(t('p37_body'), p37Cnt(bcount, 5000, !!errOf('body')), `<textarea class="textarea p37-ta"${errOf('body') ? ' style="border-color:var(--danger)"' : ''}>${p37Esc(body)}</textarea>`, t('p37_fmt'), errOf('body'))}
    <div class="note">${n.id === 'n-15' && otherEmpty ? t('p37_one_lang_note') : t('p37_one_lang')}</div></div></div>`;
  const shown = lang === 'bn' ? n.titleBn || n.titleEn : n.titleEn || n.titleBn;
  const preview = `<div class="card"><div class="sechead"><h3>${t('p37_preview')}</h3></div><div class="p37-help" style="margin:4px 0 12px">${t(lang === 'bn' ? 'p37_preview_bn' : 'p37_preview_en')}</div><div class="p37-stack" style="gap:8px">${shown ? p37BoardCard(n, lang) : `<div class="note">${t('p37_missing_lang')}</div>`}</div></div>`;
  const kind = `<div class="card"><div class="sechead"><h3>${t('p37_kind_card')}</h3></div><div class="form" style="margin-top:8px">
    ${p37Fld(t('p37_category'), '', select(P37_CATS.map((c) => [c, t('p37_cat_' + c)]), n.category))}
    ${p37Fld(t('p37_severity'), '', `<div class="p37-radios">${['info', 'important', 'urgent'].map((s) => p37Radio(n.severity === s, t('p37_sev_' + s), t('p37_sev_' + s + '_d'))).join('')}</div>`)}</div></div>`;
  const planTags = `<div class="tagline" style="margin-top:6px">${PLANS.map((p) => `<span class="tag ${n.aud.plans && n.aud.plans.includes(p.name) ? 'on' : ''}">${p.name}</span>`).join('')}</div>`;
  const aud = `<div class="p37-radios">${p37Radio(n.aud.kind === 'all', t('p37_aud_o_all'))}${p37Radio(n.aud.kind === 'plans', t('p37_aud_o_plans'), '', n.aud.kind === 'plans' ? planTags : '')}${p37Radio(n.aud.kind === 'states', t('p37_aud_o_states'))}${p37Radio(n.aud.kind === 'tenant', t('p37_aud_o_tenant'), '', n.aud.kind === 'tenant' ? `<div class="search" style="margin-top:6px;height:40px">${I.search}<input placeholder="${t('p37_find_shop')}" value="${n.aud.shop || ''}"></div>` : '')}</div>`;
  const liveAt = e.liveAt || (n.publishAt ? 'at' : 'draft');
  const goesLive = e.mode === 'live'
    ? p37Fld(t('p37_live'), '', `<div class="input" style="display:flex;align-items:center;background:var(--n50);color:var(--muted);height:auto;min-height:44px;padding:10px 12px;white-space:normal;font-size:14px">${t('p37_live_fixed', { d: dateT(n.publishAt) })}</div>`)
    : p37Fld(t('p37_live'), '', `<div class="p37-radios">${p37Radio(liveAt === 'draft', t('p37_live_draft'))}${p37Radio(liveAt === 'now', t('p37_live_now'))}${p37Radio(liveAt === 'at', t('p37_live_at'), '', liveAt === 'at' ? `<div style="margin-top:6px">${input((n.publishAt || '2026-11-08T10:00').slice(0, 16), '', '', 'type=datetime-local')}</div>` : '')}</div>`, t('p37_live_help'));
  const windowF = n.category === 'maintenance' && n.windowStartsAt ? `${p37Fld(t('p37_window'), '', `<div style="display:flex;flex-direction:column;gap:8px"><span class="p37-cap">${t('p37_win_start')}</span>${input(n.windowStartsAt.slice(0, 16), '', '', 'type=datetime-local')}<span class="p37-cap">${t('p37_win_end')}</span>${input(n.windowEndsAt.slice(0, 16), '', '', 'type=datetime-local')}</div>`, t('p37_window_help'))}` : '';
  const who = `<div class="card"><div class="sechead"><h3>${t('p37_who_card')}</h3></div><div class="form" style="margin-top:8px">
    ${p37Fld(t('p37_audience'), '', aud, t('p37_aud_help'))}
    ${goesLive}
    ${p37Fld(t('p37_ends'), '', input(n.endsAt ? n.endsAt.slice(0, 16) : '', '', '', 'type=datetime-local'), t('p37_ends_help'))}
    ${windowF}
    ${sw(n.pinned, t('p37_pin'))}
    <div style="display:flex;flex-direction:column;gap:4px">${sw(n.ack, t('p37_ack'))}<div class="p37-help">${t('p37_ack_help')}</div></div></div></div>`;
  const primary = e.mode === 'live' ? btn(t('p37_save_changes'), 'primary', `go('${e.saveTo || 'p37-notice-saved'}')`) : liveAt === 'draft' ? btn(t('p37_save_draft'), 'primary', "go('p37-notice-drafted')") : btn(liveAt === 'now' ? t('p37_publish') : t('p37_schedule'), 'primary', `go('${e.pubTo || 'p37-notice-publish'}')`);
  const secondary = e.mode === 'live' ? backTo(e.back || 'p37-notice-live') : liveAt === 'draft' ? '' : btn(t('p37_save_draft'), 'ghost', "go('p37-notice-drafted')");
  const subChips = `${p37State(e.mode === 'live' ? 'live' : 'draft')}${n.tpl ? ` ${st('mute plain', t('p37_from_template', { t: t('p37_tp_' + n.tpl) }))}` : ''}`;
  const banners = `${Object.keys(errs).length ? `<div class="banner bad">${I.warn}<div><b>${t('p37_err_banner')}</b>${errs.top ? `<div>${errs.top}</div>` : ''}</div></div>` : ''}${e.mode === 'rate' ? `<div class="banner info">${I.info}<div>${t('p37_rate_banner', { d: dateS(P37_CHANGE.at), r: t('rn_' + P37_CHANGE.key), o: '৳0.55', n: '৳0.65' })}</div></div>` : ''}${e.mode === 'live' ? `<div class="banner warn">${I.warn}<div>${t('p37_live_banner')}</div></div>` : ''}`;
  return `${p37Head(e.mode === 'live' || e.mode === 'draft' ? p37Esc(p37Title(n)) : t('p37_new'))}
  <div class="ttl"><div><h1>${e.mode === 'live' || e.mode === 'draft' ? t('p37_edit_title') : t('p37_new')}</h1><div class="sub">${subChips}</div></div><div class="actions">${secondary}${primary}</div></div>
  ${banners}
  <div class="grid-side"><div class="p37-stack">${words}${preview}</div><div class="p37-stack">${kind}${who}</div></div>`;
}

/* ---------- one notice (GET /operator/notices/:id, with its earlier versions) ---------- */
function p37DetailPage(n) {
  if (ST.data === 'error') return `${p37Head('')}${errorBox()}`;
  const sent = n.status !== 'draft' && n.status !== 'scheduled';
  const acts = n.status === 'withdrawn' || n.status === 'ended' ? '' : `${n.ack && sent ? btn(t('p37_acks_btn'), 'ghost', "go('p37-notice-acks')") : ''}${btn(I.edit + t('edit'), 'ghost', `go('${({ 'n-11': 'p37-notice-edit-live', 'n-14': 'p37-notice-new' })[n.id] || ''}')`)}${btn(t('p37_withdraw'), 'quiet', `go('${n.id === 'n-12' ? 'p37-notice-withdraw' : ''}')`)}`;
  const banner = n.status === 'scheduled' ? `<div class="banner info">${I.clock}<div>${t('p37_sched_banner', { d: dateT(n.publishAt) })}</div></div>` : n.status === 'withdrawn' ? `<div class="banner warn">${I.info}<div>${t('p37_wd_banner', { d: dateT(n.withdrawnAt) })}</div></div>` : n.status === 'ended' ? `<div class="banner info">${I.info}<div>${t('p37_ended_banner', { d: dateT(n.endsAt) })}</div></div>` : '';
  const c = n.counts;
  const stats = sent ? `<div class="stats">
    <div class="stat"><span class="k">${t('p37_k_sent')}</span><span class="v">${nfmt(c.shops)}</span><span class="d">${t('p37_k_sent_d')}</span></div>
    <div class="stat"><span class="k">${t('p37_k_people')}</span><span class="v">${nfmt(c.people)}</span><span class="d">${t('p37_k_people_d')}</span></div>
    <div class="stat"><span class="k">${t('p37_k_reads')}</span><span class="v">${nfmt(c.reads)}</span><span class="d">${t('p37_k_reads_d')}</span></div>
    ${n.ack ? `<button class="stat lk ${n.pending ? 'flag' : ''}" onclick="go('p37-notice-acks')"><span class="k">${t('p37_k_ack')}</span><span class="v ${n.pending ? 'warn' : ''}">${nfmt(c.acknowledged)}</span><span class="d">${t('p37_k_ack_d', { p: nfmt(n.pending || 0) })}</span></button>` : `<div class="stat"><span class="k">${t('p37_k_ack')}</span><span class="v">—</span><span class="d">${t('p37_k_noack')}</span></div>`}
  </div>` : '';
  const words = (l) => {
    const title = l === 'bn' ? n.titleBn : n.titleEn;
    const body = l === 'bn' ? n.bodyBn : n.bodyEn;
    return `<div class="card"><div class="sechead"><h3>${t(l === 'bn' ? 'p37_in_bn' : 'p37_in_en')}</h3></div>${title ? `<div class="p37-bt" style="margin-top:8px">${p37Esc(title)}</div><div style="margin-top:6px">${p37Md(body)}</div>` : `<div class="note" style="margin-top:8px">${t('p37_missing_lang')}</div>`}</div>`;
  };
  const versions = sent ? `<div class="card"><div class="sechead"><h3>${t('p37_versions')}</h3></div><div class="p37-help" style="margin-top:4px">${t('p37_versions_hint')}</div>${n.versions && n.versions.length ? `<div class="list" style="margin:8px -16px -16px">${n.versions.map((v) => `<div class="row wrap"><span class="body"><span class="l1">${t('p37_version_line', { d: dateT(v.replacedAt), who: v.by })}</span></span>${btn(t('p37_version_open'), 'ghost sm', "go('p37-notice-version')")}</div>`).join('')}</div>` : `<div class="note" style="margin-top:8px">${t('p37_noversions')}</div>`}</div>` : '';
  const kv = (k, v) => `<span class="k">${k}</span><span class="v">${v}</span>`;
  const facts = `<div class="card"><h3>${t('p37_facts')}</h3><div class="kv" style="margin-top:10px">
    ${kv(t('p37_c_aud'), p37Aud(n.aud))}
    ${kv(sent ? t('p37_f_live') : t('p37_f_goes'), n.publishAt ? dateT(n.publishAt) : t('p37_f_never'))}
    ${kv(t('p37_f_ends'), n.endsAt ? dateT(n.endsAt) : t('p37_f_never'))}
    ${n.windowStartsAt ? kv(t('p37_f_window'), `${dateT(n.windowStartsAt)} – ${dateT(n.windowEndsAt)}`) : ''}
    ${kv(t('p37_f_pin'), n.pinned ? t('p37_yes') : t('p37_no'))}
    ${kv(t('p37_f_ack'), n.ack ? t('p37_asked') : t('p37_no'))}
    ${kv(t('p37_f_email'), n.severity === 'info' ? t('p37_f_email_no') : t('p37_f_email_yes'))}
    ${n.rateChangeId ? kv(t('p37_f_rate'), `<a href="#" onclick="go('p37-rate-linked');return false">${t('rn_' + P37_CHANGE.key)} ৳0.55 → ৳0.65 · ${dateS(P37_CHANGE.at)}</a>`) : ''}
    ${kv(t('p37_f_by'), `ops@lytro.app · ${dateT(n.createdAt)}`)}
  </div></div>`;
  return `${p37Head(p37Esc(p37Title(n)))}
  <div class="ttl"><div><h1>${p37Pin(n)}${p37Esc(p37Title(n))}</h1><div class="sub">${p37State(n.status)} ${p37Sev(n.severity)} ${st('mute plain', t('p37_cat_' + n.category))}${n.editedAt ? ` ${st('mute plain', t('p37_updated', { d: dateT(n.editedAt) }))}` : ''}</div></div>${acts ? `<div class="actions">${acts}</div>` : ''}</div>
  ${banner}${stats}
  <div class="grid-side"><div class="p37-stack">${words('bn')}${words('en')}${versions}</div><div class="p37-stack">${facts}</div></div>`;
}

/* ---------- who said "I understand" (GET /operator/notices/:id/acknowledgments) ---------- */
function p37AcksPage(tab) {
  const n = p37N('n-11');
  if (ST.data === 'error') return `${p37Head(p37Esc(p37Title(n)))}${errorBox()}`;
  const busy = ST.data === 'busy';
  const acked = busy ? P37_ACKED : [];
  const pending = busy ? P37_PENDING : [];
  const counts = { pending: busy ? 171 : 0, acked: busy ? 41 : 0 };
  const chip = (k, scr) => `<button class="chip ${tab === k ? 'on' : ''}" onclick="go('${scr}')">${t(k === 'pending' ? 'p37_t_pending' : 'p37_t_acked')} <span class="c">${counts[k]}</span></button>`;
  const cols = tab === 'acked'
    ? [{ k: 'shop', label: t('c_shop'), w: 'minmax(180px,1.4fr)', cls: 'main' }, { k: 'slug', label: t('c_slug'), w: 'minmax(160px,1fr)' }, { k: 'at', label: t('p37_c_acked_at'), w: '200px' }]
    : [{ k: 'shop', label: t('c_shop'), w: 'minmax(180px,1.4fr)', cls: 'main' }, { k: 'slug', label: t('c_slug'), w: 'minmax(160px,1fr)' }, { k: 'acts', label: '', w: '90px', cls: 'acts' }];
  const rows = (tab === 'acked' ? acked : pending).map((r) => ({ cells: { shop: r.shop, slug: `<span style="color:var(--muted)">${r.slug}.lytro.app</span>`, at: `<span class="num">${t('p37_ack_line', { d: dateT(r.at || '2026-11-05T10:00:00+06:00') })}</span>`, acts: btn(t('open'), 'ghost sm', "go('tenant')") } }));
  const empty = tab === 'acked' ? emptyBox(t('p37_acks_empty_a'), t('p37_acks_empty_a_hint'), 'bell') : emptyBox(t('p37_acks_empty_p'), t('p37_acks_empty_p_hint'), 'check');
  return `<div class="crumbs"><a onclick="go('p37-notices')">${t('notices')}</a>${I.chev}<a onclick="go('p37-notice-live')" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p37Esc(p37Title(n))}</a></div>
  <div class="ttl"><div><h1>${t('p37_acks_btn')}</h1><div class="sub">${t('p37_acks_sub')}</div></div></div>
  <div class="chips">${chip('pending', 'p37-notice-acks')}${chip('acked', 'p37-notice-acks-done')}</div>
  <div class="search">${I.search}<input placeholder="${t('p37_acks_search')}"></div>
  ${table(cols, rows, empty)}`;
}

(function init() {
  const sel = document.getElementById('selScreen'); const groups = {};
  for (const [id, s] of Object.entries(SCREENS)) (groups[s.group] = groups[s.group] || []).push([id, s.label]);
  for (const [g, items] of Object.entries(groups)) { const og = document.createElement('optgroup'); og.label = g; for (const [id, label] of items) { const o = document.createElement('option'); o.value = id; o.textContent = label; og.appendChild(o); } sel.appendChild(og); }
  sel.value = ST.screen;
  sel.addEventListener('change', () => { ST.screen = sel.value; render(); });
  document.querySelectorAll('#segDevice button').forEach((b) => b.addEventListener('click', () => { ST.device = b.dataset.v; document.querySelectorAll('#segDevice button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));
  document.querySelectorAll('#segLang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.v)));
  document.getElementById('selState').addEventListener('change', (e) => { ST.data = e.target.value; render(); });
  render();
})();
