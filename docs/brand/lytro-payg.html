<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro PAYG fair use sketch</title>
<meta name="description" content="Sketch for docs/PAYG-FAIR-USE-PLAN.md: the two-step order unlock, the activation top-up, the PAYG API charge, the storefront without contact buttons, the operator report and the lytro.app wording. Dashboard look copied from docs/brand/lytro-dashboard.html.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Copied from docs/brand/lytro-dashboard.html (its first style block), so these screens are the dashboard’s own look. */
/* ---------- Lytro tokens (docs/brand/tokens.css) ---------- */
:root{
  --teal-50:#effaf8;--teal-100:#ddf5f2;--teal-200:#b9ece6;--teal-300:#7fdcd3;--teal-400:#3ec4b9;--teal-500:#17a89e;--teal-600:#107f78;--teal-700:#0e6b66;--teal-800:#0a4f4b;--teal-900:#063b38;
  --mar-100:#fdf0d1;--mar-300:#f8cf6e;--mar-500:#f2a516;--mar-700:#9a6004;
  --ink:#10201f;--n700:#2c3f3e;--n500:#5b6e6d;--n400:#7e8f8e;--n300:#a9b9b8;--n200:#d5dfde;--n100:#eaf0ef;--n50:#f6f9f8;--white:#fff;
  --success:#1b7a43;--success-soft:#e3f3e9;--warning:#9a6004;--warning-soft:#fdf0d1;--danger:#c8323b;--danger-soft:#fbe7e8;--info:#0e6b66;--info-soft:#ddf5f2;
  --bg:var(--n50);--surface:var(--white);--line:var(--n200);--line-strong:var(--n300);--text:var(--ink);--muted:var(--n700);--subtle:var(--n500);
  --primary:var(--teal-700);--primary-hover:var(--teal-800);--on-primary:#fff;--primary-soft:var(--teal-50);--accent:var(--mar-500);--on-accent:var(--ink);--accent-text:var(--mar-700);--chrome:var(--teal-900);--focus:var(--teal-500);
  --font-ui:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;--font-display:'Plus Jakarta Sans','Inter','Noto Sans Bengali',sans-serif;
  --r-control:6px;--r-card:10px;--r-sheet:16px;--shadow:0 1px 2px rgba(16,32,31,.06),0 4px 12px rgba(16,32,31,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);color:var(--text);background:#e6ebea;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- Harness (not product UI) ---------- */
.tb{position:sticky;top:0;z-index:50;background:var(--ink);color:#eaf0ef;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;font-size:13px}
.tb .brand{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;font-size:16px;color:#fff;margin-right:8px}
.tb label{display:flex;align-items:center;gap:6px;color:#a9b9b8}
.tb select{background:#1a3230;color:#fff;border:1px solid #335450;border-radius:6px;padding:5px 8px;font-size:13px}
.tb .seg{display:inline-flex;border:1px solid #335450;border-radius:6px;overflow:hidden}
.tb .seg button{padding:5px 10px;color:#a9b9b8}
.tb .seg button.on{background:var(--teal-400);color:var(--ink);font-weight:600}
.tb .note{margin-left:auto;color:#7e8f8e}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.frame{container-type:inline-size;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(16,32,31,.25)}
.frame.phone{width:390px;height:844px;border-radius:40px;border:8px solid #0b1514}
.frame.tablet{width:820px;height:1000px;border-radius:24px;border:8px solid #0b1514}
.frame.desktop{width:1282px;height:820px;border-radius:12px;border:1px solid #c9d3d2}
.frame .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;background:var(--surface)}
.frame.desktop .statusbar{display:none}
.frame .urlbar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;background:#f1f4f3;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.frame.desktop .urlbar{display:flex}
.frame .urlbar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d5dfde;margin-right:6px}
.frame .urlbar .url{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;flex:1;max-width:520px}
.caption{max-width:1280px;margin:0 auto;padding:0 16px 40px;color:#2c3f3e;font-size:13px;line-height:1.6}
.caption b{color:var(--ink)}

/* ---------- Shell ---------- */
.shell{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.body{flex:1;display:flex;flex-direction:column;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.split.detail-only .list-col{display:none}
.split.detail-only .detail{display:flex;flex-direction:column;gap:16px}
.frame.phone .shell{top:44px}
.frame.desktop .shell{top:40px}
.appbar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px 0 16px}
.appbar .shop{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.appbar .shop .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--n700);position:relative}
.appbar .ib .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--primary);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.mono{width:32px;height:32px;border-radius:8px;background:var(--teal-700);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.mono.lg{width:40px;height:40px;font-size:18px}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.tabbar{flex:none;height:64px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 0 0}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--n700);position:relative}
.tabbar button svg.i{width:24px;height:24px}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar .pill{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rail,.secnav,.header{display:none}

/* ---------- Page ---------- */
.page{display:flex;flex-direction:column;gap:16px;padding:16px 16px 24px;min-height:100%}
.page[data-lang=bn],.frame[data-lang=bn] .page{line-height:1.6}
.frame[data-lang=bn] .appbar,.frame[data-lang=bn] .tabbar,.frame[data-lang=bn] .sheet{line-height:1.6}
.ttl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ttl h1{font-size:22px;font-weight:700;line-height:1.3;flex:1 1 auto;min-width:0}
.ttl h1.num{overflow-wrap:anywhere}
.ttl .actions{flex:0 0 auto;margin-left:auto}
.ttl .sub{font-size:14px;color:var(--muted);margin-top:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.frame[data-lang=bn] .eyebrow{text-transform:none;letter-spacing:0;font-size:14px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead h2{font-size:17px;font-weight:600}
.sechead a,.sechead button.lnk{font-size:14px;color:var(--primary);font-weight:500;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.sechead button.lnk svg.i{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--n700);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .c{font-size:12px;font-weight:600;padding:0 6px;height:18px;border-radius:999px;background:var(--n100);color:var(--n700);display:inline-flex;align-items:center}
.chip.on .c{background:rgba(255,255,255,.22);color:#fff}
.chips.sec .chip{height:32px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.card .hint{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;width:100%;text-align:left;color:inherit;text-decoration:none}
.row .lead{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--n100);color:var(--n700);font-weight:600;overflow:hidden}
.row .lead img{width:100%;height:100%;object-fit:cover}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row[onclick]{cursor:pointer}
.row .l1{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .l1 .st,.row .l1 .fdot{vertical-align:middle}
.row .l1 .ono{color:var(--muted);font-weight:600;margin-right:6px}
.row .l2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .trail{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-weight:600;font-size:16px}
.row .time{font-size:13px;color:var(--subtle)}
.row .chev{color:var(--n400)}
.row.sel{background:var(--primary-soft)}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px}
.st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.warn{background:var(--warning-soft);color:var(--warning)}
.st.info{background:var(--info-soft);color:var(--info)}
.st.ok{background:var(--success-soft);color:var(--success)}
.st.bad{background:var(--danger-soft);color:var(--danger)}
.st.neu{background:var(--n100);color:var(--n700)}
.job{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;width:100%;text-align:left}
.job .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.job .ic.mar{background:var(--warning-soft);color:var(--warning)}
.job .ic.teal{background:var(--info-soft);color:var(--info)}
.job .ic.red{background:var(--danger-soft);color:var(--danger)}
.job .ic.grn{background:var(--success-soft);color:var(--success)}
.job .tx{flex:1;font-size:16px;font-weight:500;min-width:0}
.job .tx small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.job .cnt{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.stats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px}
.stat .lb{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:28px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted)}
.stat .d{font-size:13px;color:var(--subtle);margin-top:4px}
.stat .d.ok{color:var(--success)}
.stat .d.bad{color:var(--danger)}
.stats.tight{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0}
.stats.tight .stat{flex:auto;padding:10px 12px}
.stats.tight .stat .v{font-size:20px}
.stats.tight .stat .lb{font-size:12px}
.btn{height:48px;padding:0 20px;border-radius:8px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal;text-align:center;line-height:1.2}
.btn.p{background:var(--primary);color:#fff}
.btn.a{background:var(--accent);color:var(--on-accent)}
.btn.o{border:1px solid var(--line-strong);color:var(--n700);background:var(--surface)}
.btn.g{color:var(--primary);padding:0 12px}
.btn.d{background:var(--danger);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.xs{height:32px;padding:0 12px;font-size:13px;font-weight:600}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actionbar{position:sticky;bottom:0;margin:8px -16px -24px;padding:12px 16px calc(12px + 8px);background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;z-index:5}
.actionbar .btn{flex:1}
.actionbar .btn.o{flex:0 0 auto}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-card);font-size:14px;line-height:1.5}
.banner svg.i{margin-top:2px}
.banner .b{flex:1}
.banner a{font-weight:600;white-space:nowrap;text-decoration:none}
.banner.info{background:var(--info-soft);color:var(--teal-900)}
.banner.warn{background:var(--warning-soft);color:var(--mar-700)}
.banner.neu{background:var(--n100);color:var(--n700)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.supportbar{background:var(--ink);color:var(--mar-300);padding:10px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;flex:none}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg.i{width:48px;height:48px;color:var(--n300);stroke-width:1.25}
.empty p{font-size:16px;color:var(--muted);max-width:280px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;color:var(--n700)}
.field .ctl{height:48px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--surface);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:16px}
.field .ctl.ta{height:auto;min-height:96px;align-items:flex-start;padding:12px}
.field .ctl .pre{color:var(--muted);font-weight:500}
.field .ctl .ph{color:var(--n500)}
.field .ctl .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .help{font-size:13px;color:var(--muted)}
.field .err{font-size:13px;color:var(--danger);font-weight:500}
.field .ctl.bad{border-color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.search{height:44px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--n500);font-size:16px;flex:1}
.search span{flex:1}
.toolrow{display:flex;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--n700);flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500;text-align:right}
.kv.total .v,.kv.total .k{font-weight:600;font-size:16px;color:var(--text)}
.kv .due{color:var(--accent-text);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--n100);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.bar i.warn{background:var(--mar-500)}
.bar i.bad{background:var(--danger)}
.bar i.ok{background:var(--success)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:20px 1fr auto;gap:0 12px;padding:6px 0;position:relative}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--n300);margin:6px auto 0;position:relative;z-index:1}
.tl .dot.on{background:var(--primary)}
.tl .dot.bad{background:var(--danger)}
.tl:not(:last-child)::before{content:"";position:absolute;left:9px;top:18px;bottom:-8px;width:2px;background:var(--n100)}
.tl .tx{font-size:15px}
.tl .tx small{display:block;color:var(--muted);font-size:13px}
.tl .tm{font-size:13px;color:var(--subtle);white-space:nowrap}
.daylbl{font-size:13px;font-weight:600;color:var(--n700);padding:12px 16px 4px;background:var(--n50)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--n300);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--primary)}
.switch.on::after{left:21px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--n300);flex:none}
.radio.on{border-color:var(--primary);border-width:7px}
.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--n300);flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.checkbox.on{background:var(--primary);border-color:var(--primary)}
.checkbox svg.i{width:14px;height:14px;stroke-width:3}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-100);color:var(--teal-800);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.thumb{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,var(--n100),var(--n200));flex:none;display:flex;align-items:center;justify-content:center;color:var(--n400)}
.thumb.lg{width:72px;height:72px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12);vertical-align:-1px;margin-right:4px}
.matrixwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.matrix{border-collapse:collapse;min-width:100%;font-size:14px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.matrix th{font-size:12px;font-weight:600;color:var(--n700);letter-spacing:.02em}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface)}
.matrix .in{height:36px;width:92px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums}
.matrix .fill{font-size:12px;color:var(--primary);font-weight:600;display:block;margin-top:2px}
.srow{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.srow .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;font-size:15px}
.srow .f{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px}
.srow .f .lb{font-size:12px;color:var(--muted)}
.srow .f .v{font-size:16px;font-weight:600}
.srow .f .v.big{font-size:20px}
.srow .a{display:flex;gap:4px;justify-content:flex-end}
.srow .n{font-size:13px;color:var(--muted)}
.stocknum{display:flex;align-items:center;justify-content:center;gap:16px}
.stocknum .v{font-size:40px;font-weight:600;min-width:80px;text-align:center;letter-spacing:-.02em}
.stocknum button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center}
.reasons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;font-weight:600;color:var(--n700);letter-spacing:.02em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--n50)}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.steps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--n300);display:inline-block}
.steps i.on{background:var(--primary)}
.steps i.done{background:var(--success)}
.plancard{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;background:var(--surface);flex:0 0 260px}
.plancard.cur{border-color:var(--primary);background:var(--primary-soft)}
.plancard.dash{border-style:dashed}
.plancard .pn{font-weight:600;font-size:17px}
.plancard .pp{font-size:28px;font-weight:600;margin:6px 0 2px}
.plancard .pp small{font-size:14px;font-weight:500;color:var(--muted)}
.plancard ul{list-style:none;margin:10px 0 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--n700)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.hscroll::-webkit-scrollbar{display:none}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qa button{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:15px;font-weight:500;text-align:left}
.qa button .ic{width:40px;height:40px;border-radius:10px;background:var(--info-soft);color:var(--info);display:flex;align-items:center;justify-content:center}
.menu .row{min-height:56px}
.menu .row .lead{width:36px;height:36px;background:var(--info-soft);color:var(--info)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;gap:12px;z-index:30;box-shadow:var(--shadow)}
.toast b{color:var(--teal-300);font-weight:600}
.powered{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--n500);justify-content:center;padding:8px}
.powered svg{width:16px;height:16px}
.notice-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(16,32,31,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;width:100%;max-height:92%;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(16,32,31,.2)}
.sheet .grab{width:40px;height:4px;border-radius:999px;background:var(--n300);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.sheet .sh h2{font-size:18px;font-weight:700}
.sheet .sh .x{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--n700)}
.sheet .sb{overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.sheet .sf{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface)}
.sheet .sf .btn{flex:1}
.dialog{background:var(--surface);border-radius:var(--r-sheet);width:calc(100% - 48px);max-width:400px;padding:20px;margin-bottom:40%;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-size:18px;font-weight:700}
.dialog p{font-size:15px;color:var(--muted)}
.scrim.center{align-items:center}
.split{display:flex;flex-direction:column;gap:16px}
.split .list-col{display:flex;flex-direction:column;gap:16px}
.split .detail{display:none}
.only-desk{display:none}

/* ---------- 640: tablet ---------- */
@container (min-width: 640px){
  .page{padding:24px;gap:24px}
  .chips,.stats,.hscroll,.matrixwrap{margin:0;padding-left:0;padding-right:0}
  .grid2{grid-template-columns:1fr 1fr}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{flex:auto}
  .qa{grid-template-columns:repeat(3,1fr)}
  .actionbar{margin:8px -24px -24px;padding:12px 24px 16px}
  .scrim{align-items:stretch;justify-content:flex-end}
  .sheet{width:480px;max-height:none;border-radius:0;height:100%}
  .sheet .grab{display:none}
  .sheet .sh{padding-top:20px}
  .dialog{align-self:center;margin:0 auto}
  .scrim.center{justify-content:center}
  .srow{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:16px}
  .srow .h{flex-direction:column;align-items:flex-start;gap:4px}
  .srow .f{max-width:380px;grid-template-columns:repeat(3,1fr)}
  .row .trail{flex-direction:row;align-items:center;gap:16px}
  .row .trail .time{min-width:60px;text-align:right}
}
/* ---------- 1024: desktop rail + split ---------- */
@container (min-width: 1024px){
  .body{flex-direction:row}
  .appbar,.tabbar{display:none}
  .rail{display:flex;flex-direction:column;width:72px;flex:none;background:var(--chrome);color:#fff;padding:12px 0;align-items:center;gap:4px}
  .rail .mark{width:32px;height:32px;margin-bottom:8px}
  .rail button{width:60px;height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:#cfe3e0;position:relative}
  .rail button svg.i{width:22px;height:22px}
  .rail button.on{background:var(--teal-800);color:#fff;font-weight:600}
  .rail .pill{position:absolute;top:4px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .rail .sp{flex:1}
  .rail .foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:4px}
  .rail .foot .mono{background:var(--teal-700);border:1px solid rgba(255,255,255,.2)}
  .rail .foot .pw{color:#a9b9b8}
  .rail .foot .pw svg{width:16px;height:16px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .header{display:flex;align-items:center;gap:12px;height:64px;flex:none;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line)}
  .header h1{font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header .search{flex:0 0 320px;height:40px;font-size:14px}
  .header .ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--n700);border:1px solid var(--line);position:relative}
  .header .ib .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .header .lang{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;color:var(--n700)}
  .page{padding:32px;gap:24px;max-width:1120px;width:100%;margin:0 auto}
  .page > .ttl h1{display:none}
  .actionbar{position:static;order:-1;margin:0;padding:0;border:0;background:none;justify-content:flex-end}
  .actionbar .btn{flex:0 0 auto;min-width:160px}
  .split{flex-direction:row;align-items:flex-start}
  .split .list-col{flex:0 0 400px;min-width:0;position:sticky;top:0}
  .split .list-col .row .trail{flex-direction:column;align-items:flex-end;gap:4px}
  .split .list-col .only-desk{display:none}
  .split .list-col .chips{flex-wrap:wrap}
  .page > .ttl{justify-content:flex-end}
  .split .detail{display:flex;flex-direction:column;gap:24px;flex:1;min-width:0}
  .split.detail-only .list-col{display:flex}
  .split .detail{gap:24px}
  .two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
  .two > *{min-width:0}
  .only-desk{display:block}
  .only-phone{display:none}
  .toast{left:auto;right:32px;bottom:32px;width:360px}
  .table-mode .list{display:none}
  .table-mode .table{display:table}
}
/* ---------- 1280: secondary column ---------- */
@container (min-width: 1280px){
  .secnav{display:flex;flex-direction:column;width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
  .secnav .shop{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .secnav .shop .nm{font-weight:600;font-size:15px;line-height:1.3}
  .secnav .shop .ad{font-size:12px;color:var(--subtle)}
  .secnav .hub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);padding:8px 8px 4px}
  .frame[data-lang=bn] .secnav .hub{text-transform:none;letter-spacing:0;font-size:13px}
  .secnav button{height:40px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;color:var(--n700);position:relative}
  .secnav button.on{color:var(--primary);background:var(--primary-soft);font-weight:600}
  .secnav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
  .secnav button .c{font-size:12px;font-weight:600;padding:0 6px;height:18px;border-radius:999px;background:var(--n100);color:var(--n700);display:inline-flex;align-items:center}
  .chips.sec{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- This sketch's harness ---------- */
.pf-sec{padding:8px 0 24px;border-bottom:1px solid #cfd8d7}
.pf-cap{max-width:1300px;margin:0 auto;padding:24px 24px 0;color:#2c3f3e;font-size:14px;line-height:1.6}
.pf-cap h2{font-family:var(--font-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.pf-cap h2 code{font-family:var(--font-mono,monospace);font-size:13px;background:#d5dfde;border-radius:4px;padding:2px 6px;margin-right:8px;vertical-align:2px}
.pf-cap p{max-width:980px}
.pf-cap b{color:var(--ink)}
.pf-stage{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:24px 16px 16px}
.tb{position:relative}
.tb a{color:#a9b9b8;text-decoration:none;font-size:12px}
.tb a:hover{color:#fff}

/* ---------- Additions in the dashboard's look (pf-) ---------- */
.appbar .shop .two{display:flex;flex-direction:column;gap:2px;min-width:0}
.pf-bal{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 3px;border-radius:999px;font-size:13px;font-weight:600;background:var(--primary-soft);color:var(--teal-800);white-space:nowrap;align-self:flex-start}
.pf-bal i{width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.pf-bal.low{background:var(--danger-soft);color:var(--danger)}
.pf-bal.low i{background:var(--danger)}
.header .pf-bal{height:40px;padding:0 14px 0 6px;font-size:14px}
.header .pf-bal i{width:26px;height:26px;font-size:13px}
.mask{letter-spacing:.06em;font-variant-numeric:tabular-nums}
.st svg.i{width:13px;height:13px;margin-right:3px;stroke-width:2.2}
.pf-card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.pf-card-h h3{margin:0}
.pf-card-h .lnk{font-size:14px;color:var(--primary);font-weight:500}
.pf-lockcard{background:var(--primary-soft);border:1px solid var(--teal-200);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.pf-lockcard .h{display:flex;gap:10px;align-items:flex-start}
.pf-lockcard .h .ic{width:36px;height:36px;border-radius:10px;background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--teal-200)}
.pf-lockcard .h b{display:block;font-size:16px;color:var(--teal-900)}
.pf-lockcard .h span{font-size:14px;color:var(--teal-900)}
.pf-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pf-step{background:var(--surface);border:1px solid var(--teal-200);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--n700)}
.pf-step .n{font-size:12px;font-weight:600;color:var(--subtle)}
.pf-step b{font-size:14px;color:var(--ink);font-weight:600}
.pf-step.done{background:var(--success-soft);border-color:#bfe3cc}
.pf-step.done .n{color:var(--success)}
.pf-step.now{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.pf-step.now .n{color:var(--primary)}
.pf-cust{display:flex;align-items:center;gap:12px}
.pf-cust .who{flex:1;min-width:0}
.pf-cust .nm{font-size:17px;font-weight:500}
.pf-cust .ph{font-size:16px;color:var(--n700);margin-top:2px}
.pf-cust .avatar{width:44px;height:44px;font-size:17px}
.pf-cust .avatar.q{background:var(--n100);color:var(--n500)}
.pf-hidden{display:flex;align-items:center;gap:8px;color:var(--n700);font-size:14px;background:var(--n50);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px}
.pf-hidden svg.i{width:16px;height:16px;color:var(--n500)}
.pf-line{font-size:15px;color:var(--n700);padding-top:10px}
.pf-line + .pf-line{padding-top:4px}
.pf-sep{border-top:1px solid var(--line);margin:12px 0 0}
.pf-fraud h4{font-size:15px;font-weight:700;margin:12px 0 2px}
.pf-fraud .t{font-size:14px;color:var(--n700)}
.pf-fraud .t + .t{margin-top:6px}
.pf-fraud .pct{display:flex;align-items:center;gap:10px;margin-top:8px}
.pf-fraud .pct .bar{flex:1}
.pf-fraud .pct b{font-size:14px;color:var(--success)}
.pf-item{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.pf-item + .pf-item{border-top:1px solid var(--line)}
.pf-item .ph{width:56px;height:56px;border-radius:10px;flex:none}
.pf-item .nm{font-size:15px;font-weight:600;line-height:1.35}
.pf-item .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pf-item .pr{margin-left:auto;font-weight:600;font-size:15px;white-space:nowrap;padding-left:8px}
.pf-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--n700);white-space:nowrap}
.pf-chip.q{background:var(--primary-soft);border-color:var(--teal-200);color:var(--teal-800);font-weight:600}
.ph1{background:linear-gradient(135deg,#2f3a1f,#6f7444 55%,#b9b38a)}
.ph2{background:linear-gradient(135deg,#9b1c3c,#e05b7c 60%,#f3c1cd)}
.ph3{background:linear-gradient(135deg,#7d4d8f,#d59ac6 60%,#f1dbe9)}
.ph4{background:linear-gradient(135deg,#2c3e50,#7f9bb0 60%,#d8e0e6)}
.ph5{background:linear-gradient(135deg,#6b2020,#b3524a 60%,#ead2c4)}
.pf-calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pf-calls .btn{height:44px;font-size:14px}
.pf-calls .btn small{font-weight:500;color:inherit;opacity:.85}
.pf-call-ok{border:1px solid var(--primary)!important;color:var(--primary)!important;background:var(--primary-soft)!important}
.pf-amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf-amts button{height:48px;border-radius:8px;border:1px solid var(--line-strong);font-weight:600;font-size:16px;background:var(--surface)}
.pf-amts button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.pf-way{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px}
.pf-way.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.pf-way .lg{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.pf-way .tx{flex:1;font-size:15px;font-weight:500}
.pf-way .tx small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.pf-fee{display:flex;flex-direction:column;gap:2px;background:var(--n50);border:1px solid var(--line);border-radius:8px;padding:12px}
.pf-fee .kv{padding:6px 0}
.pf-hero{border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line)}
.pf-hero.paused{border:1px solid #f1c46b;background:linear-gradient(180deg,#fff8e6,#fff)}
.pf-hero .top{display:flex;gap:12px;align-items:flex-start}
.pf-hero .top .ic{width:44px;height:44px;border-radius:12px;background:var(--warning-soft);color:var(--warning);display:flex;align-items:center;justify-content:center;flex:none}
.pf-hero h3{font-size:18px;font-weight:700;line-height:1.35}
.pf-hero p{font-size:15px;color:var(--n700)}
.pf-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.pf-hero .acts .btn{padding:0 12px}
.pf-hero .acts .btn.p{flex:3 1 0}
.pf-hero .acts .btn.o{flex:2 1 0}
.pf-hero .fine{font-size:13px;color:var(--n700);display:flex;gap:6px;align-items:flex-start}
.pf-hero .fine svg.i{width:16px;height:16px;margin-top:2px;color:var(--success)}
.pf-sms{max-width:330px;background:#e9edec;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:15px;line-height:1.55;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pf-sms small{display:block;font-size:12px;color:var(--n700);margin-bottom:4px;font-weight:600}
.pf-smswrap{display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:380px;padding:16px;background:#e6ebea;border-radius:12px}
.pf-smswrap h4{font-size:14px;font-weight:600;color:var(--n700)}
.pf-usage .big{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.pf-usage .big small{font-size:15px;color:var(--n700);font-weight:500}
.pf-seg{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--n100);margin:12px 0 8px}
.pf-seg i{display:block;height:100%}
.pf-seg .free{background:var(--success)}
.pf-seg .paid{background:var(--primary)}
.pf-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--n700)}
.pf-legend span{display:inline-flex;align-items:center;gap:6px}
.pf-legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.pf-cap-v{display:flex;align-items:baseline;gap:8px}
.pf-cap-v b{font-size:28px;font-weight:600}
.pf-cap-v span{color:var(--n700);font-size:14px}
.pf-days .kv{font-size:14px}
.pf-days .kv .k b{color:var(--ink);font-weight:500}
.pf-note{font-size:13px;color:var(--n700);display:flex;gap:6px;align-items:flex-start}
.pf-note svg.i{width:16px;height:16px;margin-top:2px;flex:none}

/* ---------- Storefront (sf-): the shop's look, as rongila.lytro.app draws it today ---------- */
.sfr{--sf-ink:#16213e;--sf-bg:#f5f3ef;--sf-surface:#fff;--sf-line:#e2ddd4;--sf-muted:#4a4f5c;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:var(--sf-bg);color:#1d2230}
.sfr .hdr{background:var(--sf-bg);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--sf-line)}
.sfr .logo{width:36px;height:36px;border-radius:8px;background:var(--sf-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:18px;flex:none}
.sfr .sname{font-family:Georgia,'Noto Serif Bengali',serif;font-weight:700;font-size:19px;color:var(--sf-ink);flex:1;white-space:nowrap}
.sfr .hdr svg.i{width:22px;height:22px;color:var(--sf-ink)}
.sfr .cats{display:flex;gap:8px;padding:10px 14px;overflow:hidden;border-bottom:1px solid var(--sf-line)}
.sfr .cats span{flex:none;height:30px;padding:0 12px;border-radius:999px;background:#ebe6dd;font-weight:600;font-size:14px;display:inline-flex;align-items:center;color:var(--sf-ink)}
.sfr .cats span.on{background:var(--sf-ink);color:#fff}
.sfr .img{height:300px;display:flex;align-items:flex-end;justify-content:flex-start;padding:12px;color:rgba(255,255,255,.85);font-size:12px}
.sfr .pb{padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sf-surface)}
.sfr .pb .cat{font-size:13px;color:var(--sf-muted);font-weight:600}
.sfr .pb h1{font-size:21px;font-weight:700;color:var(--sf-ink);line-height:1.35}
.sfr .price{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sfr .price b{font-size:24px;color:var(--sf-ink)}
.sfr .price s{color:var(--sf-muted);font-size:15px}
.sfr .price .off{background:#fde4e6;color:#b4232f;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px}
.sfr .btns{display:flex;gap:8px}
.sfr .sbtn{height:46px;border-radius:10px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.sfr .sbtn.p{background:var(--sf-ink);color:#fff}
.sfr .sbtn.o{border:1.5px solid var(--sf-ink);color:var(--sf-ink);background:#fff}
.sfr .ask{border-top:1px solid var(--sf-line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sfr .ask .t{font-size:14px;color:var(--sf-muted);font-weight:600}
.sfr .ask .b{display:flex;gap:8px}
.sfr .ask .b span{flex:1;height:42px;border-radius:10px;border:1px solid var(--sf-line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;color:var(--sf-ink);background:#fff}
.sfr .ask .b span svg.i{width:18px;height:18px}
.sfr .desc{font-size:15px;color:#2b3040;line-height:1.65}
.sfr .foot{background:var(--sf-ink);color:#e7e9f0;padding:18px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sfr .foot b{font-family:Georgia,serif;font-size:17px;color:#fff}
.sfr .foot .row2{display:flex;align-items:center;gap:8px;color:#c9cede}
.sfr .foot .row2 svg.i{width:16px;height:16px}
.sfr .foot .pw{margin-top:8px;font-size:12px;color:#a8aec2}
.sfr .gone{text-decoration:line-through;opacity:.55}
.sfr > *{flex-shrink:0}
.sfr .tag{position:absolute;top:124px;left:12px;background:#16213e;color:#fff;font:600 12px/1 Inter,sans-serif;padding:6px 10px;border-radius:999px;z-index:5}
.sfr .paused{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 28px}
.sfr .paused .ic{width:76px;height:76px;border-radius:22px;background:#ebe6dd;color:var(--sf-ink);display:flex;align-items:center;justify-content:center}
.sfr .paused .ic svg.i{width:38px;height:38px}
.sfr .paused h1{font-size:24px;font-weight:700;color:var(--sf-ink);line-height:1.35}
.sfr .paused p{font-size:16px;color:var(--sf-muted);max-width:290px;line-height:1.6}
.sfr .paused .pw{font-size:12px;color:#7b8092;margin-top:24px;display:flex;align-items:center;gap:6px}

/* ---------- Operator console (op-), as admin.lytro.app draws it ---------- */
.op{display:flex;min-height:100%;font-family:var(--font-ui);background:var(--n50)}
.op .side{width:232px;flex:none;background:#061211;color:#cfe3e0;display:flex;flex-direction:column;padding:0 0 12px}
.op .side .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;background:#0a1f1d}
.op .side .brand .m{width:34px;height:34px;border-radius:8px;background:#0e6b66;display:flex;align-items:center;justify-content:center;color:#f2a516}
.op .side .brand small{display:block;font-size:10px;letter-spacing:.14em;color:#8fb3ae;font-weight:700}
.op .side .brand b{font-family:var(--font-display);font-size:20px;color:#fff;letter-spacing:-.02em;line-height:1}
.op .side .grp{font-size:11px;letter-spacing:.12em;color:#7e9d99;font-weight:700;padding:16px 20px 6px}
.op .side .it{display:flex;align-items:center;gap:12px;padding:9px 16px;margin:0 8px;border-radius:8px;font-size:14px;color:#d7e6e3}
.op .side .it svg.i{width:18px;height:18px}
.op .side .it.on{background:#12302d;color:#fff;font-weight:600}
.op .mainx{flex:1;display:flex;flex-direction:column;min-width:0}
.op .top{height:60px;flex:none;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.op .top .search{max-width:520px;height:40px;font-size:14px}
.op .pg{padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px}
.op .pg > *{flex-shrink:0}
.op .crumb{font-size:14px;color:var(--n700)}
.op h1{font-size:26px;font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.op .lead{font-size:15px;color:var(--n700);max-width:760px}
.op table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
.op th{font-size:12px;font-weight:700;color:var(--n700);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--n50);white-space:nowrap}
.op td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.op td.r,.op th.r{text-align:right}
.op .tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.op .shopc b{display:block;font-weight:600}
.op .shopc small{color:var(--n700);font-size:12px}
.op .new{font-size:11px;font-weight:700;color:var(--teal-800);background:var(--teal-100);border-radius:999px;padding:2px 7px;margin-left:6px}
.op .gone td{color:var(--n500)}
.op .gone td s{color:var(--n500)}

/* ---------- lytro.app (site-), the pricing card's look ---------- */
.site{font-family:'Inter','Noto Sans Bengali',sans-serif;background:#fff;color:var(--ink);height:100%;overflow:hidden}
.site .wrap{padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.site .eb{font-size:13px;font-weight:700;color:var(--teal-700)}
.site h2{font-family:var(--font-display);font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:800}
.site .plans{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.site .plan{border:1px solid rgba(16,32,31,.14);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(16,32,31,.05),0 2px 8px -2px rgba(16,32,31,.06);background:#fff}
.site .plan h3{font-size:20px;font-weight:700}
.site .plan .who{font-size:14px;color:var(--n700)}
.site .plan .pr b{font-size:34px;font-family:var(--font-display);font-weight:800}
.site .plan .pr span{font-size:15px;color:var(--n700);margin-left:4px}
.site .plan ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.site .plan li{display:flex;gap:8px;align-items:flex-start}
.site .plan li svg.i{width:16px;height:16px;color:var(--teal-700);margin-top:3px;stroke-width:2.4}
.site .plan li.chg{background:#fff7e0;border-radius:6px;padding:2px 6px;margin:0 -6px}
.site .plan .more{border-top:1px dashed rgba(16,32,31,.14);padding-top:10px}
.site .plan .sbtn{height:46px;border-radius:999px;border:1.5px solid var(--teal-700);color:var(--teal-700);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:6px}
.site .plan.hot{border:2px solid var(--teal-700)}
.site .plan.hot .sbtn{background:var(--teal-700);color:#fff}
.site .badge{align-self:flex-start;background:var(--mar-500,#f2a516);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.site .faq{border:1px solid rgba(16,32,31,.1);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.site .faq b{font-size:15px}
.site .faq p{font-size:14px;color:var(--n700);line-height:1.6}
.site .faq .was{font-size:12px;color:var(--n700)}
.site .faq .was s{color:var(--n500)}
.site .chg-k{font-size:12px;color:var(--n700);display:flex;align-items:center;gap:6px}
.site .chg-k i{width:14px;height:10px;background:#fff7e0;border:1px solid #f1d99a;border-radius:3px;display:inline-block}
.frame.wide{width:1282px;height:820px;border-radius:12px;border:1px solid #c9d3d2}
.frame.wide .statusbar{display:none}
.frame.wide .urlbar{display:flex}
.frame.wide .shell{top:40px}
.frame.wide .site .wrap{padding:36px 48px;gap:20px}
.frame.wide .site .plans{grid-template-columns:repeat(4,1fr)}
.frame.wide .site h2{font-size:32px}

function fit() {
  document.querySelectorAll('.frame[data-fit]').forEach((f) => {
    f.style.height = '';
    const how = f.dataset.fit;
    if (how === 'scroll') { const s = f.querySelector('.scroll'); f.style.height = (f.offsetHeight + s.scrollHeight - s.clientHeight) + 'px'; }
    if (how === 'shell') { const s = f.querySelector('.shell'); f.style.height = (f.offsetHeight + s.scrollHeight - s.clientHeight) + 'px'; }
    if (how === 'site') { const w = f.querySelector('.wrap'); const sh = f.querySelector('.shell'); const b = parseFloat(getComputedStyle(f).borderTopWidth); f.style.height = (2 * b + sh.offsetTop + w.offsetHeight) + 'px'; }
  });
}
window.addEventListener('load', fit);
if (document.fonts) document.fonts.ready.then(fit);
document.getElementById('root').innerHTML = SECTIONS.map((s) =>
  '<section class="pf-sec" id="' + s.id + '"><div class="pf-cap"><h2><code>' + s.id + '</code>' + s.title + '</h2><p>' + s.cap + '</p></div><div class="pf-stage">' + s.html() + '</div></section>').join('');
</script>
