<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 64" width="142" height="64" role="img" aria-label="Lytro">
  <!-- Wordmark. The mark is the first letter: the L-tick stands in for the L, followed by "ytro" in Plus Jakarta Sans
       ExtraBold, -0.03em tracking. Never write a separate l after the mark. The mark sits on the baseline and rises to
       ascender height. Outline the text to paths (Figma: Outline Stroke / Flatten) before production use. -->
  <path d="M15 15V49H31L49 29" transform="translate(2.8 8.12) scale(0.72)" fill="none" stroke="#0E6B66" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="47" font-family="'Plus Jakarta Sans', Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="42" letter-spacing="-1.3" fill="#10201F">ytro</text>
</svg>
