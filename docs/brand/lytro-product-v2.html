<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro product page v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Lytro's storefront tokens, as lytro-storefront.html and the built storefront use them. */
:root{
  --teal-50:#effaf8;--teal-100:#ddf5f2;--teal-700:#0e6b66;--teal-800:#0a4f4b;--teal-900:#063b38;
  --mar-100:#fdf0d1;--mar-500:#f2a516;--mar-700:#9a6004;
  --ink:#10201f;--n700:#2c3f3e;--n500:#5b6e6d;--n400:#7e8f8e;--n300:#a9b9b8;--n200:#d5dfde;--n100:#eaf0ef;--n50:#f6f9f8;--white:#fff;
  --success:#1b7a43;--success-soft:#e3f3e9;--warning:#9a6004;--warning-soft:#fdf0d1;--danger:#c8323b;--danger-soft:#fbe7e8;
  --bg:#fff;--surface:#fff;--sunken:var(--n50);--line:var(--n200);--line-strong:var(--n300);--text:var(--ink);--muted:var(--n700);--subtle:var(--n500);
  --accent:var(--teal-700);--accent-hover:var(--teal-800);--on-accent:#fff;--accent-soft:var(--teal-50);--accent-text:var(--teal-700);
  --font-ui:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;--font-display:'Plus Jakarta Sans','Inter','Noto Sans Bengali',sans-serif;
  --r-control:8px;--r-card:12px;--r-sheet:18px;--r-pill:999px;
  --shadow:0 1px 2px rgba(16,32,31,.06),0 4px 12px rgba(16,32,31,.06);--shadow-pop:0 12px 40px rgba(16,32,31,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-ui);color:var(--text);background:#e9eeed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}

/* ---------- The sketch's own toolbar (not part of the design) ---------- */
.bar{position:sticky;top:0;z-index:100;background:#0f1d1c;color:#e9f2f1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;font-size:13px}
.bar b{font-family:var(--font-display);font-weight:700;letter-spacing:.2px;margin-right:6px}
.bar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bar .grp span{opacity:.6;margin-right:4px}
.bar button{background:#22332f;border:1px solid #33463f;color:#d9e6e4;border-radius:6px;padding:5px 9px;font-size:12.5px}
.bar button.on{background:#e9f2f1;color:#0f1d1c;border-color:#e9f2f1;font-weight:600}
.note{max-width:1280px;margin:14px auto 0;padding:0 16px;font-size:13px;color:#2c3f3e;line-height:1.5}
.note b{color:#10201f}
.stage{display:flex;justify-content:center;padding:18px 16px 60px}
.frame{width:var(--fw);height:var(--fh);overflow:hidden;background:var(--bg);border-radius:18px;box-shadow:0 18px 50px rgba(16,32,31,.18);position:relative;container:page/inline-size}
/* The page's own scroll; var(--vh) stands for the browser window's height (100svh in the app). */
.sc{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}

/* ---------- Page shell ---------- */
.hdr{position:sticky;top:0;z-index:30;height:56px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ib:hover{background:var(--n50)}
.ib svg{width:22px;height:22px}
.ib .cnt{position:absolute;top:6px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.shop{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-decoration:none;color:inherit}
.logo{width:30px;height:30px;border-radius:8px;background:var(--teal-700);color:#fff;font-family:var(--font-display);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.shop b{font-family:var(--font-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:none}
@container page (min-width:700px){
  .hdr{height:64px;padding:0 20px;gap:8px}
  .hdr .back{display:none}
  .crumb{display:block;max-width:1200px;margin:0 auto;padding:16px 24px 0;font-size:13px;color:var(--subtle)}
  .crumb a{color:var(--muted);text-decoration:none}
}
@container page (min-width:1100px){.crumb{padding:18px 40px 0}}

/* ---------- Product: layout ---------- */
.pdp{padding:0 0 28px}
@container page (min-width:700px){
  .pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;max-width:1200px;margin:0 auto;padding:16px 24px 40px;align-items:start}
  .pdp .gal{position:sticky;top:80px}
}
/* Desktop: the photo is sized to the window's height, so the photo, the name, the price and the design row are all in
   the first screen without scrolling; the info column takes the rest of the width. */
@container page (min-width:1100px){
  .pdp{grid-template-columns:auto minmax(0,1fr);gap:48px;padding:20px 40px 56px}
}

/* ---------- Gallery: every photo, one after another ---------- */
.gal{position:relative}
.view{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;aspect-ratio:4/5;scroll-snap-align:start;position:relative;margin:0;background:var(--n100)}
.slide img{width:100%;height:100%;object-fit:cover}
.counter{position:absolute;top:12px;right:12px;background:rgba(16,32,31,.62);color:#fff;font-size:12px;font-weight:600;border-radius:var(--r-pill);padding:4px 9px;letter-spacing:.3px}
.dbadge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);color:var(--ink);font-size:12.5px;font-weight:600;border-radius:var(--r-pill);padding:5px 10px;box-shadow:var(--shadow)}
.dbadge i{font-style:normal;color:var(--subtle);font-weight:500}
.pick{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 18px;border-radius:var(--r-pill);border:0;background:rgba(255,255,255,.96);color:var(--ink);font-weight:600;font-size:14.5px;box-shadow:0 6px 20px rgba(16,32,31,.25);white-space:nowrap}
.pick svg{width:18px;height:18px}
.pick.on{background:var(--accent);color:#fff}
.pick.out{background:rgba(255,255,255,.9);color:var(--subtle);cursor:not-allowed}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--n200);transition:all .2s}
.dots i.on{width:18px;border-radius:3px;background:var(--ink)}
.thumbs{display:none}
.navb{display:none}
@container page (min-width:700px){
  .track,.slide{border-radius:var(--r-card)}
  .dots{display:none}
  .thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
  .th{flex:0 0 64px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;border:0;padding:0;position:relative;outline:1px solid var(--line);outline-offset:-1px;background:var(--n100)}
  .th img{width:100%;height:100%;object-fit:cover}
  .th.on{outline:2px solid var(--ink);outline-offset:1px}
  .th .tn{position:absolute;left:4px;bottom:4px;min-width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.94);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .navb{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
  .navb.prev{left:12px}.navb.next{right:12px}
  .navb svg{width:20px;height:20px}
}
@container page (min-width:1100px){
  .gal{display:grid;grid-template-columns:72px auto;gap:12px;--ph:min(calc(var(--vh) - 140px), 800px)}
  .gal .view{grid-column:2;grid-row:1;height:var(--ph);width:calc(var(--ph) * .8)}
  .gal .track{height:100%}
  .gal .slide{height:100%;aspect-ratio:auto}
  .thumbs{grid-column:1;grid-row:1;flex-direction:column;margin-top:0;max-height:var(--ph);overflow-y:auto;overflow-x:hidden}
  .th{flex:0 0 auto;width:72px}
}

/* ---------- Info column ---------- */
.info{padding:16px 16px 0}
@container page (min-width:700px){.info{padding:0}}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent-text);letter-spacing:.2px;display:flex;gap:8px;align-items:center}
.eyebrow .dc{color:var(--subtle);font-weight:500}
h1.pn{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3;margin:6px 0 10px;letter-spacing:-.2px}
@container page (min-width:1100px){h1.pn{font-size:28px}}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.price .now{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.3px}
.price .per{font-size:14px;color:var(--subtle);font-weight:500}
.price .was{font-size:15px;color:var(--subtle);text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:var(--r-pill);padding:4px 9px;line-height:1.2}
.chip.off{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.few{background:var(--warning-soft);color:var(--warning)}
.chip.out{background:var(--n100);color:var(--n700)}
.chip.ok::before,.chip.few::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stockrow{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:16px 0}

.opt{margin-top:18px;scroll-margin-top:80px}
.opt .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;font-size:14.5px}
.opt .lb .k{color:var(--muted)}
.opt .lb .v{font-weight:600}
.opt .lb .v.ph{color:var(--subtle);font-weight:500}
.opt .lb a{font-size:13.5px;color:var(--accent-text);font-weight:600;text-decoration:none;white-space:nowrap}
.msg{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.msg svg{width:16px;height:16px;flex:none;margin-top:2px}
.msg.err{color:var(--danger);font-weight:600}
.opt.nudge .dgrid,.opt.nudge .sizes{animation:nudge .5s ease 2}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Design cards: one per design, its group's first photo */
/* Five cards fill the row exactly; with more designs the sixth peeks in and the row scrolls sideways. */
.dgrid{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px) / 5);gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px;margin:-4px}
.dgrid.many{grid-auto-columns:calc((100% - 40px) / 5.5)}
.dgrid::-webkit-scrollbar{display:none}
.dcard{width:100%;aspect-ratio:4/5;border-radius:10px;border:0;padding:0;position:relative;overflow:hidden;background:var(--n100);outline:1px solid var(--line);outline-offset:-1px}
.dcard img{width:100%;height:100%;object-fit:cover}
.dcard .num{position:absolute;left:4px;top:4px;min-width:20px;height:20px;border-radius:10px;background:rgba(255,255,255,.95);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.dcard .tick{display:none;position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;place-items:center}
.dcard .tick svg{width:13px;height:13px}
.dcard.on{outline:2.5px solid var(--accent);outline-offset:2px}
.dcard.on .tick{display:grid}
.dcard.out img{filter:grayscale(1);opacity:.5}
.dcard .outl{position:absolute;inset:auto 0 0 0;background:rgba(16,32,31,.72);color:#fff;font-size:11px;font-weight:600;text-align:center;padding:3px 0}
.dcard .pc{position:absolute;right:4px;bottom:4px;background:rgba(16,32,31,.66);color:#fff;font-size:10.5px;font-weight:600;border-radius:6px;padding:1px 5px;display:flex;align-items:center;gap:3px}
.dcard .pc svg{width:10px;height:10px}

/* Sizes */
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:56px;height:44px;padding:0 14px;border-radius:var(--r-control);border:1px solid var(--line-strong);background:#fff;font-weight:600;font-size:15px}
.sz.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.sz.off{background:var(--n50);color:var(--n400);text-decoration:line-through;border-color:var(--line)}

/* Quantity with its unit */
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:#fff}
.step button{width:44px;height:42px;border:0;background:none;display:grid;place-items:center;border-radius:var(--r-control)}
.step button:disabled{color:var(--n300);cursor:not-allowed}
.step button svg{width:18px;height:18px}
.step .val{min-width:92px;text-align:center;font-weight:600;font-size:15px;border-left:1px solid var(--line);border-right:1px solid var(--line);height:100%;display:grid;place-items:center;padding:0 8px}
.step .val input{width:58px;border:0;text-align:right;font-weight:600;font-size:15px;outline:none;background:none;padding:0}
.step .val.typed{display:flex;align-items:center;justify-content:center;gap:5px}
.qhint{font-size:13.5px;color:var(--subtle)}
.qhint b{color:var(--warning)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff;font-size:13.5px;font-weight:600}
.quick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Inline buttons (tablet and desktop), and the phone's bar */
.ctas{display:none}
@container page (min-width:700px){
  .ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
}
.btn{height:50px;border-radius:var(--r-control);border:1px solid transparent;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.wide{width:100%}
.btn.wait{background:var(--ink)}
.buybar{position:sticky;bottom:0;z-index:25;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
@container page (min-width:700px){.buybar{display:none}}
.bsum{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.bsum img{width:38px;height:47px;border-radius:6px;object-fit:cover;flex:none}
.bsum .t{min-width:0}
.bsum .l1{font-size:12px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsum .l2{font-family:var(--font-display);font-weight:800;font-size:18px;white-space:nowrap}
.buybar .btn{height:48px;font-size:15px}
.buybar .btn.sec{width:48px;padding:0;flex:none}

/* Facts: delivery, payment, returns */
.facts{list-style:none;margin:22px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r-card)}
.facts li{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
.facts li+li{border-top:1px solid var(--line)}
.facts .fi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.facts .fi svg{width:18px;height:18px}
.facts .ft{flex:1;min-width:0;font-size:14px;line-height:1.45}
.facts .ft b{display:block;font-weight:600}
.facts .ft span{color:var(--subtle);font-size:13.5px}
.facts a{font-size:13.5px;font-weight:600;color:var(--accent-text);text-decoration:none;white-space:nowrap;align-self:center}

/* Description, details, share */
.acc{margin-top:18px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-weight:600;font-size:15px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary svg{width:18px;height:18px;transition:transform .2s}
.acc details[open] summary svg{transform:rotate(180deg)}
.acc .body{padding:0 0 16px;font-size:14.5px;line-height:1.65;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--subtle)}.kv dd{margin:0;font-weight:500;color:var(--text)}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;color:var(--subtle)}
.share button{white-space:nowrap;height:36px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text)}
.share button svg{width:15px;height:15px}

/* You may also like */
.more{padding:8px 16px 28px;max-width:1200px;margin:0 auto}
@container page (min-width:700px){.more{padding:8px 24px 48px}}
@container page (min-width:1100px){.more{padding:8px 40px 56px}}
.more h2{font-family:var(--font-display);font-size:18px;margin:6px 0 12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@container page (min-width:700px){.cards{grid-template-columns:repeat(4,1fr);gap:16px}}
.pc2 .ph{aspect-ratio:4/5;border-radius:var(--r-card);overflow:hidden;background:var(--n100)}
.pc2 .ph img{width:100%;height:100%;object-fit:cover}
.pc2 .nm{font-size:14px;margin:8px 0 2px;line-height:1.35}
.pc2 .pr{font-family:var(--font-display);font-weight:700;font-size:15px}
.pc2 .sw{display:flex;gap:4px;margin-top:6px}
.pc2 .sw i{width:16px;height:20px;border-radius:4px;background-size:cover;background-position:center;outline:1px solid var(--line)}

/* ---------- Landing page ---------- */
.lhdr .shop{justify-content:center}
.lhdr .lang{height:34px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff;padding:0 12px;font-size:13px;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.trust div{border:1px solid var(--line);border-radius:var(--r-card);padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.35;font-weight:600;color:var(--muted)}
.trust svg{width:20px;height:20px;color:var(--accent-text);display:block;margin:0 auto 5px}
/* The landing page: the photo on the left as on the product page; on the right the product's details and then the order
   form, so the form sits beside the photo on desktop and right after the details on a phone. */
.order{margin:20px 16px 8px;border:1px solid var(--line);border-radius:var(--r-sheet);padding:18px 16px;background:#fff;box-shadow:var(--shadow);scroll-margin-top:72px}
@container page (min-width:700px){.order{margin:24px 0 0;padding:22px}}
.order h2{font-family:var(--font-display);font-size:20px;margin:0}
.order .sub{font-size:13.5px;color:var(--subtle);margin:4px 0 16px}
.yours{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r-card);background:var(--sunken);border:1px solid var(--line)}
.yours img{width:56px;height:70px;border-radius:8px;object-fit:cover;flex:none}
.yours .t{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.yours .t b{display:block;font-size:14px}
.yours .t .pin{display:flex;align-items:center;gap:4px;color:var(--accent-text);font-weight:600;font-size:12px;margin-top:3px}
.yours .t .pin svg{width:12px;height:12px}
.yours a{font-size:13.5px;font-weight:600;color:var(--accent-text);text-decoration:none}
.yours.empty{border-style:dashed;background:#fff;justify-content:space-between}
.yours.empty .t{color:var(--muted)}
.fld{margin-top:14px}
.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.fld label i{font-style:normal;color:var(--subtle);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:var(--r-control);padding:0 12px;background:#fff;font-size:15px}

/* ---------- State ---------- */
const DEV = { phone:[390,844], tablet:[820,1060], desktop:[1280,840] };
const SCREENS = [
  ['pdp','Product page'], ['pdp-chosen','Product · chosen'], ['landing','Landing page'], ['landing-form','Landing · the form'],
  ['cart','Cart'], ['units','Quantities and units'], ['after','After the tap'],
];
const S = { cart:[], removed:null, screen:'pdp', dev:'phone', lang:'bn', design:null, size:null, qty:1, slide:0, nudge:null, toast:null, sheet:null };
const t = (k) => W[S.lang][k];
const money = (n) => '৳' + n.toLocaleString('en-US');
const dname = (d) => d.name ? `${t('dn')(d.n)} · ${d.name[S.lang]}` : t('dn')(d.n);

function preset(screen){
  S.screen = screen; S.nudge = null; S.toast = null; S.qty = 1; S.slide = 0; S.sheet = null;
  if (screen === 'pdp-chosen' || screen === 'landing-form' || screen === 'cart') { S.design = 2; S.size = 54; S.slide = 1; }
  else { S.design = null; S.size = null; }
  if (screen === 'cart') { S.cart = [{ d:2, s:54, q:1 }, { d:5, s:52, q:2 }]; S.removed = null; }
}

/* ---------- Pieces ---------- */
function header(landing){
  if (landing) return `<header class="hdr lhdr"><span class="ib" aria-hidden="true"></span>
    <a class="shop"><span class="logo">ন</span><b>${t('shop')}</b></a>
    <button class="lang" data-act="lang">${t('lang')}</button></header>`;
  return `<header class="hdr"><button class="ib back" aria-label="back">${I.back}</button>
    <a class="shop"><span class="logo">ন</span><b>${t('shop')}</b></a>
    <button class="ib" aria-label="search">${I.search}</button><button class="ib" aria-label="account">${I.user}</button>
    <button class="ib" aria-label="cart">${I.bag}<span class="cnt">2</span></button></header>
    <div class="crumb"><a>${t('home')}</a> / <a>${t('cat')}</a> / ${t('pname')}</div>`;
}

function gallery(){
  const n = SLIDES.length;
  const slides = SLIDES.map((s, i) => {
    let badge = '', pick = '';
    if (s.d) {
      const d = design(s.d);
      badge = `<span class="dbadge">${t('dn')(s.d)}${s.of > 1 ? ` <i>· ${t('photoOf')(s.i, s.of)}</i>` : ''}</span>`;
      if (designOut(d)) pick = `<button class="pick out" disabled>${t('designSold')}</button>`;
      else if (S.design === s.d) pick = `<button class="pick on" data-act="design" data-n="${s.d}">${I.check}${t('picked')}</button>`;
      else pick = `<button class="pick" data-act="design" data-n="${s.d}">${I.tap}${t('pickThis')}</button>`;
    }
    return `<figure class="slide"><img src="${img(s.src)}" alt="">${badge}${pick}</figure>`;
  }).join('');
  const thumbs = SLIDES.map((s, i) => `<button class="th${i === S.slide ? ' on' : ''}" data-act="thumb" data-i="${i}"><img src="${img(s.src)}" alt="">${s.d ? `<span class="tn">${s.d}</span>` : ''}</button>`).join('');
  return `<div class="gal"><div class="view"><div class="track" id="track">${slides}</div>
      <span class="counter" id="counter">${S.slide + 1} / ${n}</span>
      <button class="navb prev" data-act="nav" data-d="-1" aria-label="previous">${I.back}</button><button class="navb next" data-act="nav" data-d="1" aria-label="next">${I.next}</button></div>
    <div class="thumbs" id="thumbs">${thumbs}</div>
    <div class="dots" id="dots">${SLIDES.map((_, i) => `<i class="${i === S.slide ? 'on' : ''}"></i>`).join('')}</div></div>`;
}

function priceBlock(){
  const d = S.design ? design(S.design) : null;
  let now;
  if (d) now = `<span class="now">${money(d.price)}</span><span class="per">${t('per')}</span>`;
  else {
    const ps = DESIGNS.filter(x => !designOut(x)).map(x => x.price);
    const lo = Math.min(...ps), hi = Math.max(...ps);
    now = `<span class="now">${money(lo)}${hi > lo ? ` – ${money(hi)}` : ''}</span><span class="per">${t('per')}</span>`;
  }
  // A range shows no struck price (it would compare one figure with two); the chip says "up to".
  const base = d ? d.price : 3500;
  const pct = Math.round((1 - base / WAS) * 100);
  const ranged = !d && now.includes('–');
  let stock = `<span class="chip ok">${t('inStock')}</span>`;
  if (d && S.size) {
    const q = d.stock[S.size];
    stock = q === 0 ? `<span class="chip out">${t('soldOut')}</span>` : q <= 3 ? `<span class="chip few">${t('few')(q)}</span>` : stock;
  }
  return `<div class="price">${now}${ranged ? '' : `<span class="was">${money(WAS)}</span>`}</div>

/* ---------- Render ---------- */
function render(keep){
  const fr = document.getElementById('frame');
  const old = document.getElementById('sc');
  const top = keep && old ? old.scrollTop : 0;
  const [w, h] = DEV[S.dev];
  fr.style.setProperty('--fw', w + 'px'); fr.style.setProperty('--fh', h + 'px'); fr.style.setProperty('--vh', h + 'px');
  document.documentElement.lang = S.lang;
  const page = { pdp:pageProduct, 'pdp-chosen':pageProduct, cart:pageProduct, landing:pageLanding, 'landing-form':pageLanding, units:pageUnits, after:pageAfter }[S.screen];
  fr.innerHTML = `<div class="sc" id="sc">${page()}</div>${sizeChart()}${cartDrawer()}`;
  const sc = document.getElementById('sc');
  sc.style.scrollBehavior = 'auto'; sc.scrollTop = top; sc.style.scrollBehavior = '';
  const tr = document.getElementById('track');
  if (tr) {
    tr.style.scrollBehavior = 'auto'; tr.scrollLeft = S.slide * tr.clientWidth; tr.style.scrollBehavior = '';
    tr.addEventListener('scroll', () => {
      const i = Math.round(tr.scrollLeft / tr.clientWidth);
      if (i !== S.slide) { S.slide = i; syncSlide(); }
    }, { passive:true });
  }
  renderBar();
}
function syncSlide(){
  const c = document.getElementById('counter'); if (c) c.textContent = `${S.slide + 1} / ${SLIDES.length}`;
  document.querySelectorAll('#dots i').forEach((el, i) => el.classList.toggle('on', i === S.slide));
  document.querySelectorAll('#thumbs .th').forEach((el, i) => el.classList.toggle('on', i === S.slide));
}
function goSlide(i){
  const tr = document.getElementById('track'); if (!tr) return;
  S.slide = Math.max(0, Math.min(SLIDES.length - 1, i)); tr.scrollTo({ left:S.slide * tr.clientWidth, behavior:'smooth' }); syncSlide();
}
function scrollToEl(id){
  const sc = document.getElementById('sc'), el = document.getElementById(id); if (!sc || !el) return;
  const y = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 76;
  sc.scrollTo({ top:y, behavior:'smooth' });
}
function flash(msg){
  S.toast = msg; render(true);
  clearTimeout(flash.t); flash.t = setTimeout(() => { S.toast = null; render(true); }, 2200);
}
function missing(){
  if (!S.design) { S.nudge = 'design'; render(true); scrollToEl('opt-design'); return true; }
  if (!S.size) { S.nudge = 'size'; render(true); scrollToEl('opt-size'); return true; }
  return false;
}

document.getElementById('frame').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'design') {
    const n = Number(el.dataset.n), d = design(n);
    if (designOut(d)) return;
    S.design = n; S.nudge = null;
    if (S.size && d.stock[S.size] === 0) S.size = null;
    S.qty = 1;
    const i = SLIDES.findIndex(s => s.d === n);
    S.slide = SLIDES[S.slide] && SLIDES[S.slide].d === n ? S.slide : i;
    render(true);
  } else if (a === 'size') {
    const s = Number(el.dataset.s), d = S.design ? design(S.design) : null;
    if (d ? d.stock[s] === 0 : sizeOutEverywhere(s)) return;
    S.size = s; S.qty = 1; if (S.nudge === 'size') S.nudge = null; render(true);
  } else if (a === 'qty') {
    S.qty = Math.max(1, S.qty + Number(el.dataset.d)); render(true);
  } else if (a === 'thumb') { goSlide(Number(el.dataset.i)); }
  else if (a === 'nav') { goSlide(S.slide + Number(el.dataset.d)); }
  else if (a === 'cart') { if (!missing()) flash(t('added')); }
  else if (a === 'buy') { if (!missing()) flash(t('toCheckout')); }
  else if (a === 'toForm') { scrollToEl('order'); }
  else if (a === 'toDesign') { scrollToEl('opt-design'); }
  else if (a === 'confirm') { if (!missing()) flash(t('placed')); }
  else if (a === 'lang') { S.lang = S.lang === 'bn' ? 'en' : 'bn'; render(true); }
  else if (a === 'cq') { const l = S.cart[Number(el.dataset.i)]; l.q = Math.max(1, l.q + Number(el.dataset.d)); render(true); }
  else if (a === 'rm') { const i = Number(el.dataset.i); S.removed = { i, line:S.cart[i] }; S.cart = S.cart.filter((_, j) => j !== i); render(true); clearTimeout(S.undoT); S.undoT = setTimeout(() => { S.removed = null; render(true); }, 5000); }
  else if (a === 'undo') { if (S.removed) { S.cart.splice(S.removed.i, 0, S.removed.line); S.removed = null; render(true); } }
  else if (a === 'chart') { e.preventDefault(); S.sheet = 'chart'; render(true); }
  else if (a === 'close') { if (e.target === el || el.tagName === 'BUTTON') { S.sheet = null; render(true); } }
});

/* ---------- Toolbar ---------- */
function renderBar(){
  const b = document.getElementById('bar');
  const btn = (k, v, l) => `<button class="${S[k] === v ? 'on' : ''}" data-k="${k}" data-v="${v}">${l}</button>`;
  b.innerHTML = `<b>Product page v2</b>
    <div class="grp"><span>Screen</span>${SCREENS.map(([v, l]) => btn('screen', v, l)).join('')}</div>
    <div class="grp"><span>Device</span>${btn('dev', 'phone', 'Phone 390')}${btn('dev', 'tablet', 'Tablet 820')}${btn('dev', 'desktop', 'Desktop 1280')}</div>
    <div class="grp"><span>Language</span>${btn('lang', 'bn', 'বাংলা')}${btn('lang', 'en', 'English')}</div>`;
  document.getElementById('note').innerHTML = NOTES[S.screen];
}
document.getElementById('bar').addEventListener('click', (e) => {
  const el = e.target.closest('button[data-k]'); if (!el) return;
  const { k, v } = el.dataset;
  if (k === 'screen') { preset(v); render(false); if (v === 'landing-form') setTimeout(() => scrollToEl('order'), 50); }
  else { S[k] = v; render(true); }
});

  'landing-form':'<b>The form with a design chosen.</b> "Your choice" shows the exact photo, design, size and quantity that will go on the order, with <b>Change</b> taking the shopper back to the photos.',
  cart:'<b>The cart, as built today</b> (a sheet on phones, a drawer from the right on wider screens), with only three changes: <b>the chosen design\'s photo</b> on the line, <b>the unit</b> in the quantity ("1 পিস"), and <b>a trash button</b> in place of the "সরান" text, beside the quantity. Until the shopper\'s area is known, delivery shows <b>the highest charge</b> and the total one figure, with a link to set the area for the exact charge; removing a line shows Undo for 5 seconds in the built toast\'s style.',
  units:'<b>Quantities and units.</b> Every quantity shows its unit, for counted units as well as measured ones; a measured quantity can be typed and has quick picks. The price says what it is per.',
  after:'<b>After the tap.</b> A cart line is removed with its trash button (a 40 px target, named \"Remove\" for screen readers), and an undo message follows. The order pins the design\'s first photo, and the same photo, design, size and quantity follow the order through every screen: the cart, checkout, the confirmation, the seller\'s order page, and the confirmation call; the 3×3 parcel label names the design, the size and the SKU in its item line.',

preset('pdp'); render(false);
</script>
