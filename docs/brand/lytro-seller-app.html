<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro app prototype</title>
<meta name="description" content="Clickable sketch of Lytro, the Android app for shop owners and staff (docs/SELLER-APP-PLAN.md). Part 1: Wave 0 (sign-in and the app frame) and Wave 1's order loop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* ---------- Lytro tokens: the dashboard's own (docs/brand/tokens.css, lytro-dashboard.html) ---------- */
:root{
  --teal-50:#effaf8;--teal-100:#ddf5f2;--teal-200:#b9ece6;--teal-300:#7fdcd3;--teal-400:#3ec4b9;--teal-500:#17a89e;--teal-600:#107f78;--teal-700:#0e6b66;--teal-800:#0a4f4b;--teal-900:#063b38;
  --mar-100:#fdf0d1;--mar-300:#f8cf6e;--mar-500:#f2a516;--mar-700:#9a6004;
  --ink:#10201f;--n700:#2c3f3e;--n500:#5b6e6d;--n400:#7e8f8e;--n300:#a9b9b8;--n200:#d5dfde;--n100:#eaf0ef;--n50:#f6f9f8;--white:#fff;
  --success:#1b7a43;--success-soft:#e3f3e9;--warning:#9a6004;--warning-soft:#fdf0d1;--danger:#c8323b;--danger-soft:#fbe7e8;--info:#0e6b66;--info-soft:#ddf5f2;
  --bg:var(--n50);--surface:var(--white);--line:var(--n200);--line-strong:var(--n300);--text:var(--ink);--muted:var(--n700);--subtle:var(--n500);
  --primary:var(--teal-700);--primary-soft:var(--teal-50);--accent:var(--mar-500);--accent-text:var(--mar-700);--chrome:var(--teal-900);
  --font-ui:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;--font-display:'Plus Jakarta Sans','Inter','Noto Sans Bengali',sans-serif;
  --r-control:6px;--r-card:10px;--r-sheet:16px;
  --w:360px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);color:var(--text);background:#e6ebea;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- Harness (not product UI) ---------- */
.tb{position:sticky;top:0;z-index:50;background:var(--ink);color:#eaf0ef;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;font-size:13px}
.tb .brand{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;font-size:16px;color:#fff;margin-right:8px}
.tb label{display:flex;align-items:center;gap:6px;color:#a9b9b8}
.tb select{background:#1a3230;color:#fff;border:1px solid #335450;border-radius:6px;padding:5px 8px;font-size:13px;max-width:280px}
.tb .seg{display:inline-flex;border:1px solid #335450;border-radius:6px;overflow:hidden}
.tb .seg button{padding:5px 10px;color:#a9b9b8}
.tb .seg button.on{background:var(--teal-400);color:var(--ink);font-weight:600}
.stage{padding:24px 16px 56px}
.grid{display:grid;gap:36px 24px;grid-template-columns:repeat(auto-fill,var(--w));justify-content:center;max-width:1640px;margin:0 auto}
.grp{grid-column:1/-1;font-size:16px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--n300);padding-bottom:8px}
.grp small{display:block;font-weight:400;color:var(--n700);font-size:13px;margin-top:2px;max-width:900px}
.cap{font-size:12.5px;color:var(--n700);line-height:1.45;margin-bottom:8px;min-height:54px}
.cap code{color:var(--ink);font:600 12px ui-monospace,Consolas,monospace}

/* ---------- The phone: Android, light, as the app draws itself ---------- */
.phone{width:var(--w);height:760px;background:var(--bg);border:6px solid #0b1514;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 14px 40px rgba(16,32,31,.22)}
[data-lang=bn] .phone{line-height:1.6}
.sb{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:600 12.5px/1 'Inter',sans-serif;background:var(--surface);color:var(--ink)}
.sb .sbi{display:flex;gap:5px;align-items:center}
.sb .sbi svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb.chrome{background:var(--chrome);color:#fff}
.sb.bgc{background:var(--bg)}
.gn{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.gn i{width:96px;height:4px;border-radius:2px;background:var(--n700);opacity:.45}
.gn.chrome{background:var(--surface)}
.ab{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px 0 16px}
.ab.bk{padding-left:4px}
.ab .abt{flex:1;min-width:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ab .abt.num{font-size:17px}
.ab .shop{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ab .shop .abt{font-size:16px}
.ib{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:24px;color:var(--n700);position:relative;flex:none}
.ib svg.i{width:22px;height:22px}
.ib .badge{position:absolute;top:7px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--primary);color:#fff;font:600 10.5px/17px 'Inter',sans-serif;text-align:center}
.mono{width:32px;height:32px;border-radius:8px;background:var(--teal-700);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.mono.lg{width:40px;height:40px;font-size:18px}
.scroll{flex:1;overflow:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pg{display:flex;flex-direction:column;gap:16px;padding:16px 16px 24px}
.pg.fabpad{padding-bottom:96px}

/* bottom navigation (Android's navigation bar, the dashboard's five tabs) */
.nav{flex:none;height:72px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--n700);position:relative}
.nav .ind{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative}
.nav .ind svg.i{width:22px;height:22px}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on .ind{background:var(--teal-100);color:var(--primary)}
.nav .pill{position:absolute;top:-3px;left:32px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font:600 11px/18px 'Inter',sans-serif;text-align:center}
.nav .dot{position:absolute;top:2px;left:36px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
[data-lang=bn] .nav button{line-height:1.3}

/* floating button */
.fab{position:absolute;right:16px;bottom:106px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(16,32,31,.28);z-index:5}
.fab svg.i{width:22px;height:22px}

/* the sections of a hub, as tabs under the app bar */
.tabs{flex:none;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:46px;font-size:14px;font-weight:600;color:var(--n700);position:relative;text-align:center}
.tabs button.on{color:var(--primary)}
.tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}

/* ---------- The dashboard's components, unchanged ---------- */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead h2{font-size:17px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--n700);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .c{font-size:12px;font-weight:600;padding:0 6px;height:18px;border-radius:999px;background:var(--n100);color:var(--n700);display:inline-flex;align-items:center}
.chip.on .c{background:rgba(255,255,255,.22);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.hint{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;width:100%;text-align:left}
.row .lead{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--n100);color:var(--n700);font-weight:600}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .l1{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ord{align-items:flex-start;gap:10px}
.row.ord .ln{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.row.ord .ln .l1{min-width:0}
.row.ord .l0{white-space:nowrap}
.row.ord .ln .st,.row.ord .ln .amt{flex:none}
.row.ord .amt{font-weight:600;font-size:16px}
.othumb{width:48px;height:48px;border-radius:8px;overflow:hidden;position:relative;flex:none;background:var(--n100);margin-top:2px}
.othumb img{width:100%;height:100%;object-fit:cover;display:block}
.othumb i{position:absolute;right:3px;bottom:3px;min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:rgba(16,32,31,.85);color:#fff;font:600 11px/18px 'Inter',sans-serif;text-align:center;font-style:normal}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.row .l0{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.nw{white-space:nowrap}
.row .l2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l3{font-size:13px;color:var(--accent-text);font-weight:600}
.row .trail{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-weight:600;font-size:16px}
.row > svg.i:last-child{color:var(--n400)}
.st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.warn{background:var(--warning-soft);color:var(--warning)}
.st.info{background:var(--info-soft);color:var(--info)}
.st.ok{background:var(--success-soft);color:var(--success)}
.st.bad{background:var(--danger-soft);color:var(--danger)}
.st.neu{background:var(--n100);color:var(--n700)}
.job{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;width:100%;text-align:left}
.job .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.job .ic.mar{background:var(--warning-soft);color:var(--warning)}
.job .ic.teal{background:var(--info-soft);color:var(--info)}
.job .ic.red{background:var(--danger-soft);color:var(--danger)}
.job .tx{flex:1;font-size:16px;font-weight:500;min-width:0}
.job .cnt{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.job > svg.i:last-child{color:var(--n400)}
.stats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px}
.stat .lb{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:28px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.stat .d{font-size:13px;color:var(--subtle);margin-top:4px}
.btn{height:48px;padding:0 20px;border-radius:8px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn.p{background:var(--primary);color:#fff}
.btn.a{background:var(--accent);color:var(--ink)}
.btn.o{border:1px solid var(--line-strong);color:var(--n700);background:var(--surface)}
.btn.g{color:var(--primary);padding:0 12px}
.btn.d{background:var(--danger);color:#fff}
.btn.do{border:1px solid #e8b4b8;color:var(--danger);background:var(--surface)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.actbar{flex:none;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px}
.actbar .btn{flex:1}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-card);font-size:14px;line-height:1.5}
.banner svg.i{margin-top:2px}
.banner.info{background:var(--info-soft);color:var(--teal-900)}
.banner.warn{background:var(--warning-soft);color:var(--mar-700)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;color:var(--n700)}
.field .ctl{height:52px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--surface);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:16px}
.field .ctl.focus{border:2px solid var(--primary);padding:0 11px}
.field .ctl.ta{height:auto;min-height:72px;align-items:flex-start;padding:12px}
.field .ctl .pre{color:var(--muted);font-weight:500}
.field .ctl .ph{color:var(--n500);flex:1}
.field .ctl .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .ctl svg.i{color:var(--n500)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500;text-align:right}
.kv.total .k,.kv.total .v{font-weight:600;font-size:16px;color:var(--text)}
.daylbl{font-size:13px;font-weight:600;color:var(--n700);padding:12px 16px 4px;background:var(--n50)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--n300);flex:none}
.radio.on{border-color:var(--primary);border-width:7px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--n300);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--primary)}
.switch.on::after{left:24px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal-100);color:var(--teal-800);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.thumb{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,var(--n100),var(--n200));flex:none;display:flex;align-items:center;justify-content:center;color:var(--n400)}
.empty{text-align:center;padding:8px 0 0;font-size:15px;color:var(--muted)}
.lnk{color:var(--primary);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center;justify-content:center;width:100%}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;font:600 13px/1 var(--font-ui)}
.lang button{padding:9px 12px;min-height:36px;color:var(--n700)}
.lang button.on{background:var(--teal-100);color:var(--teal-800)}

/* sheets: the dashboard's, as Android's bottom sheet */
.scrim{position:absolute;inset:0;background:rgba(16,32,31,.45);z-index:20;display:flex;align-items:flex-end}
.bs{background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;width:100%;max-height:88%;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(16,32,31,.2)}
.bs .grab{width:40px;height:4px;border-radius:999px;background:var(--n300);margin:8px auto 0;flex:none}
.bs .bsh{padding:12px 16px 4px;flex:none}
.bs .bsh h2{font-size:18px;font-weight:700}
.bs .bsh p{font-size:14px;color:var(--muted)}
.bs .bsb{overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.bs .bsf{padding:12px 16px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.bs .bsf .btn{flex:1}
.bs .gnb{height:18px;display:flex;align-items:center;justify-content:center;flex:none}
.bs .gnb i{width:96px;height:4px;border-radius:2px;background:var(--n700);opacity:.45}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-card);width:100%}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt .radio{margin-top:2px}
.opt b{display:block;font-size:15.5px;font-weight:600}
.opt small{display:block;font-size:13.5px;color:var(--muted)}
.opt.tight{padding:10px 12px;align-items:center}

/* first-open and full-page screens */
.hero{background:var(--chrome);color:#fff;padding:28px 24px 32px;display:flex;flex-direction:column;gap:14px;flex:1}
.hero .wm{display:flex;align-items:center;gap:12px}
.hero .wm b{font:800 28px/1 var(--font-display);letter-spacing:-.03em}
.hero .wm span{font:700 28px/1 var(--font-display);color:var(--teal-300);letter-spacing:-.02em}
.hero h1{font:700 26px/1.3 var(--font-display);margin-top:auto}
[data-lang=bn] .hero h1{font-family:var(--font-ui);font-size:25px;line-height:1.45}
.hero p{font-size:15.5px;color:var(--teal-100);line-height:1.55}
.hero .top{display:flex;justify-content:flex-end}
.hero .lang{border-color:rgba(255,255,255,.35)}
.hero .lang button{color:#cfe3e0}
.hero .lang button.on{background:rgba(255,255,255,.16);color:#fff}
.foot{background:var(--surface);padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px;flex:none;border-radius:20px 20px 0 0;margin-top:-20px;position:relative}
.full{flex:1;display:flex;flex-direction:column;gap:14px;padding:32px 20px 16px}
.full h1{font-size:22px;font-weight:700;line-height:1.35}
.full p{font-size:15.5px;color:var(--muted)}
.full .end{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.big{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--info-soft);color:var(--info)}
.big svg.i{width:32px;height:32px}
.big.warn{background:var(--warning-soft);color:var(--warning)}
.li{display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:500}
.li .ic{width:36px;height:36px;border-radius:10px;background:var(--n100);color:var(--n700);display:flex;align-items:center;justify-content:center;flex:none}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code span{height:56px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font:600 24px/56px 'Inter',sans-serif;text-align:center}
.code span.c{border:2px solid var(--primary)}
.note{display:flex;gap:8px;font-size:14px;color:var(--muted);align-items:flex-start}
.note svg.i{width:18px;height:18px;margin-top:2px;color:var(--info)}

/* Android's own surfaces, drawn as the system draws them */
.sys{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
.sys.bottom{align-items:flex-end;padding:0}
.dlg{background:#eef3f2;color:#191c1c;border-radius:28px;padding:24px 20px 16px;width:100%;font-family:'Inter',sans-serif;font-size:15px;line-height:1.45}
.dlg .ic{display:flex;justify-content:center;color:var(--teal-700);margin-bottom:12px}
.dlg .ic svg.i{width:26px;height:26px}
.dlg p{text-align:center;font-size:17px;margin-bottom:18px}
.dlg p b{font-weight:600}

// Stand-ins: a fixed pattern, not a real code (as the listener sketch draws its QR).
function qrSvg() {
  let r = '';
  const finder = (x, y) => (x === 0 || x === 6 || y === 0 || y === 6 || (x > 1 && x < 5 && y > 1 && y < 5));
  for (let y = 0; y < 25; y += 1) for (let x = 0; x < 25; x += 1) {
    const inF = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
    const on = inF ? finder(x > 17 ? x - 18 : x, y > 17 ? y - 18 : y) : ((x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16)) ? false : ((x * 7 + y * 13 + (x * y) % 5) % 3 === 0);
    if (on) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<svg viewBox="0 0 25 25" fill="#000" aria-hidden="true">${r}</svg>`;
}
function barcode(code) {
  let x = 0; let r = '';
  for (let i = 0; i < 52; i += 1) { const w = 1 + ((code.charCodeAt(i % code.length) + i * 7) % 3); if (i % 2 === 0) r += `<rect x="${x}" y="0" width="${w}" height="22"/>`; x += w; }
  return `<svg viewBox="0 0 ${x} 22" preserveAspectRatio="none" fill="#000" aria-hidden="true">${r}</svg>`;
}

.xcr .b > b{display:block;font-size:15px;font-weight:500}
.xcr .b > small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.xcr.sub{padding-left:42px}
.xcr.dim{opacity:.5}
.xcr.on{background:var(--primary-soft)}
.xcr .tr{flex:none;text-align:right;font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xcr > svg.i:last-child{color:var(--n400);flex:none}
.xcm{font:500 14px ui-monospace,Consolas,monospace;letter-spacing:.2px}
.xcth{width:44px;height:44px;border-radius:8px;background:var(--n100);color:var(--n500);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.xcth img{width:100%;height:100%;object-fit:cover}
.xcth.sm{width:36px;height:36px}
.xcth.add{background:var(--primary-soft);color:var(--primary)}
.xclead{width:36px;height:36px;border-radius:10px;background:var(--n100);color:var(--n700);display:flex;align-items:center;justify-content:center;flex:none}
.xcsw{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.xcsw.e{border:2px dashed var(--n300);box-shadow:none;background:transparent}
.xcsw.sel{box-shadow:0 0 0 2px var(--primary)}
.xcdot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.xcpal{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 12px;background:var(--n50)}
.xcpal .sw{width:44px;height:32px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.xcpal .sw i{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.xcpal .chip{height:32px;padding:0 12px}
.xcbig{display:flex;align-items:center;justify-content:center;gap:28px;padding:2px 0}
.xcbig button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-strong);font-size:22px;color:var(--n700);display:flex;align-items:center;justify-content:center}
.xcbig b{font-size:36px;font-weight:700;min-width:48px;text-align:center}
.xcctr{text-align:center;font-size:14px;color:var(--muted)}
.xcctr.ink{color:var(--text);font-weight:500;font-size:15px}
.xctl{display:flex;flex-direction:column}
.xctl .e{display:flex;gap:12px;padding:10px 0}
.xctl .e + .e{border-top:1px solid var(--line)}
.xctl .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.xctl .b{flex:1;min-width:0}
.xctl .b b{display:block;font-size:15px;font-weight:600}
.xctl .b small{display:block;font-size:13px;color:var(--muted)}
.xctl .d{font-size:13px;color:var(--muted);flex:none;white-space:nowrap}
.xcgrid{display:grid;gap:6px}
.xcgrid span{height:38px;border:1px solid var(--line-strong);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface);min-width:0;overflow:hidden;white-space:nowrap}
.xcgrid span.h{justify-content:flex-start;font-weight:600}
.xcgrid span.x{border:none;background:none}
.xclink{color:var(--primary);font-weight:600;font-size:14.5px;text-decoration:underline;align-self:flex-start}
.xcdanger{color:var(--danger);font-weight:600;font-size:14.5px;text-decoration:underline;align-self:flex-start}
.xcin{height:38px;border:1px solid var(--line-strong);border-radius:6px;display:inline-flex;align-items:center;justify-content:flex-end;padding:0 8px;width:100%;max-width:60px;font-variant-numeric:tabular-nums;background:var(--surface)}
.xcin.warn{border:2px solid var(--warning);padding:0 7px}
.xcin.ph{color:var(--n500)}
.xcaog{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.xcaor{display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.xcbc{width:auto!important;max-width:110px;height:auto!important;min-height:34px;justify-content:flex-start!important;font-size:12.5px;line-height:1.25;padding:4px 6px!important;white-space:normal;color:var(--primary)}
.xcck td{vertical-align:top}
</style>`);
const xcR = (lead, title, sub, trail = '', attrs = '', cls = '') => `<div class="xcr ${cls}" ${attrs}>${lead || ''}<span class="b"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>${trail || ''}</div>`;
const xcCk = (on) => `<span class="check ${on ? 'on' : ''}">${on ? ic('check') : ''}</span>`;
const xcRd = (on) => `<span class="radio ${on ? 'on' : ''}"></span>`;
const xcBack = (label) => `<span style="display:inline-flex;vertical-align:-4px;margin-right:6px;color:var(--n700)">${ic('back')}</span>${label}`;
const xcLead = (i) => `<span class="xclead">${ic(i)}</span>`;
const xcX = () => `<span style="color:var(--n500);display:inline-flex">${ic('xx')}</span>`;
const xcDlg = (title, body, foot) => `<div class="sys" style="background:rgba(16,32,31,.45)"><div class="dlgc"><h2>${title}</h2>${body}<div class="row3">${foot}</div></div></div>`;

const xcCM = () => L('কুর্তি · চিকনকারি · M', 'Kurti · Chikankari · M');
const xcGalaxy = () => `Galaxy A16 · 128 GB · ${L('কালো', 'Black')}`;
const xcCouple = () => L('কাপল প্যাক', 'Couple pack');
const xcIMEI = ['356789104567894', '356789104567902', '356789104567910'];
const xcPhoto = (f) => `<span class="xcth">${f === 'k' ? kimg(0) : `<img src="sample-photos/builder/${f}.jpg" alt="">`}</span>`;
const xcBar = () => backBar(xcKurti(), 'sa-products', ib('more', { go: 'sa-product-menu' }));
const xcSearch = (w) => `<div class="search" style="flex:none">${ic('search')}<span>${w}</span></div>`;
const xcTop = (w) => `<span class="ttl3">${w}</span>`;
const xcSwatchRow = (colour, name, sub, sel) => xcR(`<span class="xcsw ${sel ? 'sel' : ''}" style="background:${colour}"></span>`, name, sub, xcX());
const SHADES = [['#9b111e', ['রুবি', 'Ruby']], ['#e8798c', ['রোজ', 'Rose']], ['#800000', ['মেরুন', 'Maroon']]];

const tile = (lab, b, sub, now, done) => `<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border-radius:10px;border:1px solid ${now ? 'var(--primary)' : 'var(--teal-200)'};${now ? 'box-shadow:inset 0 0 0 1px var(--primary);background:var(--surface);' : done ? 'background:var(--teal-50);' : 'background:var(--surface);'}padding:8px 10px;font-size:13px;line-height:1.35;color:var(--n700)"><span style="font-size:12px">${lab}</span><b style="font-size:14px;color:var(--ink)">${b}</b><span class="num">${sub}</span></div>`;
const steps = (state) => `<div style="display:flex;gap:8px;margin-top:12px">${tile(t('xgStep1') + (state > 0 ? ' · ' + t('xgStepDone') : ''), t('xgStepPhone'), P.phone, state === 0, state > 0)}${tile(t('xgStep2') + (state > 1 ? ' · ' + t('xgStepDone') : ''), t('xgStepConfirm'), t('xgStepConfirmFee', { fee: P.confirm }), state === 1, state > 1)}${tile(t('xgStepThen'), t('xgStepCourier'), t('xgStepCourierFee'), state === 2, false)}</div>`;
const access = (state) => { const locked = state === 0; return `<div style="border:1px solid var(--teal-200);background:var(--primary-soft);border-radius:var(--r-card);padding:12px 16px">
    <div style="display:flex;gap:12px;align-items:flex-start"><span style="width:36px;height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--teal-200);background:var(--surface);color:var(--primary)">${ic(locked ? 'lock' : 'call')}</span>
      <div style="min-width:0;font-size:14px;line-height:1.5"><b style="display:block;font-size:15px;color:var(--ink)">${locked ? t('xgLockedTitle') : t('xgPhoneTitle', P)}</b><span style="color:var(--n700)">${locked ? t('xgLockedBody', P) : t('xgPhoneBody', P)}</span></div></div>
    ${steps(state)}${locked ? `<p style="margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--n700)">${small('info')}<span>${t('xgLockedNote')}</span></p>` : ''}</div>`; };
const hidden = (locked) => `<div style="margin:10px 0;display:flex;gap:8px;align-items:flex-start;border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--n700)">${small('lock')}<span>${locked ? t('xgHiddenLocked') : t('xgHiddenPhone')}</span></div>`;
const emptyBanner = () => `<div class="banner bad">${ic('alert')}<span><b>${t('xgEmptyT', { balance: '৳0' })}</b> ${t('xgEmptyB')}</span><a href="#" ${go('sa-topup')}>${t('xgTopUpL')}</a></div>`;

/* An order from Lytro on pay-as-you-go, as order-page.tsx shows it before it is confirmed: step 0 masked (or 'empty', the
   balance short of the phone), step 1 with the name, phone and note but not the address. */
const fairOrder = (state) => {
  const locked = state !== 1;
  let h = orderPage('new');
  h = must(h, st('new'), locked ? lockTag() : phoneTag());
  h = must(h, `<div class="banner info">${ic('info')}<span>${t('bannerNew')}</span></div>`, state === 'empty' ? emptyBanner() : access(locked ? 0 : 1));
  h = must(h, `<p class="hint" style="margin:2px 0 10px">${L('বাসা 5, রোড 10, মিরপুর 11 · মিরপুর, ঢাকা', 'House 5, Road 10, Mirpur 11 · Mirpur, Dhaka')}</p>`,
    `<p class="hint" style="margin:4px 0 0;font-size:14px">${t('xgDistrict')} <b style="color:var(--ink)">${L('ঢাকা', 'Dhaka')}</b> · ${locked ? L('ঢাকা সিটির ভেতরে', 'Inside Dhaka city') : L('মিরপুর', 'Mirpur')}</p>${hidden(locked)}`);
  if (locked) {
    h = must(h, `<span class="l1">${L('নুসরাত জাহান', 'Nusrat Jahan')}</span>`, `<span class="l1">${L('ন•••', 'N•••')}</span>`);
    h = must(h, `<span class="avatar">${L('নু', 'N')}</span>`, `<span class="avatar">${L('ন', 'N')}</span>`);
    h = must(h, '<span class="nw">01711 234 567</span>', '<span class="nw">017•• ••• 567</span>');
    h = must(h, `<button class="callbtn" ${go('sa-call')}>${ic('call')}${t('call')}</button>`, '');
    h = must(h, kv(t('shopperNote'), t('noteSample')).replace('class="kv ', 'class="kv " style="border-top:1px solid var(--line)" data-x="'), '');
    h = must(h, `<div class="card"><div class="cardhead"><h3>${t('calls')}</h3></div><p class="hint" style="margin-top:6px">${t('noCalls')}</p></div>`, '');
  }
  return h;
};

/* ---------- harness ---------- */
function render() {
  document.documentElement.lang = ST.lang;
  document.body.dataset.lang = ST.lang;
  document.documentElement.style.setProperty('--w', ST.w + 'px');
  const grid = document.getElementById('grid');
  const inWave = (s) => ST.wave === 'all' || s.grp.startsWith('w' + ST.wave);
  const list = ST.screen === 'all' ? SCREENS.filter(inWave) : SCREENS.filter(s => s.id === ST.screen);
  let html = ''; let grp = null;
  for (const s of list) {
    if (s.grp !== grp) { grp = s.grp; html += `<div class="grp">${GROUPS[grp][0]}<small>${GROUPS[grp][1]}</small></div>`; }
    html += `<div><div class="cap"><code>${s.id}</code> · ${s.cap}</div>${s.render()}</div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.tabs.sc').forEach((row) => { const on = row.querySelector('.on'); if (on) row.scrollLeft = on.offsetLeft - row.offsetLeft - 16; });
  grid.querySelectorAll('[data-start]').forEach((card) => { const row = card.parentElement; row.scrollLeft = card.offsetLeft - row.offsetLeft - 16; });
}
const sel = document.getElementById('selScreen');
const fillScreens = () => { const shown = SCREENS.filter(s => ST.wave === 'all' || s.grp.startsWith('w' + ST.wave)); sel.innerHTML = `<option value="all">All screens (${shown.length})</option>` + shown.map(s => `<option value="${s.id}">${s.id}</option>`).join(''); };
fillScreens();
const selWave = document.getElementById('selWave'); selWave.value = ST.wave;
selWave.onchange = () => { ST.wave = selWave.value; ST.screen = 'all'; fillScreens(); render(); window.scrollTo(0, 0); };
sel.onchange = () => { ST.screen = sel.value; render(); };
document.getElementById('grid').addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  ST.screen = b.dataset.go; sel.value = ST.screen; render(); window.scrollTo(0, 0);
});
for (const [id, key, num] of [['segW', 'w', true], ['segLang', 'lang', false]]) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    ST[key] = num ? Number(b.dataset.v) : b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b));
    render();
  });
}
render();
</script>
</body>
</html>
