<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lytro">
  <!-- Open Graph / Twitter card image for the landing page and shared links, 1200 x 630. Export to PNG (JPEG for
       Facebook under 1 MB) and reference from og:image. Set in live type: outline before export. -->
  <rect width="1200" height="630" fill="#063B38"/>
  <g transform="translate(96 96)">
    <path d="M15 15V49H31L49 29" transform="translate(-10.29 8.46) scale(1.0286)" fill="none" stroke="#3EC4B9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="51.43" y="64" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="800" font-size="60" letter-spacing="-2.4" fill="#FFFFFF">ytro</text>
  </g>
  <text x="96" y="330" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-weight="700" font-size="68" fill="#FFFFFF">আপনার দোকান,</text>
  <text x="96" y="415" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-weight="700" font-size="68" fill="#7FDCD3">আপনার হাতে।</text>
  <text x="96" y="490" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-weight="400" font-size="28" fill="#B9ECE6">অর্ডার, পেমেন্ট, কুরিয়ার আর ফেক অর্ডার চেক, বাংলায়। মাসিক ফি নেই।</text>
  <rect x="96" y="530" width="230" height="52" rx="10" fill="#F2A516"/>
  <text x="211" y="565" text-anchor="middle" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-weight="600" font-size="24" fill="#10201F">ফ্রি দোকান খুলুন</text>
  <text x="1104" y="568" text-anchor="end" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#7FDCD3">lytro.app · by Lytronix</text>
</svg>
