<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro storefront prototype</title>
<meta name="description" content="Shopper storefront design prototype for Lytro: one shared layout per shop, phone-first, Bangla with an English toggle, the shop's name and logo on Lytro's defaults or on its own brand identity; browsing, product, cart, landing page, and the later checkout, tracking and account flows. Spec: docs/STOREFRONT-DESIGN.md">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* ---------- Lytro default identity (docs/brand/tokens.css), BRN-01 ---------- */
:root{
  --teal-50:#effaf8;--teal-100:#ddf5f2;--teal-700:#0e6b66;--teal-800:#0a4f4b;--teal-900:#063b38;
  --mar-100:#fdf0d1;--mar-500:#f2a516;--mar-700:#9a6004;
  --ink:#10201f;--n700:#2c3f3e;--n500:#5b6e6d;--n400:#7e8f8e;--n300:#a9b9b8;--n200:#d5dfde;--n100:#eaf0ef;--n50:#f6f9f8;--white:#fff;
  --success:#1b7a43;--success-soft:#e3f3e9;--warning:#9a6004;--warning-soft:#fdf0d1;--danger:#c8323b;--danger-soft:#fbe7e8;--info:#0e6b66;--info-soft:#ddf5f2;
  /* the shop's identity: these are the only values BRN-02 may change (colours, fonts, shape, spacing) */
  --bg:#fff;--surface:#fff;--sunken:var(--n50);--line:var(--n200);--line-strong:var(--n300);--text:var(--ink);--muted:var(--n700);--subtle:var(--n500);
  --accent:var(--teal-700);--accent-hover:var(--teal-800);--on-accent:#fff;--accent-soft:var(--teal-50);--accent-text:var(--teal-700);
  --font-ui:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;--font-display:'Plus Jakarta Sans','Inter','Noto Sans Bengali',sans-serif;
  --r-control:8px;--r-card:12px;--r-sheet:18px;--r-pill:999px;--space:1;
  --shadow:0 1px 2px rgba(16,32,31,.06),0 4px 12px rgba(16,32,31,.06);--shadow-pop:0 12px 40px rgba(16,32,31,.22);
}
/* the shop's own identity switched on (BRN-02): maroon, cream, Hind Siliguri with a serif display, round corners */
.frame[data-brand=own]{
  --bg:#fcf8f3;--surface:#fff;--sunken:#f5ede3;--line:#e9dccd;--line-strong:#d6c3ad;--text:#2a1b17;--muted:#5a4740;--subtle:#7a6660;
  --accent:#7a1f25;--accent-hover:#5e161b;--on-accent:#fff;--accent-soft:#f6e6e3;--accent-text:#7a1f25;
  --font-ui:'Hind Siliguri','Inter',ui-sans-serif,system-ui,sans-serif;--font-display:'Fraunces','Hind Siliguri',serif;
  --r-control:12px;--r-card:18px;--r-sheet:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);color:#10201f;background:#e6ebea;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.price{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ---------- Harness (not product UI) ---------- */
.tb{position:sticky;top:0;z-index:50;background:#10201f;color:#eaf0ef;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;font-size:13px}
.tb .brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.03em;font-size:16px;color:#fff;margin-right:8px}
.tb .brand em{font-style:normal;color:#3ec4b9;font-size:11px;letter-spacing:.08em;margin-left:6px;vertical-align:middle}
.tb label{display:flex;align-items:center;gap:6px;color:#a9b9b8}
.tb select{background:#1a3230;color:#fff;border:1px solid #335450;border-radius:6px;padding:5px 8px;font-size:13px;max-width:360px}
.tb .seg{display:inline-flex;border:1px solid #335450;border-radius:6px;overflow:hidden}
.tb .seg button{padding:5px 10px;color:#a9b9b8}
.tb .seg button.on{background:#3ec4b9;color:#10201f;font-weight:600}
.tb .note{margin-left:auto;color:#7e8f8e}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.frame{container-type:inline-size;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(16,32,31,.25)}
.frame.phone{width:390px;height:844px;border-radius:40px;border:8px solid #0b1514}
.frame.tablet{width:820px;height:1000px;border-radius:24px;border:8px solid #0b1514}
.frame.desktop{width:1280px;height:860px;border-radius:12px;border:1px solid #c9d3d2}
.frame .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;background:var(--surface)}
.frame.desktop .statusbar{display:none}
.frame .urlbar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;background:#f1f4f3;border-bottom:1px solid #d5dfde;font-size:13px;color:#2c3f3e;font-family:Inter,sans-serif}
.frame.desktop .urlbar{display:flex}
.frame .urlbar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d5dfde;margin-right:6px}
.frame .urlbar .url{background:#fff;border:1px solid #d5dfde;border-radius:6px;padding:4px 10px;flex:1;max-width:520px}
.caption{max-width:1280px;margin:0 auto;padding:0 16px 40px;color:#2c3f3e;font-size:13px;line-height:1.6}
.caption b{color:#10201f}
.frame[data-lang=bn] .page,.frame[data-lang=bn] .sheet,.frame[data-lang=bn] .hdr{line-height:1.6}

/* ---------- Shell ---------- */
.shell{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.frame.phone .shell,.frame.tablet .shell{top:44px}
.frame.desktop .shell{top:40px}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
.hdr{flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;height:60px;position:relative;z-index:5}
.hdr .shop{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.hdr .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:18px;flex:none}
.frame[data-brand=own] .hdr .logo{border-radius:50%}
.hdr .name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text);position:relative}
.hdr .ib .badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hdr .nav{display:none}
.hdr .dsearch{display:none}
.hdr .shop.donly{display:none}
.hdr.minimal{justify-content:center}
.hdr.minimal .shop{flex:0 1 auto}
.hdr .back{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;margin-left:-8px}
.hdr .ttl{font-weight:600;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langpill{height:30px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer}

/* ---------- Page ---------- */
.page{display:flex;flex-direction:column;gap:20px;padding:16px 16px 120px;min-height:100%}
.page.tight{padding-bottom:40px}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead h2{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.sechead .lnk{font-size:14px;color:var(--accent-text);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.sechead .lnk svg.i{width:16px;height:16px}
h1.pt{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.sub{font-size:14px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.frame[data-lang=bn] .eyebrow{text-transform:none;letter-spacing:0;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip svg.i{width:16px;height:16px}

/* hero band: the shop's greeting, data-driven (name, logo, category count); never a custom banner (SFT-01) */
.hero{background:var(--accent);color:var(--on-accent);border-radius:var(--r-card);padding:22px 20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;position:relative}
.hero p{font-size:14px;opacity:.9;position:relative;max-width:420px}
.hero .cta{align-self:flex-start;margin-top:6px;background:#fff;color:var(--accent);border-radius:var(--r-pill);height:40px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;position:relative}
.frame[data-brand=own] .hero .cta{color:var(--accent)}
.trust{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.trust::-webkit-scrollbar{display:none}
.trust span{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--sunken);border-radius:var(--r-pill);padding:7px 12px;white-space:nowrap}
.trust span svg.i{width:16px;height:16px;color:var(--accent-text)}

/* category tiles and product cards */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;text-align:center;cursor:pointer}
.cat .img{width:100%;aspect-ratio:1;border-radius:var(--r-card);background:var(--sunken);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--accent-text);position:relative;overflow:hidden}
.cat .img::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 60%)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card .img{aspect-ratio:4/5;border-radius:var(--r-card);background:var(--sunken);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start}
.card .img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--accent-text);opacity:.35}
.card .img .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(255,255,255,.55),transparent 55%)}
.card .img .tag{position:relative;margin:8px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:rgba(16,32,31,.78);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.card .img .tag.out{background:rgba(255,255,255,.9);color:var(--muted)}
.card .img .tag.low{background:var(--mar-500);color:#10201f}
.card .img .tag.save{background:var(--success);color:#fff}
.card.out .img{opacity:.6}
.card .nm{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{display:flex;align-items:baseline;gap:8px}
.card .pr .price{font-size:15px}
.card .pr .was{font-size:12px;color:var(--subtle);text-decoration:line-through}
.card .sw{display:flex;gap:4px}
.card .sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 150px}

/* product page */
.gallery{position:relative;margin:0 -16px}
.gallery .main{aspect-ratio:4/5;background:var(--sunken);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gallery .main .ph{font-family:var(--font-display);font-weight:800;font-size:64px;color:var(--accent-text);opacity:.3}
.gallery .main .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(255,255,255,.55),transparent 55%)}
.gallery .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gallery .dots i{width:6px;height:6px;border-radius:50%;background:rgba(16,32,31,.3)}
.gallery .dots i.on{background:var(--text);width:18px;border-radius:3px}
.gallery .vid{position:absolute;right:12px;bottom:12px;height:30px;padding:0 10px;border-radius:var(--r-pill);background:rgba(16,32,31,.78);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.gallery .vid svg.i{width:14px;height:14px}
.gallery .fav{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.thumbs{display:none}
.buy{display:flex;flex-direction:column;gap:14px}
.buy .top{display:flex;flex-direction:column;gap:6px}
.buy .pricerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.buy .pricerow .price{font-size:26px}
.buy .pricerow .unit{font-size:14px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;vertical-align:middle}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--success-soft);color:var(--success)}
.st.low{background:var(--warning-soft);color:var(--warning)}
.st.out{background:var(--n100);color:var(--n700)}
.st.info{background:var(--accent-soft);color:var(--accent-text)}
.st.plain::before{display:none}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lb{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.opt .lb .lnk{font-weight:500;color:var(--accent-text);font-size:13px;cursor:pointer}
.opt .vals{display:flex;flex-wrap:wrap;gap:8px}
.vb{min-width:44px;height:40px;padding:0 14px;border-radius:var(--r-control);border:1.5px solid var(--line-strong);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);position:relative}
.vb.on{border-color:var(--text);background:var(--text);color:var(--bg)}
.vb.off{color:var(--subtle);border-style:dashed;background:transparent}
.vb.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:1.5px;background:var(--n300);transform:rotate(-14deg)}
.swb{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:2px;cursor:pointer;position:relative}
.swb i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.swb.on{border-color:var(--text)}
.swb.off{opacity:.4}
.swb.off::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--text);transform:rotate(-45deg)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:var(--r-control);height:40px}
.qty button{width:40px;height:100%;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.qty span{min-width:36px;text-align:center;font-weight:600}
.line{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5}
.line svg.i{width:18px;height:18px;color:var(--accent-text);margin-top:2px}
.line b{color:var(--text);font-weight:600}
.line .lnk{color:var(--accent-text);font-weight:600;cursor:pointer;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500}
.desc{font-size:15px;line-height:1.65;white-space:pre-line}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;font-size:15px;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc .body{padding:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
.share{display:flex;gap:8px}
.share .btn{flex:1}
.buybar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:6}
.buybar .tot{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.buybar .tot .k{font-size:12px;color:var(--muted)}
.buybar .tot .price{font-size:20px}
.buybar .btn{flex:1;height:48px;font-size:15px}
.frame.desktop .buybar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-control);font-size:15px;font-weight:600;border:1.5px solid transparent;white-space:nowrap;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--text)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.dark{background:var(--text);color:var(--bg)}
.btn.quiet{color:var(--accent-text)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.lg{height:52px;font-size:16px;border-radius:calc(var(--r-control) + 2px)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg.i{width:18px;height:18px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field .help{font-size:13px;color:var(--subtle)}
.field .err{font-size:13px;color:var(--danger);font-weight:500}
.input,.select,.textarea{height:48px;border:1.5px solid var(--line-strong);border-radius:var(--r-control);padding:0 14px;background:var(--surface);font-size:16px;width:100%;color:var(--text)}
.input.bad,.select.bad{border-color:var(--danger)}
.textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.5}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%232c3f3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.inwrap{position:relative}
.inwrap .pre{position:absolute;left:14px;top:0;height:48px;display:flex;align-items:center;color:var(--subtle);font-weight:500}
.inwrap .input{padding-left:46px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
/* one box per digit; typing moves to the next box, backspace to the previous, a pasted code fills all six */
.otp{display:flex;gap:8px}
.otp span{flex:1;height:56px;border:1.5px solid var(--line-strong);border-radius:var(--r-control);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.otp span.on{border-color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.otp span.on::after{content:"";width:2px;height:26px;background:var(--text);animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.otp span.bad{border-color:var(--danger)}

.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.banner.ok{background:var(--success-soft);border-color:#bfe3cb;color:#155c33}

/* cart lines */
.cl{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.cl .note{font-size:12px;font-weight:600;color:var(--warning)}
.cl.off .th,.cl.off .nm,.cl.off .vr{opacity:.55}

.cl .qty button{width:34px}

/* timeline */
.tl{display:flex;flex-direction:column;position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl .s{position:relative;padding:0 0 18px}

.tl .s.done::before{background:var(--success);border-color:var(--success)}
.tl .s.now::before{border-color:var(--accent);border-width:5px;background:var(--surface)}
.tl .s .t{font-weight:600;font-size:15px}

<script>

const CHANGED = [{ ...CART[0], was: 1150 }, { ...CART[1], out: true }, CART[2], { p: P[7], v: 'Maroon', vbn: 'মেরুন', qty: 1, gone: true }];
const cartNow = (o) => (o && o.changed ? CHANGED : CART);
const counted = (o) => cartNow(o).filter((l) => !l.out && !l.gone);
function cartLines(o) { return `<div>${cartNow(o).map((l) => l.out || l.gone
  ? `<div class="cl off"><span class="th">${pName(l.p).slice(0, 1)}</span><div class="b"><div class="nm">${pName(l.p)}</div><div class="vr">${L(l.vbn, l.v)}</div><div class="note">${t(l.out ? 'line_out' : 'line_gone')}</div><span class="rm">${t('remove')}</span></div></div>`
  : `<div class="cl"><span class="th">${pName(l.p).slice(0, 1)}</span><div class="b"><div class="nm">${pName(l.p)}</div><div class="vr">${L(l.vbn, l.v)}${l.p.adv ? ` · ${t('pay_adv', { n: l.p.adv })}` : ''}</div>${l.was ? `<div class="note">${t('line_was', { p: money(l.was) })}</div>` : ''}<div class="row">${qty(l.qty)}<span class="price">${money(l.p.price * l.qty)}</span></div><span class="rm">${t('remove')}</span></div></div>`).join('')}</div>`; }
function cartSummary(o) {
  o = o || {}; const d = o.area ? 70 : null; const sub = counted(o).reduce((a, l) => a + l.p.price * l.qty, 0); const items = counted(o).reduce((a, l) => a + l.qty, 0);
  return `<div class="sum"><div class="r"><span class="k">${t('subtotal')} · ${t('cart_n', { n: items })}</span><span class="price">${money(sub)}</span></div><div class="r"><span class="k">${t('delivery')}${o.area ? ` · ${L(ZONE.inside.bn, ZONE.inside.en)} <span class="lnk" style="color:var(--accent-text);cursor:pointer" onclick="go('cart-area')">${t('change')}</span>` : ''}</span><span>${d !== null ? money(d) : `<span class="lnk" style="color:var(--accent-text);cursor:pointer;font-weight:600" onclick="go('cart-area')">${t('deliv_area')}</span>`}</span></div>${o.area ? '' : `<div class="r" style="font-size:12px;color:var(--subtle)"><span>${t('deliv_range')}</span></div>`}<div class="r total"><span>${t('total')}</span><span class="price">${d !== null ? money(sub + d) : `${money(sub + 70)} – ${money(sub + 130)}`}</span></div></div><div class="sub" style="font-size:12px">${t('cart_est_note')}</div>`;
}
function cartSheet(o) {
  o = o || {};
  const body = CART.length && !o.empty ? `${cartLines(o)}${cartSummary(o)}${o.nodelivery ? `<div class="banner bad">${I.warn}<span><b>${t('no_delivery', { a: L('বান্দরবান', 'Bandarban') })}</b><br>${t('no_delivery_hint')}</span></div>` : ''}` : `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 0">${I.bag.replace('class="i"', 'class="i" style="width:40px;height:40px;color:var(--n300)"')}<b style="font-size:17px">${t('cart_empty')}</b><p class="sub">${t('cart_empty_hint')}</p><button class="btn ghost" onclick="go('home')">${t('continue_')}</button></div>`;
  const footHtml = CART.length && !o.empty ? `<button class="btn ghost" onclick="go('home')">${t('continue_')}</button><button class="btn primary" onclick="go('checkout')" ${o.nodelivery || o.soon ? 'disabled' : ''}>${t('checkout')}</button>${o.soon ? `<span class="soonline">${t('ordering_soon')}</span>` : ''}` : null;
  return sheet(`${t('cart_title')}${!o.empty ? ` · ${t('cart_n', { n: counted(o).reduce((a, l) => a + l.qty, 0) })}` : ''}`, body, footHtml, { drawer: true, close: 'product', footClass: o.soon ? 'soon' : '' });
}

    <div class="opt"><div class="lb"><span>${t('size')}: <b>${o.size || 'M'}</b></span><span class="lnk" onclick="go('product-size-chart')">${I.ruler} ${t('size_chart')}</span></div><div class="vals">${PRODUCT.sizes.map((s) => `<span class="vb ${s === (o.size || 'M') ? 'on' : ''}">${s}</span>`).join('')}</div></div>
    <div class="opt"><div class="lb"><span>${t('colour')}: <b>${L(PRODUCT.colours[o.colour || 0][1], PRODUCT.colours[o.colour || 0][2])}</b></span></div><div class="vals">${PRODUCT.colours.map((c, i) => `<span class="swb ${i === (o.colour || 0) ? 'on' : ''}"><i style="background:${c[0]}"></i></span>`).join('')}</div></div>
    <div class="opt"><div class="lb"><span>${t('qty')}</span></div>${qty(q)}</div>
    <div class="desc" style="font-size:14px;color:var(--muted)">${L(...PRODUCT.desc)}</div>
    <div class="acc"><details><summary>${t('details')}${I.down}</summary><div class="body"><div class="kv">${PRODUCT.attrs.map((a) => `<span class="k">${L(a[0], a[1])}</span><span class="v">${L(a[2], a[3])}</span>`).join('')}</div></div></details></div>
  </div></div>
  <div class="two"><div class="ofrm" style="display:flex;flex-direction:column;gap:16px">${o.soon ? `<div class="banner info">${I.info}<span>${t('landing_soon')}</span></div>` : ''}${orderForm(o)}</div>
  <div class="side"><div class="card2"><h3>${t('co_summary')}</h3><div class="cl"><span class="th">${pName(p).slice(0, 1)}</span><div class="b"><div class="nm">${pName(p)}</div><div class="vr">${o.size || 'M'} · ${L(PRODUCT.colours[o.colour || 0][1], PRODUCT.colours[o.colour || 0][2])} × ${q}</div></div></div><div class="sum"><div class="r"><span class="k">${t('item_total')}</span><span>${money(total)}</span></div><div class="r"><span class="k">${t('delivery')}${o.thana ? ` · ${L(ZONE.inside.bn, ZONE.inside.en)}` : ''}</span><span>${o.thana ? money(70) : `৳70 – ৳130`}</span></div><div class="r total"><span>${t('grand_total')}</span><span class="price">${o.thana ? money(total + 70) : `${money(total + 70)} – ${money(total + 130)}`}</span></div></div><div class="line">${I.cash}<span><b>${t('pay_cod')}</b> · ${t('pay_cod_hint')}</span></div><button class="btn primary lg block" onclick="go('${o.soon ? 'landing' : 'confirm-cod'}')" ${o.soon ? 'disabled' : ''}>${t('confirm_order')}</button><div class="sub" style="font-size:12px;text-align:center">${t('idem_note')}</div></div></div></div>`;
}
/* the phone's pinned bar: the price and "Order now", which scrolls to the form; hidden on desktop where the form is beside the product */
const landingBar = (p) => `<div class="buybar"><span class="tot"><span class="k">${pName(p)}</span><span class="price">${money(p.price)}</span></span><button class="btn primary" onclick="var s=document.querySelector('#frame .scroll'),f=document.querySelector('#frame .ofrm');if(s&&f)s.scrollTo({top:f.offsetTop-72,behavior:'smooth'})">${t('order_now')} ${I.down}</button></div>`;
def('landing', { group: 'Landing page', label: 'Landing page /l/cotton-panjabi (form laid out, Slice 12)', url: 'megh.lytro.app/l/cotton-panjabi', render: () => shell({ hdr: { minimal: true }, landing: true }, landingPage({ soon: true }), landingBar(P[0])) });
def('landing-variant', { group: 'Landing page', label: '· opened with ?v= (XL Navy preselected, LND-06)', url: 'megh.lytro.app/l/cotton-panjabi?v=var_xl_navy', render: () => shell({ hdr: { minimal: true }, landing: true }, landingPage({ soon: true, size: 'XL', colour: 1 }), landingBar(P[0])) });

</script>

<script>
/* ---------- later phases, drawn in full: checkout and confirmation (Phase 4), payment return (Phase 5), tracking and account (Phase 4), combos (Phase 4), chat (Phase 7) ---------- */
const later = (k) => `<span class="st info plain">${t(k)}</span>`;
function checkoutPage(o) {
  o = o || {}; const sub = cartSub(); const d = 70; const adv = o.adv ? 200 : 0; const total = sub + d;
  /* the official marks from docs/brand/third-party, never recoloured; Rocket and Upay as text in their colours until their marks are fetched */
  const pm = (id, label, hint, on, logoHtml) => `<label class="radio ${on ? 'on' : ''}" onclick="PAY_METHOD='${id}'"><span class="dot"></span><span class="b"><span class="l1">${logoHtml || ''}<span>${label}</span></span><span class="l2">${hint}</span></span></label>`;
  return `
  <div><h1 class="pt">${t('co_title')} ${later('phase4')}</h1><div class="steps"><i class="on"></i><i class="on"></i><i class="${o.step3 ? 'on' : ''}"></i></div></div>
  ${o.errors ? `<div class="banner bad">${I.warn}<span>${t('err_fix', { n: 3 })}</span></div>` : ''}
  <div class="two"><div style="display:flex;flex-direction:column;gap:16px">
    <div class="card2"><div class="sechead"><h2><span class="stepnum done">1</span>${t('co_contact')}</h2><span class="lnk" onclick="go('account-signin')">${t('co_signin_lnk')}</span></div>${field(t('name'), input(o.errors ? '' : L('রুমানা আক্তার', 'Rumana Akter'), L('যেমন: রুমানা আক্তার', 'e.g. Rumana Akter')))}${field(t('phone_'), input(o.errors ? '0171' : '01711 223344', '01XXXXXXXXX', 'inputmode=tel', o.errors), o.errors ? null : t('co_phone_help'), o.errors ? t('err_phone') : null)}</div>
    <div class="card2"><div class="sechead"><h2><span class="stepnum ${o.errors ? '' : 'done'}">2</span>${t('co_address')}</h2></div><div class="grid2">${field(t('district'), select([['', '—'], ...LOC.districts.map(([k, b, e]) => [k, L(b, e)])], o.nodelivery ? 'bandarban' : 'dhaka'))}${field(t('thana'), select([['', '—'], ...((o.nodelivery ? LOC.thanas.bandarban : LOC.thanas.dhaka)).map(([k, b, e]) => [k, L(b, e)])], o.errors ? '' : (o.nodelivery ? 'ruma' : 'mirpur'), o.errors), null, o.errors ? t('err_thana') : null)}</div>${field(t('courier_area'), select([['', '—'], ['mirpur-10', 'Mirpur 10'], ['mirpur-11', 'Mirpur 11']], 'mirpur-10'), L('স্টেডফাস্ট কুরিয়ারের এরিয়া; না জানলে খালি রাখুন', 'Steadfast\'s area; leave it if unsure'))}${field(t('address'), textarea(o.errors ? '' : L('বাসা ১২/বি, রোড ৩, মিরপুর ১০', 'House 12/B, Road 3, Mirpur 10'), t('address_ph')), null, o.errors ? t('err_addr') : null)}${o.nodelivery ? `<div class="banner bad">${I.warn}<span><b>${t('no_delivery', { a: L('বান্দরবান', 'Bandarban') })}</b><br>${t('no_delivery_hint')}</span></div>` : ''}${o.limited ? `<div class="banner bad">${I.warn}<span>${t('limited_hint', { p: pName(P[6]), z: L(ZONE.inside.bn, ZONE.inside.en) })}</span></div>` : ''}<label class="line" style="cursor:pointer">${I.check}<span>${t('co_save_addr')}</span></label></div>
    <div class="card2"><div class="sechead"><h2><span class="stepnum">3</span>${t('co_payment')}</h2></div>${adv ? `<div class="banner warn">${I.info}<span>${t('pm_adv_note', { n: adv, r: total - adv })}</span></div>` : ''}${adv ? '' : pm('cod', t('pay_cod'), t('pay_cod_hint'), true, `<span class="wlogo" style="background:var(--sunken);color:var(--text);height:24px">${I.cash}</span>`)}${pm('bkash', 'bKash', t('pm_gateway_hint'), !!adv && (PAY_METHOD === 'bkash'), LOGOS.bkash)}${pm('nagad', 'Nagad', t('pm_manual_hint'), !!adv && PAY_METHOD === 'nagad', LOGOS.nagad)}${pm('rocket', '', t('pm_manual_hint'), false, LOGOS.rocket)}${pm('bank', t('pm_bank'), L('ব্যাংক অ্যাকাউন্টে পাঠিয়ে রেফারেন্স দিন', 'Transfer to the bank account and enter the reference'), false, LOGOS.bank)}<div class="sub" style="font-size:12px">${t('pm_route_note')}</div></div>
  </div>
  <div class="side"><div class="card2"><h3>${t('co_summary')}</h3>${CART.map((l) => `<div class="cl"><span class="th">${pName(l.p).slice(0, 1)}</span><div class="b"><div class="nm">${pName(l.p)}</div><div class="vr">${L(l.vbn, l.v)} × ${l.qty}</div><div class="row"><span></span><span class="price">${money(l.p.price * l.qty)}</span></div></div></div>`).join('')}<div class="sum"><div class="r"><span class="k">${t('subtotal')}</span><span>${money(sub)}</span></div><div class="r"><span class="k">${t('delivery')} · ${L(ZONE.inside.bn, ZONE.inside.en)}</span><span>${money(d)}</span></div><div class="r total"><span>${t('grand_total')}</span><span class="price">${money(total)}</span></div>${adv ? `<div class="r"><span class="k">${t('adv_now')}</span><span class="price">${money(adv)}</span></div><div class="r"><span class="k">${t('cod_rem')}</span><span>${money(total - adv)}</span></div>` : ''}</div><button class="btn primary lg block" onclick="go('${adv ? 'confirm-advance' : 'confirm-cod'}')" ${o.nodelivery || o.limited ? 'disabled' : ''}>${adv ? t('place_adv', { n: adv }) : t('place', { t: money(total) })}</button><div class="sub" style="font-size:12px;text-align:center">${t('idem_note')}</div></div></div></div>`;
}
const coHdr = { hdr: { back: 'cart', title: t('co_title') }, tight: true };
def('checkout', { group: 'Later phases (design only)', label: 'Checkout · cash on delivery (Phase 4)', url: 'megh.lytro.app/checkout', render: () => shell(coHdr, checkoutPage()) });
def('checkout-advance', { group: 'Later phases (design only)', label: 'Checkout · ৳200 advance by bKash (PRD-08)', url: 'megh.lytro.app/checkout', render: () => shell(coHdr, checkoutPage({ adv: true })) });
def('checkout-errors', { group: 'Later phases (design only)', label: 'Checkout · field errors', url: 'megh.lytro.app/checkout', render: () => shell(coHdr, checkoutPage({ errors: true })) });
def('checkout-nodelivery', { group: 'Later phases (design only)', label: 'Checkout · no delivery to Bandarban (DLV-06)', url: 'megh.lytro.app/checkout', render: () => shell(coHdr, checkoutPage({ nodelivery: true })) });
def('checkout-limited', { group: 'Later phases (design only)', label: 'Checkout · a product that only goes to Dhaka city (DLV-07)', url: 'megh.lytro.app/checkout', render: () => shell(coHdr, checkoutPage({ limited: true })) });

function confirmPage(o) {
  o = o || {}; const no = 'ORD-20261021-0042'; const track = 'K7F2M9QX';
  if (o.adv) { const gw = o.method === 'bkash'; const logoHtml = LOGOS[o.method || 'bkash']; return `<div class="bare" style="position:static;padding:32px 16px;min-height:100%"><div class="box"><span class="logo" style="background:var(--warning-soft);color:var(--warning)">${I.clock}</span><h1>${t('cf_adv_h', { n: 200 })}</h1><p>${t('cf_adv_p', { o: no })}</p><div class="card2" style="width:100%;flex-direction:row;align-items:center;gap:12px;text-align:left">${logoHtml}<span style="flex:1;font-size:14px;color:var(--muted)">${gw ? t('cf_route_gateway') : t('cf_route_hosted')}</span><span class="lnk" style="color:var(--accent-text);font-weight:600;cursor:pointer;font-size:13px" onclick="go('checkout-advance')">${t('change')}</span></div><button class="btn primary lg block" onclick="go('${gw ? 'pay-gateway' : 'pay-hosted'}')">${gw ? t('cf_go_gateway') : t('cf_pay_btn')} ${I.chev}</button><div class="line" style="justify-content:center">${I.lock}<span>${gw ? t('cf_gateway_note') : t('cf_pay_note')}</span></div><div class="sum" style="width:100%;text-align:left"><div class="r"><span class="k">${t('adv_now')}</span><span class="price">${money(200)}</span></div><div class="r"><span class="k">${t('cod_rem')}</span><span>${money(cartSub() + 70 - 200)}</span></div></div></div></div>`; }
  if (o.paid) return `<div class="bare" style="position:static;padding:32px 16px;min-height:100%"><div class="box"><span class="logo" style="background:var(--success-soft);color:var(--success)">${I.check}</span><h1>${t('cf_paid_h')} ${later('phase5')}</h1><p>${t('cf_paid_p', { n: 200, o: no })}</p><button class="btn primary lg block" onclick="go('tracking')">${t('cf_track')} · ${track}</button><div class="sum" style="width:100%;text-align:left"><div class="r"><span class="k">${t('cf_paid_line')}</span><span class="price">${money(200)}</span></div><div class="r"><span class="k">${t('cod_rem')}</span><span>${money(cartSub() + 70 - 200)}</span></div></div></div></div>`;
  if (o.checking) return `<div class="bare" style="position:static;padding:32px 16px;min-height:100%"><div class="box"><span class="logo" style="background:var(--accent-soft);color:var(--accent-text)">${I.refresh}</span><h1>${t('cf_checking_h')} ${later('phase5')}</h1><p>${t('cf_checking_p', { o: no })}</p><button class="btn ghost block" onclick="go('tracking')">${t('cf_track')} · ${track}</button></div></div>`;
  if (o.cancelled) return `<div class="bare" style="position:static;padding:32px 16px;min-height:100%"><div class="box"><span class="logo" style="background:var(--danger-soft);color:var(--danger)">${I.warn}</span><h1>${t('pc_h')} ${later('phase5')}</h1><p>${t('pc_p', { o: no, m: 22 })}</p><button class="btn primary lg block" onclick="go('confirm-advance')">${t('retry')}</button><button class="btn ghost block" onclick="go('confirm-cod')">${t('switch_cod')}</button></div></div>`;
  return `<div class="bare" style="position:static;padding:32px 16px;min-height:100%"><div class="box"><span class="logo" style="background:var(--success-soft);color:var(--success)">${I.check}</span><h1>${t('cf_h')} ${later('phase4')}</h1><p>${t('cf_p', { o: no, ph: '01711 223344' })}</p><button class="btn primary lg block" onclick="go('tracking')">${t('cf_track')} · ${track}</button><div class="card2" style="width:100%;text-align:left"><h3>${t('cf_next')}</h3><div class="tl"><div class="s done"><div class="t">${t('cf_n1')}</div></div><div class="s todo"><div class="t">${t('cf_n2')}</div></div><div class="s todo"><div class="t">${t('cf_n3', { t: (cartSub() + 70).toLocaleString('en-US') })}</div></div></div></div>${pwaPrompt().replace('class="pwa"', 'class="pwa" style="position:static;width:100%"')}</div></div>`;
}
def('confirm-cod', { group: 'Later phases (design only)', label: 'Order placed · cash on delivery (Phase 4)', url: 'megh.lytro.app/order/K7F2M9QX', render: () => shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage()) });
def('confirm-advance', { group: 'Paying (Phase 5)', label: 'Order held · bKash chosen, its gateway is on (PAY-06)', url: 'megh.lytro.app/order/K7F2M9QX', render: () => shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage({ adv: true, method: PAY_METHOD === 'nagad' ? 'nagad' : 'bkash' })) });
def('confirm-advance-manual', { group: 'Paying (Phase 5)', label: 'Order held · Nagad chosen, manual: the hosted page', url: 'megh.lytro.app/order/K7F2M9QX', render: () => { PAY_METHOD = 'nagad'; return shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage({ adv: true, method: 'nagad' })); } });
def('confirm-paid', { group: 'Paying (Phase 5)', label: 'Back from payment · paid, order confirmed', url: 'megh.lytro.app/order/K7F2M9QX?pay=verified', render: () => shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage({ paid: true })) });
def('confirm-checking', { group: 'Paying (Phase 5)', label: 'Back from payment · still being checked (PAY-17)', url: 'megh.lytro.app/order/K7F2M9QX?pay=checking', render: () => shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage({ checking: true })) });
def('pay-cancelled', { group: 'Paying (Phase 5)', label: 'Back from payment · not paid (PAY-08)', url: 'megh.lytro.app/order/K7F2M9QX?pay=cancelled', render: () => shell({ hdr: { minimal: true }, tight: true, nofoot: true }, confirmPage({ cancelled: true })) });

/* tracking (ORD-17, ORD-18, SFT-08) */
function trackingPage(o) {
  o = o || {};
  const steps = [['tr_placed', '21 Oct, 14:32', 'done'], ['tr_confirmed', '21 Oct, 15:10', 'done'], ['tr_processing', '22 Oct, 09:40', 'now'], ['tr_shipped', '', 'todo'], ['tr_delivered', '', 'todo']];
  return `<div><h1 class="pt">${t('tr_title')} ${later('phase4')}</h1></div>
  <div class="sbox">${I.search}<input value="K7F2M9QX" placeholder="${t('tr_id')}" style="font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em"><button class="btn sm dark">${t('tr_find')}</button></div>
  <div class="two"><div class="card2"><div class="sechead"><h3>ORD-20261021-0042</h3>${stChip('in').replace(t('in_stock'), t('tr_processing'))}</div><div class="tl">${steps.map(([k, d, c]) => `<div class="s ${c}"><div class="t">${t(k)}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`).join('')}</div><div class="line">${I.truck}<span>${t('tr_courier', { c: 'Steadfast', code: 'SF-88213' })}</span></div></div>
  <div class="side card2"><h3>${t('tr_items')}</h3>${CART.map((l) => `<div class="cl"><span class="th">${pName(l.p).slice(0, 1)}</span><div class="b"><div class="nm">${pName(l.p)}</div><div class="vr">${L(l.vbn, l.v)} × ${l.qty}</div></div></div>`).join('')}<div class="sum"><div class="r"><span class="k">${t('subtotal')}</span><span>${money(cartSub())}</span></div><div class="r"><span class="k">${t('delivery')}</span><span>${money(70)}</span></div><div class="r total"><span>${t('cod_rem')}</span><span class="price">${money(cartSub() + 70)}</span></div></div><button class="btn ghost block" onclick="go('account-signin')">${I.user}${t('tr_phone')}</button></div></div>`;
}
def('tracking', { group: 'Later phases (design only)', label: 'Tracking page (Phase 4)', url: 'megh.lytro.app/track/K7F2M9QX', render: () => shell({ hdr: { back: 'home', title: t('tr_title') } }, trackingPage()) });

/* shopper account (CUS-03 to CUS-06, SFT-09) */
def('account-signin', { group: 'Later phases (design only)', label: 'Account · OTP sign-in (Phase 4)', url: 'megh.lytro.app/sign-in', render: () => shell({ hdr: { back: 'home', title: t('ac_signin') }, tight: true }, `<div style="max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px"><div><h1 class="pt">${t('ac_signin')} ${later('phase4')}</h1><div class="sub">${t('ac_hint')}</div></div><div class="card2">${field(t('phone_'), input('01711 223344', '01XXXXXXXXX', 'inputmode=tel'))}<button class="btn primary lg block" onclick="go('account-otp')">${t('ac_send')}</button></div></div>`) });
def('account-otp', { group: 'Later phases (design only)', label: 'Account · enter the code', url: 'megh.lytro.app/sign-in', render: () => shell({ hdr: { back: 'account-signin', title: t('ac_signin') }, tight: true }, `<div style="max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px"><div><h1 class="pt">${t('ac_code')}</h1><div class="sub">${t('ac_sent', { ph: '01711 223344' })}</div></div><div class="card2">${field(t('ac_code'), `<div class="otp" role="group" aria-label="${t('ac_code')}"><span>4</span><span>8</span><span>1</span><span class="on"></span><span></span><span></span></div>`, t('ac_otp_help'))}<button class="btn primary lg block" onclick="go('account-orders')">${t('ac_verify')}</button><button class="btn quiet">${t('ac_resend')} · 0:42</button></div></div>`) });
def('account-orders', { group: 'Later phases (design only)', label: 'Account · my orders', url: 'megh.lytro.app/account', render: () => shell({ hdr: { back: 'home', title: t('account') } }, `<div><h1 class="pt">${t('ac_hello', { n: L('রুমানা', 'Rumana') })}</h1><div class="sub">01711 223344 · <a href="#" onclick="go('home');return false">${t('ac_signout')}</a></div></div>
  <div class="chips"><span class="chip on">${t('ac_orders')}</span><span class="chip" onclick="go('account-addresses')">${t('ac_addresses')}</span></div>
  <div class="card2" style="padding:0">${[['ORD-20261021-0042', '21 Oct 2026', 'tr_processing', cartSub() + 70, 'low'], ['ORD-20261003-0017', '3 Oct 2026', 'tr_delivered', 1320, 'in'], ['ORD-20260914-0008', '14 Sep 2026', 'tr_delivered', 450, 'in']].map(([no, d, s, tot, c]) => `<div class="cl" style="padding:14px 16px;cursor:pointer" onclick="go('tracking')"><div class="b"><div class="nm" style="font-family:ui-monospace,Menlo,monospace;font-size:14px">${no}</div><div class="vr">${d}</div></div><div style="text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end">${stChip(c).replace(c === 'low' ? t('low') : t('in_stock'), t(s))}<span class="price">${money(tot)}</span></div></div>`).join('')}</div>`) });
def('account-addresses', { group: 'Later phases (design only)', label: 'Account · saved addresses (CUS-06)', url: 'megh.lytro.app/account/addresses', render: () => shell({ hdr: { back: 'home', title: t('account') } }, `<div><h1 class="pt">${t('ac_hello', { n: L('রুমানা', 'Rumana') })}</h1></div>
  <div class="chips"><span class="chip" onclick="go('account-orders')">${t('ac_orders')}</span><span class="chip on">${t('ac_addresses')}</span></div>
  <div style="display:flex;flex-direction:column;gap:10px">${[[L('বাসা', 'Home'), L('বাসা ১২/বি, রোড ৩, মিরপুর ১০, ঢাকা', 'House 12/B, Road 3, Mirpur 10, Dhaka'), true], [L('অফিস', 'Office'), L('লেভেল ৫, কাওরান বাজার, ঢাকা', 'Level 5, Kawran Bazar, Dhaka'), false]].map(([n, a, d]) => `<div class="card2" style="flex-direction:row;align-items:flex-start;gap:12px">${I.pin}<div style="flex:1"><b>${n}</b> ${d ? `<span class="st info plain">${t('ac_default')}</span>` : ''}<div class="sub">${a}</div></div><button class="btn quiet sm">${L('এডিট', 'Edit')}</button></div>`).join('')}<button class="btn ghost">${I.plus}${t('ac_add_addr')}</button></div>`) });

/* combo product page (CMB-09, Phase 4) */
def('home-later', { group: 'Later phases (design only)', label: 'Home · Bestsellers, bKash and Nagad, courier (Phases 4, 5)', url: 'megh.lytro.app', render: () => shell({}, homePage({ later: true })) });
def('combo', { group: 'Later phases (design only)', label: 'Combo pack · what\'s inside (CMB-09, Phase 4)', url: 'megh.lytro.app/p/eid-combo', render: () => { const p = P[9]; return shell(pHdr(p), `<div class="pdp">${gallery(p)}<div class="buy">
    <div class="top"><div class="eyebrow">${catName('panjabi')} · ${later('phase4')}</div><h1 class="pt">${pName(p)}</h1><div class="pricerow"><span class="price">${money(p.price)}</span><span class="unit" style="text-decoration:line-through">${money(1670)}</span><span class="st ok plain">${t('save', { n: 170 })}</span>${stChip('in')}</div></div>
    <div class="opt"><div class="lb"><span>${t('inside')}</span></div><div class="combo"><div class="part"><span class="th"></span><div class="b">${pName(P[0])} × 1<div class="l2">${t('pick_each')}: ${t('size')} <b>M</b> · ${t('colour')} <b>${L('সাদা', 'White')}</b> <span class="lnk" style="color:var(--accent-text)">${t('change')}</span></div></div></div><div class="part"><span class="th"></span><div class="b">${pName(P[6])} × 1<div class="l2">${L('নেভি চেক', 'Navy check')}</div></div></div></div></div>
    <div class="opt"><div class="lb"><span>${t('qty')}</span></div>${qty(1)}</div>
    <div class="line">${I.truck}<span><b>${t('deliv_est')}</b>: ${t('deliv_range')}</span></div>
    <div class="dbtns">${btn2({})}</div></div></div>`, buybar(p)); } });

/* chat widget (CHT-01, Phase 7) */
def('chat', { group: 'Later phases (design only)', label: 'Chat widget (CHT-01, Phase 7)', url: 'megh.lytro.app/p/cotton-panjabi', render: () => shell(pHdr(P[0]), productPage(P[0]), buybar(P[0]) + `<div class="chatbox"><div class="ch">${logo()}<span style="flex:1">${t('chat_h', { s: shopName() })}<div style="font-size:12px;font-weight:400;opacity:.85">${t('chat_hint')} · ${later('phase7')}</div></span><button class="x" style="color:inherit">${I.x}</button></div><div class="msgs"><div class="m me">${L('XL সাইজে নেভি কি আছে?', 'Do you have XL in navy?')}</div><div class="m">${L('জি, আছে। আজ অর্ডার করলে কালই পাবেন।', 'Yes, we do. Order today and it arrives tomorrow.')}</div></div><div class="in"><input class="input" placeholder="${t('chat_ph')}"><button class="btn primary sm">${I.chev}</button></div></div>`) });
def('chat-fab', { group: 'Later phases (design only)', label: 'Chat bubble on the product page', url: 'megh.lytro.app/p/cotton-panjabi', render: () => shell(pHdr(P[0]), productPage(P[0]), buybar(P[0]) + `<button class="chatfab" onclick="go('chat')">${I.chat}<span class="n">1</span></button>`) });

/* ---------- render ---------- */
function setLang(l) { ST.lang = l; document.querySelectorAll('#segLang button').forEach((b) => b.classList.toggle('on', b.dataset.v === l)); render(); }
function render() {
  const f = document.getElementById('frame'); const scr = SCREENS[ST.screen] || SCREENS.home;
  f.className = 'frame ' + ST.device; f.dataset.lang = ST.lang; f.dataset.brand = ST.brand;
  document.getElementById('urlbar').textContent = scr.url || 'megh.lytro.app';
  document.getElementById('root').innerHTML = scr.render();
  document.getElementById('caption').innerHTML = `<b>${scr.group} · ${scr.label}</b> — ${scr.url || ''}`;
}
(function init() {
  const sel = document.getElementById('selScreen'); const groups = {};
  for (const [id, s] of Object.entries(SCREENS)) (groups[s.group] = groups[s.group] || []).push([id, s.label]);
  for (const [g, items] of Object.entries(groups)) { const og = document.createElement('optgroup'); og.label = g; for (const [id, label] of items) { const o = document.createElement('option'); o.value = id; o.textContent = label; og.appendChild(o); } sel.appendChild(og); }
  sel.value = ST.screen;
  sel.addEventListener('change', () => { ST.screen = sel.value; render(); });
  document.querySelectorAll('#segDevice button').forEach((b) => b.addEventListener('click', () => { ST.device = b.dataset.v; document.querySelectorAll('#segDevice button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));
  document.querySelectorAll('#segLang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.v)));
  document.querySelectorAll('#segBrand button').forEach((b) => b.addEventListener('click', () => { ST.brand = b.dataset.v; document.querySelectorAll('#segBrand button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));
  render();
})();
</script>

<script type="text/template" id="paytpl">
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro payment page prototype</title>
<meta name="description" content="Hosted manual-payment page prototype for Lytro (pay.lytro.app), matched to the reference layout: wallet picker, per-wallet coloured card with the transaction-ID box and instructions, fixed verify button; 320 px full-bleed and a 672 px centred card from 640 px. Spec: docs/PAYMENT-PAGE-DESIGN.md.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap">
<style>
/* Tailwind values the reference page uses, written out: sky-50/100/900, gray-100/200/500/600/900, yellow-50/100/300. */
:root{
  --sky-50:#f0f9ff;--sky-100:#e0f2fe;--sky-900:#0c4a6e;--blue:#1e8fe0;
  --g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g500:#6b7280;--g600:#4b5563;--g900:#111827;
  --y50:#fefce8;--y100:#fef9c3;--y300:#fde047;
  --sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);--sh-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);--sh-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --font:'Hind Siliguri',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--g900);background:#e6ebea;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* harness (not product UI) */
.tb{position:sticky;top:0;z-index:50;background:#10201f;color:#eaf0ef;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;font-size:13px;font-family:Inter,system-ui,sans-serif}
.tb .brand{font-weight:800;letter-spacing:-.03em;font-size:16px;color:#fff;margin-right:8px}
.tb label{display:flex;align-items:center;gap:6px;color:#a9b9b8}
.tb select{background:#1a3230;color:#fff;border:1px solid #335450;border-radius:6px;padding:5px 8px;font-size:13px}
.tb .seg{display:inline-flex;border:1px solid #335450;border-radius:6px;overflow:hidden}
.tb .seg button{padding:5px 10px;color:#a9b9b8}
.tb .seg button.on{background:#3ec4b9;color:#10201f;font-weight:600}
.tb .note{margin-left:auto;color:#7e8f8e}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.frame{container-type:inline-size;background:var(--sky-50);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(16,32,31,.25)}
.frame.small{width:320px;height:616px;border-radius:28px;border:8px solid #0b1514}
.frame.phone{width:390px;height:844px;border-radius:40px;border:8px solid #0b1514}
.frame.desktop{width:1280px;height:820px;border-radius:12px;border:1px solid #c9d3d2}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;background:var(--sky-50)}
.frame.desktop .statusbar{display:none}
.urlbar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;background:#f1f4f3;border-bottom:1px solid #d5dfde;font-size:13px;color:#2c3f3e;font-family:Inter,system-ui,sans-serif}
.frame.desktop .urlbar{display:flex}
.urlbar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d5dfde;margin-right:6px}
.urlbar .url{background:#fff;border:1px solid #d5dfde;border-radius:6px;padding:4px 10px;flex:1;max-width:520px}
.caption{max-width:1280px;margin:0 auto;padding:0 16px 40px;color:#2c3f3e;font-size:13px;line-height:1.6;font-family:Inter,system-ui,sans-serif}
.caption b{color:#10201f}

/* page: root → card → topbar + content; fixed bar */
.pp{position:absolute;left:0;right:0;bottom:0;top:44px;overflow:auto;background:var(--sky-50)}
.frame.desktop .pp{top:40px}
.root{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.card{position:relative;width:100%;min-height:100%;padding:0 16px;background:transparent}
.topbar{margin:8px;padding:8px;border-radius:12px;border:1px solid var(--sky-100);background:rgba(255,255,255,.65);box-shadow:0 8px 24px rgba(2,132,199,.08);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:space-between}
.topbar button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--g900)}
.topbar svg.i{width:28px;height:28px;stroke-width:2.5}
.content{padding-bottom:16px;font-size:14px;font-weight:400;line-height:1.625}
.content.has-fixed{padding-bottom:96px}

/* picker */
.brandrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px}
.brandrow .logo{width:56px;height:56px;border-radius:50%;border:1px solid var(--g200);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--sh-sm)}
.brandrow .logo .mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0e6b66;color:#fff;font-weight:700;font-size:22px}
.brandrow .nm{font-size:18px;font-weight:700;line-height:1.3}
.brandrow .pill{margin-top:4px;height:28px;padding:0 14px;border-radius:999px;border:1px solid var(--g300);background:#fff;font-size:13px;font-weight:500;box-shadow:var(--sh-sm);display:inline-flex;align-items:center}
.contacts{display:flex;justify-content:center;gap:12px;margin-top:32px}
.contacts button{width:48px;height:48px;border-radius:12px;border:1px solid var(--g200);background:#fff;box-shadow:var(--sh-sm);display:inline-flex;align-items:center;justify-content:center}
.contacts svg.i{width:24px;height:24px}
.sect{margin:24px 16px 0;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;text-align:center;line-height:26px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0 20px;margin-top:32px}
.tile{height:70px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{max-height:32px;max-width:110px;display:block}
.tile .txt{font-weight:700;font-size:22px;letter-spacing:-.01em}
.paybar{margin:16px 16px 0;padding:12px;border-radius:8px;background:var(--sky-100);color:var(--sky-900);font-size:20px;font-weight:700;text-align:center;line-height:28px}

/* wallet panel */
.whead{margin-top:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--g100);box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:space-between}
.whead .lbox{width:96px;height:56px;border-radius:8px;background:var(--g100);display:flex;align-items:center;justify-content:center;overflow:hidden}
.whead .lbox img{max-height:30px;max-width:80px;display:block}
.whead .lbox .txt{font-weight:700;font-size:18px}
.whead .amt{display:flex;align-items:center;gap:16px}
.whead .amt i{display:block;width:1px;height:32px;background:var(--g200)}
.whead .amt b{font-size:24px;font-weight:700;padding-right:12px;white-space:nowrap}
.note{margin-top:16px;padding:6px 8px;border-radius:4px;background:var(--y50);border:1px solid var(--y100);color:var(--g600);font-weight:300;font-size:12px;text-align:center;opacity:.5;line-height:20px}
.note b{font-weight:700}
.ccard{margin-top:8px;padding:24px;border-radius:12px;color:#fff;box-shadow:var(--sh-md);margin-bottom:12px}
.ccard .ctitle{text-align:center;font-size:16px;font-weight:500;opacity:.95;margin-bottom:8px;line-height:24px}
.ccard .inp{height:44px;border-radius:8px;background:#fff;color:var(--g500);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 12px;box-shadow:var(--sh-sm)}
.ccard .inp.val{color:var(--g900);font-weight:600;letter-spacing:.04em}
.ccard .inp.bad{box-shadow:0 0 0 2px var(--y300)}
.ccard .ierr{margin-top:6px;font-size:12px;font-weight:600;color:var(--y300);text-align:center}
.ccard .ihead{margin-top:16px;padding-bottom:4px;margin-bottom:8px;border-bottom:1px solid rgba(0,0,0,.15);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.ilist{list-style:none;font-size:12px;font-weight:300}
.ilist li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.15)}
.ilist li:last-child{border-bottom:0}
.ilist li::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);flex:none}
.ilist .hl{font-weight:700;color:var(--y300);font-size:16px;line-height:1.3}
.ilist .copy{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--g900);color:#fff;font-size:14px;font-weight:500;margin-left:8px;vertical-align:middle;box-shadow:var(--sh-sm)}
.ilist .copy svg.i{width:16px;height:16px}
.ilist li span{flex:1;min-width:0}
.legal{margin-top:4px;font-size:12px;color:var(--g500);text-align:center;line-height:1.6}
.legal a{color:var(--g600);text-decoration:underline}
.fixedbar{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;padding:28px 16px max(14px, env(safe-area-inset-bottom));z-index:10;background:linear-gradient(to top,var(--sky-50) 60%,rgba(240,249,255,0))}
.fixedbar .vbtn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:12px;color:#fff;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--sh-lg)}
.fixedbar .vbtn.disabled{background:var(--sky-100);color:var(--sky-900)}

/* status states, in the same language */
.scard{margin-top:12px;padding:32px 24px;border-radius:16px;background:#fff;border:1px solid var(--g100);box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scard .ic{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.scard .ic svg{width:40px;height:40px}
.scard h2{font-size:20px;font-weight:700}
.scard p{font-size:14px;color:var(--g600);max-width:320px}
.scard .det{width:100%;background:var(--g100);border-radius:8px;padding:4px 12px;margin-top:4px}
.scard .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.scard .kv + .kv{border-top:1px solid var(--g200)}
.scard .kv .k{color:var(--g600)}
.scard .kv .v{font-weight:600}
.ring{position:relative;width:72px;height:72px}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--g100)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:120}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tick{width:72px;height:72px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center}
.tick svg{width:40px;height:40px;stroke:#15803d;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--g900);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:var(--sh-lg)}
.toast svg.i{width:18px;height:18px;color:#86efac}
.scrim{position:absolute;inset:0;background:rgba(17,24,39,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:92%;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.2)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sheet .sh h2{font-size:18px;font-weight:700}
.sheet .sb{overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:4px}
.sheet .sf{padding:12px 16px 16px;border-top:1px solid var(--g200)}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--g300);flex:none}
.radio.on{border-color:var(--blue);border-width:7px}
.sheet .btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.sheet .inp{height:44px;border:1px solid var(--g300);border-radius:8px;display:flex;align-items:center;padding:0 12px;color:var(--g500);margin-top:8px}

/* 640 and up: the centred card, exactly as the reference's sm: classes */
@container (min-width: 640px){
  .root{padding:0 16px;min-height:100%}
  .card{min-height:0;height:max-content;max-width:672px;border-radius:8px;box-shadow:var(--sh-xl);background:#fff;backdrop-filter:blur(4px);margin:24px auto}
  .topbar{margin:12px;padding:12px}
  .content{padding-bottom:32px}
  .content.has-fixed{padding-bottom:32px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .note{font-size:14px}
  .ilist{font-size:14px}
  .ilist .hl{font-size:18px}
  .fixedbar{max-width:672px}
  .scrim{align-items:center}
  .sheet{width:440px;border-radius:16px;max-height:80%}
  .toast{left:50%;transform:translateX(-50%);width:360px;right:auto}
}
.brandrow .ref{font-size:13px;color:var(--g600);margin-top:2px}
/* embedded inside the dashboard prototype: no toolbar, the page fills the iframe */
body.embedded{background:var(--sky-50)}
.embedded .tb,.embedded .caption{display:none}
.embedded .stage{padding:0}
.embedded .frame{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}
