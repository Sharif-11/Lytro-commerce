<body>
<div class="tb">
  <span class="brand">lytro · payment page prototype</span>
  <label>State
    <select id="selScreen">
      <optgroup label="Choose"><option value="pick">Method picker</option></optgroup>
      <optgroup label="Wallet panels"><option value="bkash">bKash · Send Money</option><option value="bkash-agent">bKash · agent (Cash Out)</option><option value="bkash-merchant">bKash · merchant (Payment)</option><option value="nagad">Nagad · Send Money</option><option value="rocket">Rocket · Send Money</option><option value="upay">Upay · Send Money</option><option value="dup">bKash · duplicate TrxID error</option><option value="copied">bKash · number copied (toast)</option></optgroup>
      <optgroup label="After verify"><option value="checking">Checking, listener online (12 s)</option><option value="checking-late">Checking, past 30 s</option><option value="manual">Manual check (listener offline)</option><option value="verified">Verified</option><option value="review">Needs review</option><option value="rejected">Rejected with a reason</option><option value="expired">Expired</option><option value="paid">Already paid</option><option value="cancelled">Cancelled</option><option value="suspended">Page suspended</option></optgroup>
      <optgroup label="Other"><option value="platform">Platform payment (Lytro, plan)</option><option value="report">Report this page (sheet)</option></optgroup>
    </select>
  </label>
  <label>Device <span class="seg" id="segDevice"><button data-v="small">Small 320</button><button data-v="phone" class="on">Phone 390</button><button data-v="desktop">Desktop 1280</button></span></label>
  <label>Language <span class="seg" id="segLang"><button data-v="bn" class="on">বাংলা</button><button data-v="en">EN</button></span></label>
  <span class="note">Spec: docs/PAYMENT-PAGE-DESIGN.md</span>
</div>
<div class="stage"><div id="frame" class="frame phone" data-lang="bn"></div></div>
<p class="caption"><b>How to read this.</b> The layout follows the reference page element for element, with the same spacing values its markup uses: a frosted top bar with back and close; on the picker the shop's logo and name with "View Details", three contact buttons, the blue "Mobile Banking" bar, four logo tiles and the light "Pay" bar; on a wallet's screen the logo-and-amount header, the faded yellow note, the wallet-coloured card with the centred transaction-ID box and the INSTRUCTIONS list with yellow highlights and the black Copy button, and the fixed VERIFY TRANSACTION button. Below 640 px the page is full-bleed; from 640 px it is a 672 px white card centred on the page. bKash and Nagad use the official marks from <code>docs/brand/third-party/</code>; Rocket and Upay are text stand-ins until their marks are fetched. "Secured by Lytro", the PIN notice and "Report" are the one line the SRS adds under the card.</p>
<script>
const I = {
  back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  headset:'<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3z"/><path d="M21 14h-3a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h3z"/><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 19a3 3 0 0 1-3 3h-3"/>',
  chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.5 9.5c0 2.5 3 5.5 5.5 5.5l1.5-1.5-2-1.5-1 1a4.5 4.5 0 0 1-2.5-2.5l1-1-1.5-2Z"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const ic = (n, s, sw) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="${s ? `width:${s}px;height:${s}px;` : ''}${sw ? `stroke-width:${sw}` : ''}">${I[n]}</svg>`;

const S = {
  viewDetails:['View Details','View Details'],mobileBanking:['Mobile Banking','Mobile Banking'],pay:['Pay {a} BDT','Pay {a} BDT'],
  note:['<b>নোট:</b> টাকা পাঠানোর ৫-১০ সেকেন্ড পর ভেরিফাই করবেন।','<b>Note:</b> verify 5 to 10 seconds after sending the money.'],
  enterTrx:['ট্রান্সজেকশন আইডি দিন','Enter the transaction ID'],instructions:['INSTRUCTIONS','INSTRUCTIONS'],copy:['Copy','Copy'],verify:['VERIFY TRANSACTION','VERIFY TRANSACTION'],
  dupErr:['এই ট্রান্সেকশন আইডি ইতিমধ্যে ব্যবহৃত হয়েছে','This transaction ID has already been used'],
  legal:['🔒 Secured by Lytro · এই পেজ কখনো PIN বা OTP চায় না · <a href="#" onclick="go(\'report\');return false">রিপোর্ট করুন</a>','🔒 Secured by Lytro · This page never asks for your PIN or OTP · <a href="#" onclick="go(\'report\');return false">Report this page</a>'],
  copiedNo:['নম্বর কপি হয়েছে: {n}','Number copied: {n}'],
  checkingT:['SMS মেলানো হচ্ছে…','Matching the SMS…'],checkingP:['সাধারণত ১০ সেকেন্ড লাগে। এই পেজে থাকুন।','Usually about 10 seconds. Stay on this page.'],
  lateT:['আমরা শিগগিরই কনফার্ম করব','We will confirm shortly'],lateP:['এই পেজ বন্ধ করলেও হবে। কনফার্ম হলে SMS পাবেন, আর দোকান জানবে।','You can close this page. You get an SMS when it is confirmed, and the shop is told.'],
  manualT:['দোকান চেক করে কনফার্ম করবে','The shop will check and confirm'],manualP:['সাধারণত কিছুক্ষণের মধ্যে। কনফার্ম হলে SMS পাবেন।','Usually within a short while. You get an SMS when it is confirmed.'],
  verifiedT:['পেমেন্ট হয়েছে','Paid'],verifiedP:['{s} সেকেন্ডে দোকানে ফিরছেন।','Returning to the shop in {s} seconds.'],
  reviewT:['টাকা মিলছে না','The payment did not match'],reviewP:['SMS-এ ৳{a} এসেছে, পাঠানোর কথা ৳{b}। দোকান দেখে জানাবে; আপনার কিছু করতে হবে না।','The SMS shows ৳{a}, the amount was ৳{b}. The shop will check and let you know; nothing to do now.'],
  rejectedT:['পেমেন্ট কনফার্ম হয়নি','Payment not confirmed'],rejectedReason:['দোকান বলেছে: "{r}"','The shop said: "{r}"'],
  expiredT:['সময় শেষ হয়ে গেছে','This payment link has expired'],expiredP:['টাকা পাঠিয়ে থাকলে দোকানকে ট্রান্সজেকশন আইডি জানান। না পাঠিয়ে থাকলে দোকানে ফিরে আবার শুরু করুন।','If you already sent the money, give the shop the transaction ID. If not, go back and start again.'],
  paidT:['এই পেমেন্ট আগেই হয়েছে','This payment was already made'],cancelledT:['এই পেমেন্ট ক্যানসেল করা হয়েছে','This payment was cancelled'],cancelledP:['দোকান পেমেন্টটি বাতিল করেছে। নতুন করে অর্ডার করতে দোকানে ফিরুন।','The shop cancelled this payment. Go back to the shop to order again.'],
  suspendedT:['এই পেমেন্ট পেজ এখন বন্ধ আছে','This payment page is closed right now'],
  amount:['টাকা','Amount'],method:['মেথড','Method'],trx:['ট্রান্সজেকশন আইডি','Transaction ID'],time:['সময়','Time'],
  backShop:['BACK TO SHOP','BACK TO SHOP'],retry:['TRY AGAIN','TRY AGAIN'],wrongTrx:['CHANGE TRANSACTION ID','CHANGE TRANSACTION ID'],
  reportTitle:['এই পেজ রিপোর্ট করুন','Report this page'],r1:['এটা আমার দোকান নয়','This is not the shop I ordered from'],r2:['টাকার পরিমাণ ভুল','The amount is wrong'],r3:['আমার PIN চেয়েছে','It asked for my PIN'],r4:['অন্য কিছু','Something else'],rNote:['কী হয়েছে, এক লাইনে (ঐচ্ছিক)','What happened, in a line (optional)'],sendReport:['রিপোর্ট পাঠান','Send report'],
};
let LANG = 'bn';
const t = (k, v) => { let s = S[k] ? S[k][LANG === 'bn' ? 0 : 1] : k; if (v) for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b); return s; };
const L = (bn, en) => LANG === 'bn' ? bn : en;

/* wallets: colours sampled from the reference page (bKash from its markup, the rest from the screenshots); confirm against each merchant kit */
const W = {
  bkash: { name: 'bKash', up: 'BKASH', col: '#CF2772', ussd: '*247#', logo: '<img src="third-party/bkash.png" alt="bKash">' },
  nagad: { name: 'Nagad', up: 'NAGAD', col: '#D71E22', ussd: '*167#', logo: '<img src="third-party/nagad.png" alt="Nagad">' },
  rocket: { name: 'Rocket', up: 'ROCKET', col: '#892C8C', ussd: '*322#', logo: '<span class="txt" style="color:#892C8C">Rocket</span>' },
  upay: { name: 'Upay', up: 'UPAY', col: '#1F4E98', ussd: '*268#', logo: '<span class="txt" style="color:#1F4E98">উপায়</span>' },
};
const VERB = { personal: 'Send Money', agent: 'Cash Out', merchant: 'Payment' };
const PAY_INIT = window.PAY_INIT || null;
const CTX = Object.assign({ platform: false, amount: 250, ref: null, no: '01712345678', screen: 'pick', lang: 'bn' }, PAY_INIT || {});
const SHOP = { name: ['মেঘ ফ্যাশন', 'Megh Fashion'], no: CTX.no, amount: CTX.amount };
const ST = { device: 'phone', lang: CTX.lang, screen: CTX.screen, wallet: null };
const go = (s) => { ST.screen = s; const sel = document.getElementById('selScreen'); if (sel) sel.value = s; render(); };
/* the host (the dashboard prototype) is told where the shopper went; standalone, the page just restarts */
const payReturn = (status) => { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'pay-return', status }, '*'); else go('pick'); };
/* the demo verify: checking, then verified after the listener's usual few seconds */
const payVerify = () => { go('checking'); clearTimeout(ST.t); ST.t = setTimeout(() => { if (ST.screen === 'checking') go('verified'); }, 2500); };
const ACT = { checking: "go(ST.wallet || 'bkash')", rejected: "go(ST.wallet || 'bkash')", verified: "payReturn('verified')", 'checking-late': "payReturn('checking')", manual: "payReturn('checking')", review: "payReturn('review')", expired: "payReturn('expired')", paid: "payReturn('paid')", cancelled: "payReturn('cancelled')" };

/* ---------- pieces ---------- */
const topbar = (back) => `<div class="topbar"><button aria-label="back" ${back ? `onclick="go('${back}')"` : ''}>${ic('back', 28, 2.5)}</button><button aria-label="close" onclick="payReturn('cancelled')">${ic('x', 28, 2.5)}</button></div>`;
const legal = () => `<p class="legal">${t('legal')}</p>`;
const picker = (o) => `
  <div class="brandrow"><span class="logo">${o.platform ? `<span class="mono" style="background:#063b38"><svg viewBox="0 0 64 64" width="28" height="28"><path d="M15 15V49H31L49 29" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : `<span class="mono">${L('ম', 'M')}</span>`}</span><div><div class="nm">${o.platform ? 'Lytro' : L(...SHOP.name)}</div>${CTX.ref ? `<div class="ref">${CTX.ref}</div>` : ''}<button class="pill">${t('viewDetails')}</button></div></div>
  <div class="contacts"><button aria-label="support" style="color:var(--blue)">${ic('headset')}</button><button aria-label="whatsapp" style="color:#25D366">${ic('chat')}</button><button aria-label="call" style="color:var(--blue)">${ic('phone')}</button></div>
  <div class="sect">${t('mobileBanking')}</div>
  <div class="tiles">${['bkash', 'nagad', 'rocket', 'upay'].map(k => `<button class="tile" onclick="go('${k}')">${W[k].logo}</button>`).join('')}</div>
  <div class="paybar">${t('pay', { a: Number(o.amount || SHOP.amount).toLocaleString('en-US') })}</div>`;

function stepsFor(k, ty, no, amount) {
  const w = W[k]; const hl = (s) => `<b class="hl">${s}</b>`; const verb = hl(`"${VERB[ty]}"`);
  const numLine = (lead) => `${lead} ${hl(no)}<button class="copy" onclick="go('copied')">${ic('copy', 16)}${t('copy')}</button>`;
  const amtLine = L(`পরিমাণ: ${hl(Number(amount).toLocaleString('en-US'))} টাকা দিয়ে ${hl('SUBMIT')} করুন।`, `Amount: ${hl(Number(amount).toLocaleString('en-US'))} taka, then ${hl('SUBMIT')}.`);
  const verifyLine = L(`${hl('Transaction ID')} দিয়ে ${hl('VERIFY')} করুন।`, `Enter the ${hl('Transaction ID')} and ${hl('VERIFY')}.`);
  if (k === 'bkash') return [
    L(`${hl(w.ussd)} ডায়াল করে আপনার ${hl(w.up)} মোবাইল মেনুতে যান অথবা ${hl(w.up)} অ্যাপে যান।`, `Dial ${hl(w.ussd)} to open your ${hl(w.up)} mobile menu, or open the ${hl(w.up)} app.`),
    L(`${verb} -এ ক্লিক করুন।`, `Tap ${verb}.`),
    numLine(L(ty === 'agent' ? 'এজেন্ট নম্বর হিসেবে এই নম্বরটি লিখুন:' : ty === 'merchant' ? 'মার্চেন্ট নম্বর হিসেবে এই নম্বরটি লিখুন:' : 'প্রাপক নম্বর হিসেবে এই নম্বরটি লিখুন:', ty === 'agent' ? 'Enter this as the agent number:' : ty === 'merchant' ? 'Enter this as the merchant number:' : 'Enter this as the recipient number:')),
    amtLine,
    L(`এখন উপরের বক্সে আপনার ${hl('Transaction ID')} দিন এবং ${hl('VERIFY')} করুন।`, `Now enter your ${hl('Transaction ID')} in the box above and ${hl('VERIFY')}.`),
  ];
  if (k === 'nagad') return [
    L(`${hl(w.ussd)} ডায়াল করে আপনার ${hl(w.up)} মোবাইল মেনুতে যান অথবা অ্যাপে যান।`, `Dial ${hl(w.ussd)} to open your ${hl(w.up)} mobile menu, or open the app.`),
    L(`${verb} এ ক্লিক করুন।`, `Tap ${verb}.`),
    numLine(L('প্রাপক নম্বর:', 'Recipient number:')), amtLine, verifyLine,
  ];
  return [
    L(`${hl(w.ussd)} অথবা ${hl(w.up)} অ্যাপে যান।`, `Dial ${hl(w.ussd)} or open the ${hl(w.up)} app.`),
    L(k === 'rocket' ? `${verb} নির্বাচন করুন।` : `${verb} সিলেক্ট করুন।`, `Select ${verb}.`),
    numLine(L('প্রাপক নম্বর:', 'Recipient number:')), amtLine, verifyLine,
  ];
}
function panel(k, ty, o = {}) {
  const w = W[k]; const no = o.no || SHOP.no; const amount = o.amount || SHOP.amount;
  return `<div class="whead"><span class="lbox">${w.logo}</span><span class="amt"><i></i><b>${Number(amount).toLocaleString('en-US')} ৳</b></span></div>
  <div class="note">${t('note')}</div>
  <div class="ccard" style="background:${w.col}"><p class="ctitle">${t('enterTrx')}</p><div class="inp ${o.dup ? 'val bad' : ''}">${o.dup ? '9F2KQ7' : t('enterTrx')}</div>${o.dup ? `<div class="ierr">${t('dupErr')}</div>` : ''}
    <div class="ihead"><span>${t('instructions')}</span></div>
    <ul class="ilist">${stepsFor(k, ty, no, amount).map(s => `<li><span>${s}</span></li>`).join('')}</ul></div>
  ${legal()}`;
}
const det = (rows) => `<div class="det">${rows.map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;
const scard = (icon, title, p, extra) => `<div class="scard">${icon}<h2>${title}</h2>${p ? `<p>${p}</p>` : ''}${extra || ''}</div>${legal()}`;
const ring = (s) => `<div class="ring"><svg viewBox="0 0 72 72"><circle class="bg" cx="36" cy="36" r="32"/><circle class="fg" cx="36" cy="36" r="32"/></svg><span class="t">${s}s</span></div>`;
const bigIcon = (n, bg, col) => `<span class="ic" style="background:${bg};color:${col}">${ic(n, 40, 2)}</span>`;
const tick = () => `<span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>`;
const trxRows = () => [[t('amount'), '250 ৳'], [t('method'), 'bKash · Send Money'], [t('trx'), '9F2KQ7X1']];

/* ---------- screens: [content, fixed button label, button colour, back target] ---------- */
const SC = {
  pick: () => [picker({ platform: CTX.platform }), null],
  bkash: () => [panel('bkash', 'personal'), t('verify'), W.bkash.col],
  'bkash-agent': () => [panel('bkash', 'agent'), t('verify'), W.bkash.col],
  'bkash-merchant': () => [panel('bkash', 'merchant'), t('verify'), W.bkash.col],
  nagad: () => [panel('nagad', 'personal', { no: '01812345678' }), t('verify'), W.nagad.col],
  rocket: () => [panel('rocket', 'personal', { no: '017123456789' }), t('verify'), W.rocket.col],
  upay: () => [panel('upay', 'personal'), t('verify'), W.upay.col],
  dup: () => [panel('bkash', 'personal', { dup: true }), t('verify'), W.bkash.col],
  copied: () => [panel('bkash', 'personal'), t('verify'), W.bkash.col],
  report: () => [panel('bkash', 'personal'), t('verify'), W.bkash.col],
  platform: () => [panel('bkash', 'personal', { no: '01700000000', amount: 449 }), t('verify'), W.bkash.col],
  checking: () => [scard(ring(12), t('checkingT'), t('checkingP'), det(trxRows())), t('wrongTrx'), 'var(--g500)'],
  'checking-late': () => [scard(bigIcon('clock', 'var(--sky-100)', 'var(--sky-900)'), t('lateT'), t('lateP'), det(trxRows())), t('backShop'), 'var(--blue)'],
  manual: () => [scard(bigIcon('user', 'var(--sky-100)', 'var(--sky-900)'), t('manualT'), t('manualP'), det(trxRows())), t('backShop'), 'var(--blue)'],
  verified: () => [scard(tick(), t('verifiedT'), t('verifiedP', { s: 5 }), det([...trxRows(), [t('time'), L('আজ সকাল 11:48', 'Today 11:48 am')]])), t('backShop'), '#15803d'],
  review: () => [scard(bigIcon('search', 'var(--y50)', '#a16207'), t('reviewT'), t('reviewP', { a: 240, b: 250 }), det(trxRows())), t('backShop'), 'var(--blue)'],
  rejected: () => [scard(bigIcon('x', '#fee2e2', '#b91c1c'), t('rejectedT'), t('rejectedReason', { r: L('এই TrxID-র টাকা আমাদের নম্বরে আসেনি', 'No money arrived on our number for this TrxID') }), det(trxRows())), t('retry'), W.bkash.col],
  expired: () => [scard(bigIcon('clock', 'var(--g100)', 'var(--g600)'), t('expiredT'), t('expiredP')), t('backShop'), 'var(--blue)'],
  paid: () => [scard(bigIcon('check', '#dcfce7', '#15803d'), t('paidT'), '', det([[t('amount'), '250 ৳'], [t('method'), 'bKash'], [t('time'), L('আজ সকাল 11:48', 'Today 11:48 am')]])), t('backShop'), 'var(--blue)'],
  cancelled: () => [scard(bigIcon('x', 'var(--g100)', 'var(--g600)'), t('cancelledT'), t('cancelledP')), t('backShop'), 'var(--blue)'],
  suspended: () => [scard(bigIcon('lock', 'var(--g100)', 'var(--g600)'), t('suspendedT'), ''), null],
};
const BACK = { pick: null };
function render() {
  LANG = ST.lang;
  const f = document.getElementById('frame');
  f.className = 'frame ' + ST.device; f.dataset.lang = ST.lang;
  const chrome = `<div class="statusbar"><span>9:41</span><span>●●● ᯤ ▮</span></div><div class="urlbar"><span class="dots"><i></i><i></i><i></i></span><span class="url">🔒 pay.lytro.app/8f2kq7x1a9z3</span></div>`;
  if (['bkash', 'nagad', 'rocket', 'upay'].includes(ST.screen)) ST.wallet = ST.screen;
  const [content, label, col] = SC[ST.screen]();
  const act = ACT[ST.screen] || 'payVerify()';
  const isPanel = !['pick', 'checking', 'checking-late', 'manual', 'verified', 'review', 'rejected', 'expired', 'paid', 'cancelled', 'suspended'].includes(ST.screen);
  const fixed = label ? `<div class="fixedbar"><button class="vbtn" style="background:${col}" onclick="${act}">${label}</button></div>` : '';
  const sheet = ST.screen === 'report' ? `<div class="scrim" onclick="go('bkash')"><div class="sheet" onclick="event.stopPropagation()"><div class="sh"><h2>${t('reportTitle')}</h2><button onclick="go('bkash')">${ic('x', 22)}</button></div><div class="sb">${[['r1', false], ['r2', false], ['r3', true], ['r4', false]].map(([k, on]) => `<div class="opt"><span class="radio ${on ? 'on' : ''}"></span>${t(k)}</div>`).join('')}<div class="inp">${t('rNote')}</div></div><div class="sf"><button class="btn">${t('sendReport')}</button></div></div></div>` : '';
  const toast = ST.screen === 'copied' ? `<div class="toast">${ic('check', 18)}${t('copiedNo', { n: SHOP.no })}</div>` : '';
  f.innerHTML = chrome + `<div class="pp"><div class="root"><div class="card">${topbar(isPanel ? 'pick' : null)}<div class="content ${label ? 'has-fixed' : ''}">${content}</div></div></div>${fixed}</div>${sheet}${toast}`;
  if (PAY_INIT && ST.screen === 'verified') { clearTimeout(ST.t2); ST.t2 = setTimeout(() => { if (ST.screen === 'verified') payReturn('verified'); }, 5000); }
}
function setLang(l) { ST.lang = l; document.querySelectorAll('#segLang button').forEach(b => b.classList.toggle('on', b.dataset.v === l)); render(); }
document.getElementById('selScreen').addEventListener('change', e => { ST.screen = e.target.value; render(); });
document.querySelectorAll('#segDevice button').forEach(b => b.addEventListener('click', () => { ST.device = b.dataset.v; document.querySelectorAll('#segDevice button').forEach(x => x.classList.toggle('on', x === b)); render(); }));
document.querySelectorAll('#segLang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.v)));
(function init() { if (PAY_INIT) { document.body.classList.add('embedded'); } else { const h = location.hash.replace('#', ''); if (h && SC[h]) { ST.screen = h; document.getElementById('selScreen').value = h; } } render(); })();
<\/script>

</script>

<script>
/* ---------- the wallets' marks, as the hosted page draws them (docs/brand/third-party) ---------- */
const LOGOS = {

let PAY_METHOD = 'bkash';

/* ---------- the hosted page (pay.lytro.app) opened in a frame for a manual method (SFT-07, LND-10, PAY-01) ---------- */

const payDoc = (ctx) => PAYDOC.replace('<head>', `<head><base href="${baseHref()}">`).replace('<body>', '<body class="embedded"><script>window.PAY_INIT=' + JSON.stringify(ctx) + '<\/script>');
/* where the page sends the shopper back to, by the status it reports (PAY-08) */
const PAYRET = { verified: 'confirm-paid', paid: 'confirm-paid', checking: 'confirm-checking', review: 'confirm-checking', cancelled: 'pay-cancelled', expired: 'pay-cancelled', default: 'confirm-checking' };
def('pay-hosted', { group: 'Paying (Phase 5)', label: 'The hosted page for the advance · Nagad (manual, PAY-05)', url: '🔒 pay.lytro.app/8f2kq7x1a9z3', render: () => `<div class="payhost"><iframe id="payframe" title="pay.lytro.app"></iframe></div>` });
const _render5 = render;
render = function () {
  _render5();
  const pf = document.getElementById('payframe');
  if (!pf) return;
  pf.srcdoc = payDoc({ platform: false, amount: 200, ref: 'ORD-20261021-0042', no: '01812345678', screen: PAY_METHOD === 'nagad' ? 'nagad' : 'bkash', lang: ST.lang });
};
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'pay-return') return;
  if (ST.screen !== 'pay-hosted') return;
  go(PAYRET[e.data.status] || PAYRET.default);
});

/* ---------- the wallet's own checkout for a gateway method (PAY-06): an interstitial, never a copy of bKash's page ---------- */
def('pay-gateway', { group: 'Paying (Phase 5)', label: 'To bKash\'s own checkout · gateway (PAY-06)', url: 'checkout.pay.bka.sh/…', render: () => `<div class="gw"><div class="box"><span class="mark">${LOGOS.bkash}</span><h1>${t('gw_title')}</h1><p>${t('gw_p', { n: 200 })}</p><div class="sum" style="width:100%"><div class="r"><span class="k">${shopName()}</span><span>ORD-20261021-0042</span></div><div class="r total"><span>${t('adv_now')}</span><span class="price">${money(200)}</span></div></div><button class="btn primary lg block" style="background:#CF2772">${t('gw_continue')} ${I.chev}</button><button class="btn quiet" onclick="go('pay-cancelled')">${t('gw_cancel')}</button><div class="line" style="justify-content:center">${I.lock}<span>${t('cf_gateway_note')}</span></div><div class="demo"><div class="sub">${t('gw_demo')}</div><div class="row"><button class="btn ghost sm" onclick="go('confirm-paid')">${I.check}${t('gw_ok')}</button><button class="btn ghost sm" onclick="go('pay-cancelled')">${I.x}${t('gw_fail')}</button></div></div></div></div>` });

/* ---------- a landing-page order with an advance: the method chooser sits in the form, the rest is the same path (LND-10) ---------- */
def('landing-advance', { group: 'Landing page', label: 'Landing page · product with a ৳200 advance: method chooser (LND-10)', url: 'megh.lytro.app/l/lawn-three-piece', render: () => { const p = P[2]; const q = 1; const total = p.price * q; return shell({ hdr: { minimal: true }, landing: true }, `<div class="pdp">${gallery(p)}<div class="buy"><div class="top"><div class="eyebrow">${shopName()}</div><h1 class="pt">${pName(p)}</h1><div class="pricerow"><span class="price">${money(p.price)}</span>${stChip('low')}</div></div><div class="opt"><div class="lb"><span>${t('size')}: <b>L</b></span></div><div class="vals">${['S', 'M', 'L', 'XL'].map((s) => `<span class="vb ${s === 'L' ? 'on' : ''}">${s}</span>`).join('')}</div></div><div class="opt"><div class="lb"><span>${t('qty')}</span></div>${qty(1)}</div><div class="line">${I.cash}<span><b>${t('pay_adv', { n: 200 })}</b> · ${t('pay_adv_hint', { n: 200 })}</span></div></div></div>
  <div class="two"><div class="ofrm" style="display:flex;flex-direction:column;gap:16px">${orderForm({ name: L('রুমানা আক্তার', 'Rumana Akter'), phone: '01711 223344', district: 'dhaka', thana: 'dhanmondi', address: L('বাসা ৫, রোড ৭, ধানমন্ডি', 'House 5, Road 7, Dhanmondi') })}<div class="card2"><h3>${t('co_payment')} · ${t('adv_now')} ${money(200)}</h3><label class="radio on" onclick="PAY_METHOD='bkash'"><span class="dot"></span><span class="b"><span class="l1">${LOGOS.bkash}<span>bKash</span></span><span class="l2">${t('pm_gateway_hint')}</span></span></label><label class="radio" onclick="PAY_METHOD='nagad'"><span class="dot"></span><span class="b"><span class="l1">${LOGOS.nagad}<span>Nagad</span></span><span class="l2">${t('pm_manual_hint')}</span></span></label><label class="radio"><span class="dot"></span><span class="b"><span class="l1">${LOGOS.rocket}</span><span class="l2">${t('pm_manual_hint')}</span></span></label></div></div>

/* ---------- the hero slot filled by the shop's slides: a carousel, or one banner with two tiles (sketch only) ---------- */
Object.assign(S, { sl1h: ['ঈদের নতুন কালেকশন', 'The Eid collection'], sl1s: ['পাঞ্জাবি, শাড়ি, থ্রি-পিস — ঢাকায় ৭০ টাকায় ডেলিভারি', 'Panjabi, sarees, three-piece. ৳70 delivery in Dhaka'], sl1b: ['নতুন যা এসেছে', 'New arrivals'], sl2h: ['শাড়িতে ১৫% ছাড়', '15% off sarees'], sl2s: ['শুক্রবার পর্যন্ত', 'Until Friday'], sl2b: ['শাড়ি দেখুন', 'See sarees'], sl3h: ['পহেলা বৈশাখ', 'Pohela Boishakh'], sl3s: ['লাল-সাদা কালেকশন', 'The red and white collection'], sl3b: ['দেখুন', 'Shop'] });
const SLIDES = [{ cls: 'a', h: 'sl1h', s: 'sl1s', b: 'sl1b' }, { cls: 'b', h: 'sl2h', s: 'sl2s', b: 'sl2b' }, { cls: 'c', h: 'sl3h', s: 'sl3s', b: 'sl3b' }];
const slide = (s, o) => { o = o || {}; return `<div class="slide ${s.cls} ${o.tile ? 'tile' : ''}" onclick="go('category')"><div class="txt"><div class="h">${t(s.h)}</div>${o.tile ? '' : `<div class="s">${t(s.s)}</div>`}<span class="cta">${t(s.b)} ${I.chev}</span></div></div>`; };

const tiles = () => `${slide(SLIDES[0])}<div class="tiles">${slide(SLIDES[1], { tile: true })}${slide(SLIDES[2], { tile: true })}</div>`;

/* ---------- toolbar ---------- */
(function init() {
  const sel = document.getElementById('selScreen'); const groups = {};

  document.querySelectorAll('#segLang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.v)));
  document.querySelectorAll('#segBrand button').forEach((b) => b.addEventListener('click', () => { ST.brand = b.dataset.v; document.querySelectorAll('#segBrand button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));
  render();
})();
</script>
