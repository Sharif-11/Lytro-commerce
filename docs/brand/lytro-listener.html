<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro Listener prototype</title>
<meta name="description" content="Clickable sketch of Lytro Listener, the Android app that forwards a shop's payment SMS: setup, the home screen, every status from LSN-24, the menu and Android's own notification. See docs/LISTENER-APP-DESIGN.md.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Exact brand values: tokens.css (dark roles) and BRAND-IDENTITY.md 8.5. */
:root{
  --teal-300:#7fdcd3;--teal-400:#3ec4b9;--teal-500:#17a89e;--teal-900:#063b38;
  --marigold-100:#fdf0d1;--marigold-300:#f8cf6e;--marigold-500:#f2a516;--ink:#10201f;
  --n-100:#eaf0ef;--n-200:#d5dfde;--n-300:#a9b9b8;--n-400:#7e8f8e;--n-500:#5b6e6d;--n-700:#2c3f3e;
  --danger:#c8323b;--success:#1b7a43;
  --bg:#0c1a19;--sunken:#091413;--surface:#132725;--raised:#1a3230;--line:#24403d;--line-strong:#335450;
  --text:var(--n-100);--muted:var(--n-200);--subtle:var(--n-300);
  --primary-soft:#0f3330;--warn-soft:#3a2f12;--danger-soft:#3a1a1d;
  --font:'Inter','Noto Sans Bengali',ui-sans-serif,system-ui,sans-serif;
  --font-bn:'Noto Sans Bengali','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#3b4443;color:var(--ink);font-family:var(--font);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* harness (not product UI) */
.tb{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d5dfde;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;font-size:13px;color:#2c3f3e}
.tb b{color:#10201f}
.tb label{display:flex;align-items:center;gap:6px}
.tb select{font:inherit;padding:4px 6px;border:1px solid #a9b9b8;border-radius:6px;background:#fff;max-width:230px}
.seg{display:inline-flex;border:1px solid #a9b9b8;border-radius:6px;overflow:hidden}
.seg button{padding:4px 9px;font-size:13px;color:#2c3f3e}
.seg button.on{background:#0e6b66;color:#fff}
.stage{display:flex;justify-content:center;padding:20px 16px 48px}
.sheet{display:grid;gap:28px 20px;grid-template-columns:repeat(auto-fill,minmax(var(--w),var(--w)));justify-content:center;width:100%;max-width:1500px}
.cap{font-size:12px;color:#eaf0ef;margin-bottom:6px;line-height:1.4;min-height:17px}
.cap a{color:inherit;text-decoration:none;font-weight:600}
.grp{grid-column:1/-1;color:#fff;font-size:15px;font-weight:600;border-bottom:1px solid #5b6e6d;padding-bottom:6px;margin-top:6px}

/* the phone */
.phone{width:var(--w);min-height:640px;background:var(--bg);color:var(--text);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:15px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.35)}
[lang=bn] .phone{font-family:var(--font-bn)}
.sb{height:26px;background:var(--teal-900);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:500 12px/1 var(--font);color:#fff;flex:none}
.sb span{display:flex;align-items:center;gap:4px}
.sb .ico{width:13px;height:13px}
.sb .mk{width:13px;height:13px}
.nv{height:22px;background:var(--teal-900);display:flex;align-items:center;justify-content:center;flex:none;margin-top:auto}
.nv i{width:96px;height:4px;border-radius:2px;background:rgba(255,255,255,.6)}
.ab{height:52px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;flex:none;background:var(--bg)}
.ab .tile{width:28px;height:28px;border-radius:7px;flex:none;display:block}
.ab h1{font:600 16px/1.2 var(--font);flex:1;min-width:0}
.ab .icb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.ab.bk{padding-left:4px}
.bd{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* type */
h2{font-size:21px;line-height:1.35;font-weight:700;color:#fff}
.p{color:var(--muted)}
.sm{font-size:13.5px;line-height:1.5;color:var(--muted)}
.num{font-family:var(--font);font-feature-settings:'tnum'}
.lat{font-family:var(--font)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;border-radius:10px;background:var(--teal-400);color:var(--ink);font-weight:700;font-size:15.5px;padding:8px 14px;text-align:center}
.btn[disabled]{background:var(--raised);color:var(--n-300);cursor:default}
.btn.sec{background:transparent;color:var(--teal-300);border:1px solid var(--line-strong);font-weight:600}
.btn.warn{background:var(--marigold-500);color:var(--ink)}
.btn.dan{background:transparent;color:#ffb4b8;border:1px solid #7c3036;font-weight:600}
.lnk{color:var(--teal-300);font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}

/* the status band: one status line, always at the top (BRAND-IDENTITY 8.5) */
.st{padding:12px 16px;display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.st .dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none}
.st b{font-size:18px;line-height:1.4;display:block;font-weight:700}
.st small{font-size:13.5px;color:var(--muted);display:block;line-height:1.45}
.st.ok{background:var(--primary-soft)}.st.ok .dot{background:var(--teal-400);box-shadow:0 0 0 4px rgba(62,196,185,.22)}.st.ok b{color:var(--teal-400)}
.st.warn{background:var(--warn-soft)}.st.warn .dot{background:var(--marigold-300)}.st.warn b{color:var(--marigold-300)}
.st.dan{background:var(--danger);border-color:var(--danger);color:#fff}.st.dan .dot{background:#fff}.st.dan b{color:#fff}.st.dan small{color:#fff}
.st.test{background:var(--marigold-300);border-color:var(--marigold-300);color:var(--ink)}.st.test .dot{background:var(--ink)}.st.test b{color:var(--ink)}.st.test small{color:var(--ink)}

/* cards and rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{font:700 22px/1.2 var(--font);display:block;color:#fff}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.lbl{font-size:13.5px;font-weight:600;color:var(--subtle)}
.rc{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:0 8px}
.rc .a{font-weight:600;color:#fff;font-size:15px}
.rc .a .num{font-weight:600}
.rc .t{font:400 12.5px/1.8 var(--font);color:var(--subtle)}
.rc .i{grid-column:1/-1;font:500 12.5px/1.5 var(--font);color:var(--subtle);letter-spacing:.02em}
.rc .r{grid-column:1/-1;display:flex;gap:6px;align-items:flex-start;font-size:13.5px;line-height:1.45;margin-top:2px}
.rc .r .ico{width:15px;height:15px;margin-top:3px}
.r.good{color:var(--teal-300)}.r.wait{color:var(--marigold-300)}.r.plain{color:var(--muted)}
.li{display:flex;gap:10px;align-items:flex-start}
.li .ico{margin-top:3px;color:var(--teal-400)}
.num-c{width:26px;height:26px;border-radius:50%;background:var(--raised);color:#fff;font:600 13px/26px var(--font);text-align:center;flex:none}
.stepper{display:flex;gap:5px;align-items:center;font:500 12.5px/1 var(--font);color:var(--subtle)}
.stepper i{height:4px;flex:1;border-radius:2px;background:var(--raised)}
.stepper i.on{background:var(--teal-400)}
.big{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--raised);color:var(--teal-300)}
.big .ico{width:28px;height:28px}
.big.warn{background:var(--warn-soft);color:var(--marigold-300)}
.big.dan{background:var(--danger-soft);color:#ffb4b8}
.big.good{background:var(--primary-soft);color:var(--teal-400)}
.note{border-radius:10px;padding:10px 12px;background:var(--raised);font-size:13.5px;line-height:1.5;color:var(--muted);display:flex;gap:8px}
.note .ico{width:17px;height:17px;margin-top:2px;flex:none}
.note.warn{background:var(--warn-soft);color:var(--marigold-100)}
.note.warn .ico{color:var(--marigold-300)}
.note.dan{background:var(--danger-soft);color:#ffd9db}
.note.dan .ico{color:#ffb4b8}
.acct{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acct b{font:700 18px/1.3 var(--font);color:#fff}

/* the pairing code: marigold-300 boxes with ink characters (BRAND-IDENTITY 8.5) */
.code{display:grid;grid-template-columns:repeat(4,1fr) 6px repeat(4,1fr);gap:5px}
.code span{height:46px;border-radius:7px;background:var(--marigold-300);color:var(--ink);font:700 20px/46px var(--font);text-align:center}
.code span.e{background:var(--surface);border:1px solid var(--line-strong);color:var(--n-400)}
.code span.c{border:2px solid var(--marigold-300);background:var(--surface)}
.code span.bad{background:#ffd9db;color:#7c1f25}
.code em{display:block}
.err{color:#ffb4b8;font-size:14px;line-height:1.5;display:flex;gap:6px}
.err .ico{width:17px;height:17px;margin-top:2px}
.cam{flex:1;min-height:300px;background:linear-gradient(160deg,#1c2a29,#0b1211);border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center}
.cam .fr{width:62%;aspect-ratio:1;position:relative}
.cam .fr i{position:absolute;width:30px;height:30px;border:4px solid var(--marigold-300)}
.cam .fr i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam .fr i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.cam .fr i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.cam .fr i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam svg{width:66%;height:66%;position:absolute;inset:17%;opacity:.35}
.ring{width:56px;height:56px;border-radius:50%;border:4px solid var(--raised);border-top-color:var(--teal-400);animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;font:600 13px/1 var(--font)}
.lang button{padding:9px 12px;min-height:36px;color:var(--muted)}
.lang button.on{background:var(--raised);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-height:48px}
.row:first-child{border-top:0}
.row .ico{color:var(--subtle)}
.row div{flex:1;min-width:0}
.row b{font-weight:600;color:#fff;display:block;font-size:14.5px;line-height:1.4}
.row small{font-size:13px;color:var(--muted);display:block;line-height:1.4}
.row .lat{font-family:var(--font)}

/* Android's own surfaces, light as the system draws them */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;padding:0 12px 34px;z-index:3}
.dlg{background:#f4f4f4;color:#1b1b1b;border-radius:22px;padding:20px 18px 12px;width:100%;font-family:'Inter',sans-serif;font-size:15px;line-height:1.4}
.dlg .ic{color:#0e6b66;display:flex;justify-content:center;margin-bottom:10px}
.dlg p{text-align:center;margin-bottom:14px}
.dlg button{display:block;width:100%;min-height:44px;border-radius:999px;background:#e4e4e4;margin-top:6px;font-weight:500;color:#0e4f4b}
.shade{background:#1f2424;flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.ntf{background:#2e3434;border-radius:16px;padding:12px;display:flex;gap:10px;color:#eaf0ef}
.ntf .nic{width:30px;height:30px;border-radius:50%;background:var(--teal-500);display:flex;align-items:center;justify-content:center;flex:none}
.ntf .nic.w{background:var(--marigold-500)}
.ntf .nic.d{background:var(--danger)}
.ntf .nic svg{width:18px;height:18px}
.ntf b{font:600 13px/1.5 var(--font);display:block}
.ntf span{font-size:13.5px;line-height:1.45;display:block}
.ntf small{font:400 11.5px/1.5 var(--font);color:var(--n-300);display:block}
.shade .q{font-size:12px;color:var(--n-300);margin-top:6px;font-family:var(--font)}

/* the dashboard reference, light as the dashboard is */
.ref{background:#f6f9f8;color:#10201f;flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.ref .tag{background:var(--marigold-100);color:#6a4303;font:600 11.5px/1.4 var(--font);padding:5px 8px;border-radius:6px}
.ref .c{background:#fff;border:1px solid #d5dfde;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ref h3{font-size:17px;line-height:1.35}
.ref p{font-size:14px;color:#2c3f3e;line-height:1.5}
.ref .qr{width:150px;height:150px;align-self:center;display:block}
.ref .cd{font:700 22px/1 var(--font);letter-spacing:.08em;text-align:center;color:#10201f}
.ref .tm{font:500 13px/1 var(--font);text-align:center;color:#2c3f3e}
.ref a{color:#0e6b66;font-weight:600;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="tb">
  <b>Lytro Listener</b>
  <label>Screen <select id="selScreen"></select></label>
  <label>Width <span class="seg" id="segDevice"><button data-v="320">Small 320</button><button data-v="360" class="on">Phone 360</button><button data-v="412">Large 412</button></span></label>
  <label>Language <span class="seg" id="segLang"><button data-v="bn" class="on">বাংলা</button><button data-v="en">EN</button></span></label>
  <label id="lblMaker" hidden>Phone maker <select id="selMaker"><option value="xiaomi">Xiaomi, Redmi, POCO</option><option value="oppo">Oppo, Realme</option><option value="vivo">Vivo, iQOO</option><option value="samsung">Samsung</option><option value="other">Any other</option></select></label>
</div>
<div class="stage"><div class="sheet" id="sheet"></div></div>

<script>
const ST = { screen: 'all', width: 360, lang: 'bn', maker: 'xiaomi' };

// [Bangla, English]. Digits stay Western in both (the glossary's rule).
const D = {
  appName: ['Lytro Listener', 'Lytro Listener'],
  stOn: ['চালু আছে', 'Working'],
  stOnS: ['পেমেন্ট SMS মিলছে · শেষ রিপোর্ট 2 মিনিট আগে', 'Matching payment SMS · last report 2 minutes ago'],
  stOff: ['পেয়ার করা নেই', 'Not paired'],
  stOffS: ['একটা কোড দিয়ে ফোনটি শপের সাথে যুক্ত করুন', 'Link this phone to your shop with a code'],
  stNet: ['ইন্টারনেট নেই', 'No internet'],
  stNetS: ['3টি রিসিট ফোনে জমা আছে। নেট এলেই নিজে থেকে যাবে।', '3 receipts are saved on the phone and go by themselves when you’re back online.'],
  stPerm: ['SMS পড়ার অনুমতি বন্ধ', 'SMS permission is off'],
  stPermS: ['এখন কোনো পেমেন্ট নিজে থেকে ভেরিফাই হবে না', 'Nothing verifies by itself until this is fixed'],
  stBat: ['চালু আছে, তবে ঝুঁকি আছে', 'Working, but at risk'],
  stBatS: ['ব্যাটারি সেভার অ্যাপটি বন্ধ করে দিতে পারে', 'The battery saver may stop this app'],
  stAcct: ['চালু আছে, তবে bKash নম্বর নেই', 'Working, but no bKash number'],
  stAcctS: ['শপে কোনো bKash অ্যাকাউন্ট অ্যাক্টিভ নেই', 'Your shop has no active bKash account'],
  stInact: ['সাবস্ক্রিপশন ইনঅ্যাক্টিভ', 'Subscription inactive'],
  stRev: ['ফোনটি ক্যানসেল করা হয়েছে', 'This phone was revoked'],
  stBlock: ['এই ইনস্টলেশন ব্লক করা আছে', 'This installation is blocked'],
  stUpd: ['আপডেট দরকার', 'Update required'],
  stTest: ['টেস্ট মোড · 8:42 বাকি', 'Test mode · 8:42 left'],
  stTestS: ['অচেনা সেন্ডারের রিসিটও এখানে দেখাবে, তবে তাতে কিছু ভেরিফাই হবে না', 'Receipts from unknown senders show here too, but they verify nothing'],

  todayV: ['ভেরিফাই', 'Verified'], todayW: ['অপেক্ষায়', 'Waiting'], todayS: ['স্টাফ চেক করবে', 'Staff to check'],
  recent: ['সাম্প্রতিক রিসিট', 'Recent receipts'], today: ['আজ', 'Today'],
  rMatched: ['অর্ডার #261102-0042 ভেরিফাই হয়েছে', 'Order #261102-0042 verified'],
  rMatched2: ['অর্ডার #261102-0039 ভেরিফাই হয়েছে', 'Order #261102-0039 verified'],
  rWait: ['এখনও মেলেনি। কাস্টমার TrxID দিলে মিলে যাবে।', 'Not matched yet. It matches when the customer types the TrxID.'],
  rAmount: ['টাকার পরিমাণ মেলেনি। স্টাফ চেক করবে।', 'The amount didn’t match. Staff will check.'],
  rBalance: ['ব্যালেন্স কম, তাই স্টাফ হাতে ভেরিফাই করবে', 'Balance too low, so staff will verify by hand'],
  rQueued: ['ফোনে জমা আছে', 'Saved on the phone'],
  rReached: ['রিসিট Lytro-তে পৌঁছেছে', 'The receipt reached Lytro'],
  rTest: ['পড়া গেছে। এই সেন্ডার তালিকায় নেই, তাই ভেরিফাই হবে না।', 'Read fine. This sender isn’t on the list, so it verifies nothing.'],
  rDup: ['আগেই পাঠানো হয়েছে', 'Already sent'],
  emptyT: ['এখনও কোনো রিসিট আসেনি', 'No receipts yet'],
  emptyP: ['এই নম্বরে bKash-এ টাকা এলে রিসিট এখানে দেখা যাবে।', 'When money reaches this bKash number, the receipt shows here.'],
  onlyB: ['এখন শুধু bKash-এর SMS পড়া হয়', 'Only bKash SMS are read for now'],

  welT: ['bKash-এ টাকা এলে অর্ডার নিজে থেকে ভেরিফাই হবে', 'When money reaches bKash, orders verify by themselves'],
  wel1: ['কাস্টমার আপনার bKash নম্বরে টাকা পাঠান', 'A customer sends money to your bKash number'],
  wel2: ['এই ফোনে bKash-এর SMS আসে', 'bKash’s SMS reaches this phone'],
  wel3: ['Lytro রিসিট মিলিয়ে অর্ডার ভেরিফাই করে', 'Lytro matches the receipt and verifies the order'],

// A stand-in QR: its pattern is fixed, not a real code.
function qrSvg(fg) {
  const cells = 25; let r = '';
  const finder = (x, y) => (x >= 0 && x < 7 && y >= 0 && y < 7) && (x === 0 || x === 6 || y === 0 || y === 6 || (x > 1 && x < 5 && y > 1 && y < 5));
  const inFinder = (x, y) => (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
  for (let y = 0; y < cells; y += 1) for (let x = 0; x < cells; x += 1) {
    const on = inFinder(x, y) ? finder(x > 16 ? x - 18 : x, y > 16 ? y - 18 : y) : ((x * 7 + y * 13 + (x * y) % 5) % 3 === 0);
    if (on) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<svg viewBox="0 0 25 25" fill="${fg}" aria-hidden="true">${r}</svg>`;
}

    <div class="card" style="padding-top:2px;padding-bottom:2px"><button class="row" data-go="home-test" style="width:100%;text-align:left">${ic('flask')}<div><b>${t('testMode')}</b><small>${t('testModeV')}</small></div></button><button class="row" style="width:100%;text-align:left">${ic('help')}<div><b>${t('help')}</b><small>${t('helpV')}</small></div></button></div>
    <div class="foot"><button class="btn dan" data-go="unpair">${ic('unlink')}${t('unpair')}</button></div></div>`, { back: 'home-on', title: t('menu'), notif: true }),
  unpair: () => frame(`<div class="bd"><div class="card" style="height:220px;opacity:.5"></div></div><div class="scrim" style="align-items:center;padding:0 16px"><div class="card" style="background:var(--raised);padding:18px;display:flex;flex-direction:column;gap:10px"><h2 style="font-size:18px">${t('unT')}</h2><p class="p">${t('unP')}</p><button class="btn dan" data-go="pair-scan">${t('unBtn')}</button><button class="btn sec" data-go="menu">${t('cancel')}</button></div></div>`, { back: 'menu', title: t('menu'), notif: true }),

  android: () => `<div class="phone"><div class="sb"><span>2:43 ${MARK}</span><span>${ic('battery')}</span></div><div class="shade">
    <div class="q">${t('nOngoing')}</div>
    <div class="ntf"><span class="nic">${MARK}</span><div><b>Lytro Listener</b><span>${t('nOn')}</span></div></div>
    <div class="ntf"><span class="nic w">${MARK}</span><div><b>Lytro Listener</b><span>${t('nNet')}</span></div></div>
    <div class="q">${t('nAlert')}</div>
    <div class="ntf"><span class="nic d">${MARK}</span><div><b>Lytro Listener</b><span>${t('nPerm')}</span></div></div>
    <div class="ntf"><span class="nic d">${MARK}</span><div><b>Lytro Listener</b><span>${t('nInact')}</span></div></div>
    <div class="ntf"><span class="nic w">${MARK}</span><div><b>Lytro Listener</b><span>${t('nUpd')}</span></div></div>
    </div><div class="nv"><i></i></div></div>`,
};

const GROUPS = [
  ['Before the app', [['ref-dash', 'Dashboard: the pairing card (reference)'], ['install', 'Installing the APK']]],
  ['First setup', [['welcome', 'Welcome'], ['pair-scan', 'Pair: scan the QR'], ['pair-type', 'Pair: type the code'], ['pair-full', 'Pair: code complete'], ['paired', 'Paired: the right phone?'], ['paired-many', 'Paired: several bKash numbers'], ['paired-none', 'Paired: no bKash number'], ['perm-sms', 'Step 1: SMS permission'], ['perm-sms-sys', 'Step 1: Android’s own dialog'], ['perm-notif', 'Step 2: notifications'], ['battery', 'Step 3: battery saver'], ['test-wait', 'Test: waiting for an SMS'], ['test-got', 'Test: it arrived']]],
  ['When pairing is refused', [['pair-wrong', 'Wrong or lapsed code'], ['pair-tries', 'Too many tries'], ['pair-net', 'No internet'], ['pair-limit', 'Device limit reached (LSN-24)'], ['pair-nocam', 'Camera refused'], ['perm-sms-no', 'SMS permission refused'], ['perm-sms-blocked', 'SMS blocked by Android (15 and later, browser install)']]],
  ['Home', [['home-on', 'Working, with receipts'], ['home-empty', 'Working, nothing yet'], ['home-offline', 'No internet, receipts saved'], ['home-test', 'Test mode (LSN-04)']]],
  ['Home with a problem', [['home-perm', 'SMS permission lost'], ['home-battery', 'Battery saver risk'], ['home-acct', 'No active bKash account']]],
  ['Stopped (LSN-24)', [['inactive', 'Subscription inactive'], ['revoked-owner', 'Revoked by the owner'], ['revoked-flags', 'Revoked after flags'], ['blocked', 'Installation blocked'], ['update', 'Update required']]],
  ['Menu', [['menu', 'Menu'], ['unpair', 'Unpair: confirm']]],
  ['Android itself', [['android', 'Notifications']]],
];

function render() {
  document.documentElement.lang = ST.lang;
  document.documentElement.style.setProperty('--w', ST.width + 'px');
  const sheet = document.getElementById('sheet');
  const cap = (id, label) => `<div class="cap"><a href="#" data-go="${id}">${label}</a></div>`;
  if (ST.screen === 'all') {
    sheet.innerHTML = GROUPS.map(([g, list]) => `<div class="grp">${g}</div>` + list.map(([id, label]) => `<div>${cap(id, label)}${S[id]()}</div>`).join('')).join('');
  } else {
    const label = GROUPS.flatMap(([, list]) => list).find(([id]) => id === ST.screen)[1];
    sheet.innerHTML = `<div>${cap(ST.screen, label)}${S[ST.screen]()}</div>`;
  }
  document.getElementById('lblMaker').hidden = !(ST.screen === 'battery' || ST.screen === 'all');
  document.getElementById('selScreen').value = ST.screen;
  document.querySelectorAll('#segLang button').forEach((b) => b.classList.toggle('on', b.dataset.v === ST.lang));
}

const sel = document.getElementById('selScreen');
sel.innerHTML = `<option value="all">All screens</option>` + GROUPS.map(([g, list]) => `<optgroup label="${g}">${list.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</optgroup>`).join('');
sel.addEventListener('change', () => { ST.screen = sel.value; render(); window.scrollTo(0, 0); });
document.getElementById('selMaker').addEventListener('change', (e) => { ST.maker = e.target.value; render(); });
document.querySelectorAll('#segDevice button').forEach((b) => b.addEventListener('click', () => { ST.width = Number(b.dataset.v); document.querySelectorAll('#segDevice button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));
document.querySelectorAll('#segLang button').forEach((b) => b.addEventListener('click', () => { ST.lang = b.dataset.v; render(); }));
document.addEventListener('click', (e) => {
  const lang = e.target.closest('[data-lang]');
  if (lang) { ST.lang = lang.dataset.lang; render(); return; }
  const go = e.target.closest('[data-go]');
  if (go && S[go.dataset.go]) { e.preventDefault(); ST.screen = go.dataset.go; render(); window.scrollTo(0, 0); }
});
render();
</script>
</body>
</html>
