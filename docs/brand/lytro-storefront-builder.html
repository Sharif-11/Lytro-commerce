<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytro storefront builder (sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Galada&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Anek+Bangla:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&family=Noto+Serif+Bengali:wght@500;600;700&family=Fraunces:ital,wght@0,600;0,700;1,600&family=Tiro+Bangla:ital@0;1&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<!--
  Storefront builder (sketch, 2026-11-18). The owner's answers: themes + sections (no free drag-and-drop, no custom
  code), every plan (own colours beyond a theme stay the brand identity add-on), design now and build after Phase 9,
  no new features in the first version. Mobile first: the phone is the design, wider screens only add columns.
  Every section fills itself from the shop's own data until the seller writes their own (Bonik AI's lesson): the
  offers line, delivery fees, sale/new/best-seller badges, "only N left", hero slides from discounted products.
  Photos: sample-photos/builder (Pexels licence, CREDITS.txt).
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9ecef;font-family:'Inter','Noto Sans Bengali',sans-serif;color:#1f2933}
button{font:inherit;cursor:pointer}
img{display:block}
.shop .wide{display:none}

/* ---------- Harness (Lytro's chrome, not the shop's) ---------- */
.tb{position:sticky;top:0;z-index:50;background:#0e6b66;color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tb .ttl{font-weight:700;font-size:14px;margin-right:6px}
.tb .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb .grp>span{opacity:.85;margin-right:4px}
.tb button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12.5px}
.tb button.on{background:#f2a516;color:#1b1300;border-color:#f2a516;font-weight:700}
.stage{padding:24px 16px 80px;display:flex;justify-content:center;overflow-x:auto}
.frame{background:#fff;box-shadow:0 10px 40px rgba(15,23,42,.18);border-radius:28px;overflow:hidden;flex:none}
.frame.phone{width:390px;border:10px solid #111;border-radius:42px}
.frame.desktop{width:1280px;border-radius:10px}
.note{max-width:1280px;margin:0 auto 14px;padding:0 16px;font-size:13px;color:#334155}
.note b{color:#0e6b66}
.shot .tb,.shot .note{display:none}.shot .stage{padding:0}.shot body{background:#fff}

/* ---------- The shop (mobile first; @container adds room) ---------- */
.shop{container-type:inline-size;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;position:relative;overflow:hidden}
.shop h1,.shop h2,.shop h3{font-family:var(--fh);margin:0;line-height:1.2}
.shop a{color:inherit;text-decoration:none}
.wrap{padding:0 16px;margin:0 auto;max-width:1240px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec{padding:22px 0 6px}

/* section names, when shown */
.shop.outlined [data-sec]{outline:2px dashed #7c3aed;outline-offset:-2px;position:relative}
.shop.outlined [data-sec]::before{content:attr(data-sec);position:absolute;z-index:9;top:4px;left:4px;background:#7c3aed;color:#fff;font:600 11px/1.5 'Inter','Noto Sans Bengali',sans-serif;padding:1px 7px;border-radius:5px;pointer-events:none}

/* announcement */
.ann{background:var(--ann-bg);color:var(--ann-fg);font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px}
.ann .pill{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 8px;margin-right:6px;font-size:11.5px}

/* header: phone = menu, logo, search, cart; wide = logo, search bar, links */
.hd{background:var(--hd-bg);color:var(--hd-fg);border-bottom:1px solid var(--line)}
.hd .row{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--fh);font-weight:700;font-size:19px;color:var(--logo);white-space:nowrap}
.logo .mk{width:36px;height:36px;border-radius:var(--r-mark);background:var(--main);color:var(--on-main);display:grid;place-items:center;font-size:17px;font-family:var(--fh)}
.logo small{display:block;font-family:var(--fb);font-size:10.5px;font-weight:500;color:var(--muted);margin-top:-3px}
.logo.img svg{height:36px;width:auto;display:block}
.hd .icons{display:flex;gap:14px;margin-left:auto;align-items:center}
.cart{position:relative;display:flex}
.cart sup{position:absolute;top:-7px;right:-9px;background:var(--accent);color:var(--on-accent);font:700 10.5px/17px Inter;min-width:17px;height:17px;border-radius:9px;text-align:center}
.search{display:none}
.nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.nav a{flex:none;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--chip-bg);color:var(--chip-fg)}
.nav a.on{background:var(--main);color:var(--on-main)}
.hd.centred .row{justify-content:space-between}
.hd.centred .logo{position:absolute;left:50%;transform:translateX(-50%)}
.hd .menu{display:flex}

/* hero */
.hero{position:relative}
.hero .slide{position:relative}
.hero .dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.hero .dots i{width:7px;height:7px;border-radius:99px;background:var(--line-strong)}
.hero .dots i.on{width:20px;background:var(--main)}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kick)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r-btn);padding:12px 20px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-fg);font-family:var(--fb)}
.btn.ghost{background:transparent;color:var(--btn-bg);box-shadow:inset 0 0 0 1.5px var(--btn-bg)}
.btn.light{background:#fff;color:#111}
/* split: photo above text on a phone */
.hero.split .slide{background:var(--hero-bg);display:flex;flex-direction:column}
.hero.split .ph{aspect-ratio:4/3;overflow:hidden}
.hero.split .ph img{width:100%;height:100%;object-fit:cover}
.hero.split .tx{padding:18px 16px 20px}
.hero.split h1{font-size:30px;color:var(--hero-h)}
.hero.split h1 em{font-style:normal;color:var(--hero-em)}
.hero.split p{margin:8px 0 16px;color:var(--muted);font-size:14.5px}
/* overlay: the photo fills the slide and the words sit on it */
.hero.overlay .slide{height:470px;overflow:hidden}
.hero.overlay .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.overlay .shade{position:absolute;inset:0;background:var(--hero-shade)}
.hero.overlay .tx{position:absolute;left:0;right:0;bottom:0;padding:22px 18px 26px;color:#fff}
.hero.overlay h1{font-size:32px;color:var(--hero-h)}
.hero.overlay .kick{color:var(--hero-kick,var(--kick))}
.hero .tx .btn{align-self:flex-start}
.hero.overlay p{margin:8px 0 16px;font-size:14.5px;opacity:.92}
.hero .badge{display:inline-block;background:var(--sale);color:#fff;font:700 12px/1 var(--fb);padding:5px 8px;border-radius:6px;margin-bottom:10px}
.hero .price{font-size:18px;font-weight:700;margin:2px 0 14px}
.hero .price s{font-weight:500;opacity:.75;font-size:14px;margin-left:6px}
/* auto: one sale product per slide, with the two offer tiles below (Bonik's pattern) */
.hero.auto .slide{height:400px;overflow:hidden;border-radius:var(--r-card);margin:12px 16px 0}
.hero.auto .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0}
.hero .tile{position:relative;height:130px;border-radius:var(--r-card);overflow:hidden;color:#fff}
.hero .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .tile .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.hero .tile .tx{position:absolute;left:10px;right:10px;bottom:9px;font-size:12px;line-height:1.3}
.hero .tile b{display:block;font-size:14px;font-family:var(--fh)}

/* section heads */
.sh{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sh h2{font-size:21px;color:var(--sec-h)}
.sh .all{margin-left:auto;font-size:13px;font-weight:700;color:var(--link);white-space:nowrap}
.sh.centre{justify-content:center;text-align:center}
.sh.centre .line{flex:1;height:1px;background:var(--orn)}
.sh.centre .all{display:none}
.sh .orn{color:var(--orn);font-size:12px}
.sh .leaf{width:20px;height:20px;color:var(--main)}
.sh .kick{display:block;margin-bottom:2px}
.sh.rule{border-bottom:1px solid var(--line-strong);padding-bottom:8px}
.sh.rule h2{font-style:italic}

/* categories: phone = a swipeable row */
.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cat{flex:none;text-align:center;font-size:13px;font-weight:600;color:var(--text)}
.cats.circle .cat{width:84px}
.cats.circle .cat .im{width:80px;height:80px;border-radius:50%;overflow:hidden;margin:0 auto 6px;box-shadow:0 0 0 3px var(--ring)}
.cats.circle .cat em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.cats.square .cat{width:104px;background:var(--tile-bg);border-radius:var(--r-card);padding:8px 8px 10px}
.cats.square .cat .im{aspect-ratio:1;border-radius:calc(var(--r-card) - 4px);overflow:hidden;margin-bottom:7px}
.cats.tall .cat{width:128px;border-radius:var(--r-card);overflow:hidden;position:relative}
.cats.tall .cat .im{aspect-ratio:3/4}
.cats.tall .cat span{position:absolute;left:6px;right:6px;bottom:6px;background:var(--main);color:var(--on-main);border-radius:var(--r-btn);padding:5px 6px;font-size:12.5px}
.cats.pill .cat{display:flex;align-items:center;gap:8px;background:var(--tile-bg);border-radius:99px;padding:5px 14px 5px 5px}
.cats.pill .cat .im{width:40px;height:40px;border-radius:50%;overflow:hidden}
.cat .im img{width:100%;height:100%;object-fit:cover}

/* product cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin-right:-16px;padding-right:16px}
.rail .card{width:160px;flex:none}
.card{background:var(--card-bg);border-radius:var(--r-card);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--card-shadow);border:var(--card-border)}
.card .im{position:relative;aspect-ratio:1;background:var(--img-bg)}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .nm{font-size:13.5px;font-weight:600;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card .pr{font-weight:700;font-size:15px;color:var(--price)}
.card .pr s{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:5px}
.card .left{font-size:11.5px;font-weight:700;color:var(--sale)}
.card .sold{font-size:11.5px;color:var(--muted)}
.card .add{margin-top:6px;border:0;border-radius:var(--r-btn);background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:13px;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--fb)}
.card .add .ico{width:16px;height:16px}
.tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag{font:700 11px/1 var(--fb);padding:4px 7px;border-radius:6px;color:#fff}
.tag.sale{background:var(--sale)}.tag.new{background:var(--new)}.tag.best{background:var(--best)}
.card.framed{text-align:center}
.card.framed .im{margin:8px 8px 0;border-radius:calc(var(--r-card) - 2px);overflow:hidden}
.card.photo .im{aspect-ratio:3/4}
.card.photo .add{display:none}
.card .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#222}
.card .fav .ico{width:16px;height:16px}

/* offer banners: stacked on a phone */
.banners{display:grid;gap:12px}
.shop .ban{position:relative;display:block;height:168px;border-radius:var(--r-card);overflow:hidden;color:#fff}
.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ban .shade{position:absolute;inset:0}
.ban .tx{position:relative;padding:18px;max-width:72%}
.ban .k{font-size:12.5px;font-weight:600;opacity:.95}
.ban b{display:block;font-family:var(--fh);font-size:30px;line-height:1.1;margin:2px 0}
.ban .s{font-size:13px;opacity:.95;margin-bottom:10px}
.ban .btn{padding:8px 14px;font-size:13px}

/* trust strip */
.trust{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trust .it{display:flex;gap:10px;align-items:center;background:var(--trust-bg);border-radius:var(--r-card);padding:11px 12px;font-size:12px;color:var(--muted);line-height:1.35;border:var(--trust-border)}
.trust .it b{display:block;color:var(--text);font-size:13px}
.trust .it .ico{color:var(--main);width:26px;height:26px}

/* testimonials */
.quotes{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.q{flex:none;width:280px;background:var(--q-bg,var(--card-bg));border-radius:var(--r-card);padding:16px;border:var(--card-border);box-shadow:var(--card-shadow);font-size:13.5px}
.q p{margin:0 0 12px}
.q .who{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.q .who b{display:block;color:var(--text);font-size:13px}
.q .av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--main);display:grid;place-items:center;font-weight:700;font-family:var(--fh)}

/* footer */
.ft{background:var(--ft-bg);color:var(--ft-fg);margin-top:26px;padding:26px 0 14px;font-size:13px}
.ft .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ft .about{grid-column:1/-1}
.ft .logo{color:var(--ft-logo)}
.ft .logo .mk{background:var(--accent);color:var(--on-accent)}
.ft .logo small{color:inherit;opacity:.75}
.ft h3{font-family:var(--fb);font-size:14px;margin:0 0 8px;color:var(--ft-h)}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;opacity:.9}
.ft .soc{display:flex;gap:10px;margin-top:12px}
.ft .soc span{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.ft .base{border-top:1px solid rgba(255,255,255,.14);margin-top:20px;padding-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:12px;opacity:.9}
.pbl{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0e6b66;border-radius:99px;padding:3px 10px 3px 4px;font:600 11.5px/1.4 Inter,sans-serif}
.pbl i{width:16px;height:16px;border-radius:50%;background:#0e6b66;display:inline-grid;place-items:center}
.pbl i svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.chatbtn{position:absolute;right:14px;top:640px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:5}
.chatbtn .ico{width:26px;height:26px}

/* ---------- Wider screens: same sections, more room ---------- */
@container (min-width:900px){
  .shop .wide{display:block}.shop .narrow{display:none}
  .wrap{padding:0 32px}
  .sec{padding:34px 0 8px}
  .hd .row{height:74px;gap:24px}
  .hd .menu{display:none}
  .logo{font-size:23px}.logo .mk{width:44px;height:44px;font-size:21px}
  .logo.img svg{height:44px}
  .search{display:flex;flex:1;max-width:520px;height:44px;border:1.5px solid var(--line-strong);border-radius:var(--r-btn);overflow:hidden;background:#fff}
  .search span{flex:1;display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:14px}
  .search i{width:54px;background:var(--main);color:var(--on-main);display:grid;place-items:center}
  .hd .srch{display:none}
  .nav{padding:0 32px 12px;gap:10px;justify-content:center;max-width:1240px;margin:0 auto}
  .hd.centred .logo{position:static;transform:none;margin:0}
  .hd.centred .row{justify-content:flex-start}
  .hero.split .slide{flex-direction:row-reverse;align-items:stretch;min-height:440px}
  .hero.split .ph{flex:1.1;aspect-ratio:auto}
  .hero.split .tx{flex:1;padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
  .hero.split h1{font-size:50px}
  .hero.split p{font-size:17px;max-width:440px}
  .hero.overlay .slide{height:540px}
  .hero.overlay .tx{top:0;bottom:0;max-width:640px;padding:0 64px;display:flex;flex-direction:column;justify-content:center}
  .hero.overlay .shade{background:var(--hero-shade-wide,var(--hero-shade))}
  .hero.overlay h1{font-size:56px}
  .hero.overlay p{font-size:17px}
  .hero.auto{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:16px 32px 0;max-width:1240px;margin:0 auto}
  .hero.auto .slide{height:420px;margin:0}
  .hero.auto .tiles{grid-template-columns:1fr;margin:0;gap:14px}
  .hero.auto .tile{height:203px}
  .hero.auto .dots{grid-column:1}
  .sh h2{font-size:28px}
  .cats{overflow:visible;flex-wrap:wrap;justify-content:center;gap:18px}
  .cats.circle .cat{width:130px}.cats.circle .cat .im{width:124px;height:124px}
  .cats.square .cat{width:168px}
  .cats.tall .cat{width:180px}
  .grid{grid-template-columns:repeat(4,1fr);gap:20px}
  .rail{margin-right:0;padding-right:0;gap:18px}
  .rail .card{width:calc((100% - 72px) / 5)}
  .card .nm{font-size:14.5px}
  .banners{grid-template-columns:1fr 1fr;gap:18px}
  .ban{height:230px}
  .ban b{font-size:40px}
  .ban .tx{padding:28px}
  .trust{grid-template-columns:repeat(4,1fr);gap:14px}
  .trust .it{padding:16px;font-size:13px}
  .quotes{overflow:visible;margin-right:0;padding-right:0}
  .q{flex:1}
  .ft .cols{grid-template-columns:1.5fr 1fr 1fr 1.2fr}
  .ft .about{grid-column:auto}
  .chatbtn{top:auto;bottom:24px;position:absolute}
}

/* ---------- The dashboard's editor (Lytro's chrome: Settings > Storefront > Design) ---------- */
.dash{font-family:'Inter','Noto Sans Bengali',sans-serif;background:#f3f6f6;color:#1d2a2a;min-height:844px;position:relative;font-size:15px;line-height:1.45}
.dash *{box-sizing:border-box}
.dash .top{background:#fff;border-bottom:1px solid #e1e8e8;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;position:relative;z-index:3}
.dash .top h1{font-size:17px;margin:0;font-weight:700;flex:1;font-family:inherit}
.dash .top .back{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#1d2a2a}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.draft{background:#fff1d6;color:#704400}.chip.live{background:#dff2ec;color:#0b5c4d}.chip.auto{background:#e6eefb;color:#1e3f8a}.chip.add{background:#f6e7f0;color:#7c1d4e}
.dash .body{padding:12px 12px 120px;display:flex;flex-direction:column;gap:12px}
.dcard{background:#fff;border-radius:16px;border:1px solid #e1e8e8;padding:14px}
.dcard h2{font-size:15.5px;margin:0;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:8px}
.dcard .sub{font-size:13px;color:#33403f;margin:3px 0 12px}
.dbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14.5px;border:0;background:#0e6b66;color:#fff;font-family:inherit;white-space:nowrap}
.dbtn.out{background:#fff;color:#0e6b66;box-shadow:inset 0 0 0 1.5px #0e6b66}
.dbtn.quiet{background:#eef3f3;color:#1d2a2a}
.dbtn.sm{height:36px;padding:0 12px;font-size:13.5px}
.dbtn .ico{width:18px;height:18px}
.dash .ico{stroke-width:1.9}
.row2{display:flex;gap:10px;align-items:center}
.srow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #eef2f2;min-height:60px}
.srow:first-of-type{border-top:0}
.srow .grip{color:#7d8d8c;display:flex;flex-direction:column;gap:2px}
.srow .grip .ico{width:16px;height:16px}
.srow .si{width:38px;height:38px;border-radius:10px;background:#e3f1ef;color:#0e6b66;display:grid;place-items:center;flex:none}
.srow .si .ico{width:20px;height:20px}
.srow .nm{flex:1;min-width:0}.srow .nm b{display:block;font-size:14.5px}.srow .nm span{font-size:12.5px;color:#33403f;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.off .nm,.srow.off .si{opacity:.45}
.srow.fixed .grip{visibility:hidden}
.srow.sel{background:#fff8e6;border-radius:12px;box-shadow:inset 0 0 0 2px #f2a516}
.switch{width:42px;height:26px;border-radius:99px;background:#0e6b66;position:relative;flex:none}.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.off{background:#c3cdcd}.switch.off::after{right:auto;left:3px}
.chev{color:#7d8d8c}
.dock{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e1e8e8;padding:10px 12px 16px;display:flex;gap:10px;z-index:4}
.dock .dbtn{flex:1}
.mini{width:100%;overflow:hidden;border-radius:12px;border:1px solid #e1e8e8;position:relative;background:#fff}
.mini .scale{transform-origin:0 0;position:absolute;top:0;left:0}
.mini .scale .chatbtn{display:none}
.tcard{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
.tcard .mini{height:178px}
.pal{display:flex;gap:6px;margin:8px 0}
.pal i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.pal i.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #0e6b66}
.scrim{position:absolute;inset:0;background:rgba(12,24,24,.45);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:90%;overflow:auto;z-index:6}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#cfd9d9;margin:8px auto 4px}
.sheet .shd{display:flex;align-items:center;gap:8px;padding:4px 16px 8px}
.sheet .shd h2{flex:1;font-size:17px;margin:0;font-family:inherit}
.sheet .sbody{padding:4px 16px 8px}
.sheet .dock{position:sticky;bottom:0;margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:13.5px;font-weight:600}
.field .in{min-height:46px;border:1.5px solid #c9d4d4;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:15px;background:#fff}
.field .in .caret{margin-left:auto;color:#5d6d6c}
.field .hint{font-size:12.5px;color:#33403f}
.seg{display:flex;background:#eaf0f0;border-radius:12px;padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:#33403f}
.seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);color:#0e6b66}
.drop{border:2px dashed #b4c4c3;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;font-size:13px;color:#33403f;background:#fafcfc}
.drop b{display:block;color:#1d2a2a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop>span{min-width:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid #d3dddd;border-radius:12px;padding:8px;text-align:center;font-size:12px;font-weight:600;color:#33403f}
.opt.on{border-color:#0e6b66;box-shadow:inset 0 0 0 1px #0e6b66;color:#0e6b66;background:#f1f9f8}
.opt .dg{height:54px;border-radius:7px;background:#eef3f3;margin-bottom:6px;position:relative;overflow:hidden}
.dg i{position:absolute;background:#b9cac9;border-radius:3px}
.dg i.p{background:#e2b8cb}
.radio{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-top:1px solid #eef2f2}
.radio:first-child{border-top:0}
.radio .dot{width:22px;height:22px;border-radius:50%;border:2px solid #9fb0af;flex:none;margin-top:1px}
.radio.on .dot{border:7px solid #0e6b66}
.radio b{display:block;font-size:14.5px}.radio span{font-size:12.5px;color:#33403f}
.kind{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid #eef2f2}
.kind:first-child{border-top:0}
.kind .si{width:42px;height:42px;border-radius:12px;background:#e3f1ef;color:#0e6b66;display:grid;place-items:center;flex:none}
.kind b{display:block;font-size:14.5px}.kind span{font-size:12.5px;color:#33403f}
.kind .plus{margin-left:auto;color:#0e6b66;font-size:22px;font-weight:600}
.slide-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #eef2f2}
.slide-row img{width:74px;height:50px;object-fit:cover;border-radius:8px}
.slide-row .nm{flex:1;min-width:0;font-size:13.5px}.slide-row .nm b{display:block}
.slide-row .nm span{font-size:12px;color:#33403f}
.note-line{font-size:12.5px;color:#33403f;background:#f1f6f6;border-radius:10px;padding:9px 11px;display:flex;gap:8px;align-items:flex-start}
.note-line .ico{width:18px;height:18px;color:#0e6b66;flex:none;margin-top:1px}
.toast{position:absolute;left:12px;right:12px;bottom:92px;background:#16302e;color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;z-index:7}
.toast .ico{color:#6ee0c6}
/* previews of the logo and the app icon */
.hdprev{border:1px solid #e1e8e8;border-radius:12px;overflow:hidden;background:#fff}
.hdprev .bar{display:flex;align-items:center;gap:10px;height:58px;padding:0 12px;border-bottom:1px solid #f1dbe5}
.hdprev .bar .ico{width:20px;height:20px;color:#3a0f24}
.hdprev .cap{font-size:11.5px;color:#33403f;padding:5px 10px;background:#f7f9f9}
.home{border-radius:22px;padding:18px 14px 16px;background:linear-gradient(160deg,#2b3a67 0%,#5b4b8a 55%,#b0618a 100%);display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;color:#fff;font-size:10.5px;text-align:center}
.home .app{display:flex;flex-direction:column;align-items:center;gap:4px}
.home .app i{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.22);display:block}
.home .app.me svg{width:52px;height:52px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.home .app span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.masks{display:flex;gap:16px;align-items:flex-end;margin-top:12px;font-size:11.5px;color:#33403f;text-align:center}
.masks svg{display:block;margin:0 auto 4px}
.tab{display:flex;align-items:center;gap:8px;background:#e6eaea;border-radius:10px 10px 0 0;padding:8px 12px;font-size:12.5px;width:230px;margin-top:12px}
.tab svg{width:16px;height:16px;border-radius:3px}
/* desktop: the editor beside a live preview */
.dash.desk{display:grid;grid-template-columns:430px 1fr;min-height:900px}
.dash.desk .side{background:#f3f6f6;border-right:1px solid #e1e8e8;position:relative;min-height:900px}
.dash.desk .pane{background:#e7ecec;padding:18px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.dash.desk .pane .ptools{display:flex;gap:10px;align-items:center;width:100%;font-size:13px;color:#33403f}
.dash.desk .pane .ptools .seg{width:220px;margin-left:auto}
.dash.desk .pane .mini{border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:0}
.dash.desk .sheet{left:50%;right:auto;top:70px;bottom:auto;width:540px;transform:translateX(-50%);border-radius:18px;max-height:none}
.dash.desk .sheet .grab{display:none}
.dash.desk .sheet .dock{position:static;border-radius:0 0 18px 18px}
.hl{outline:3px solid #f2a516;outline-offset:-3px;position:relative;z-index:2}
.dash.fix{height:844px;overflow:hidden}

/* ---------- Banner layouts, the bar's pairs, hero tiles, dragged sections (the owner, 2026-11-18) ---------- */
/* the announcement bar: its items two at a time, every pair in one grid cell so the bar keeps the tallest pair's height */
.ann.rot{display:grid}
.ann.rot .set{display:grid}
.ann.rot .set.one{display:none}
.ann.rot .fr{grid-area:1/1;align-self:center;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.ann.rot .fr.on{opacity:1;transform:none}
.ann .sep{opacity:.65;margin:0 7px}
/* the hero's slide and two tiles: the slide rotates; each tile a collection the seller picked */
.hero.auto .slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.78))}
.hero.auto h1{color:#fff}
.hero .tile .k{display:block;font-size:11.5px;font-weight:600;opacity:.92}
.hero.auto .tile b{font-size:15px}
/* banners: full width, side by side, big + two; half-width banners on a phone are compact tiles */
.banners.full{grid-template-columns:1fr}
.banners.side{grid-template-columns:1fr 1fr;gap:10px}
.banners.side.n3{grid-template-columns:repeat(3,1fr);gap:8px}
.banners.big2{grid-template-columns:1fr 1fr;gap:10px}
.shop .banners.big2 .ban:first-child{grid-column:1/-1;height:190px}
.shop .ban.c{height:150px}
.banners.side.n3 .ban.c{height:170px}
.ban .cshade{display:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.78))}
.ban.c .shade{display:none}.ban.c .cshade{display:block}
.ban.c .tx{position:absolute;left:0;right:0;bottom:0;padding:11px 12px;max-width:none}
.ban.c .k{font-size:11px}
.ban.c b{font-size:18px;margin:1px 0 0}
.banners.side.n3 .ban.c b{font-size:15px}
.ban.c .s,.ban.c .btn{display:none}
/* a sketch caption between sections (Lytro's note, not the shop) */
.capstrip{background:#0e6b66;color:#fff;font:600 12px/1.4 'Inter','Noto Sans Bengali',sans-serif;padding:6px 16px;margin-top:18px}
@container (min-width:900px){
  .hero.auto .tiles{grid-column:2;grid-row:1/span 2}
  .hero.auto .tile .tx{left:16px;right:16px;bottom:14px;top:auto;padding:0;max-width:none;display:block}
  .hero.auto .tile .k{font-size:13px}
  .hero.auto .tile b{font-size:22px}
  .banners.side{gap:18px}
  .banners.side.n3{gap:18px}
  .banners.big2{grid-template-columns:2fr 1fr;grid-template-rows:230px 230px;gap:18px}
  .shop .banners.big2 .ban:first-child{grid-column:1;grid-row:1/3;height:auto}
  .shop .ban.c,.banners.side.n3 .ban.c{height:230px}
  .ban.c .shade{display:block}.ban.c .cshade{display:none}
  .ban.c .tx{position:relative;padding:28px;max-width:80%}
  .ban.c .s{display:block}.ban.c .btn{display:inline-flex}
  .ban.c .k{font-size:12.5px}
  .ban.c b,.banners.side.n3 .ban.c b,.banners.n3 .ban b{font-size:30px}
  .banners.big2 .ban:first-child b{font-size:46px}
}
/* the editor: a section row's handle, and a row held mid-drag */
.srow .hdl{color:#7d8d8c;display:grid;place-items:center;width:22px;flex:none}
.srow .hdl .ico{width:18px;height:18px}
.srow.fixed .hdl{visibility:hidden}
.srow.lift{background:#fff;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.22);outline:2px solid #0e6b66;transform:rotate(-1.2deg);position:relative;z-index:2;border-top-color:transparent}
.srow.gap{border:2px dashed #9fc9c4;border-radius:12px;min-height:60px;background:#f1f9f8}
.opts.two{grid-template-columns:repeat(3,1fr)}
.opt.no{opacity:.4}
.annprev{border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;text-align:center;background:#a3195b;color:#fff}
.annprev .pill{background:#f2639e;color:#3a0f24;border-radius:99px;padding:0 8px;margin-right:6px;font-size:11.5px}
.annstep{font-size:11.5px;color:#33403f;text-align:center;margin:4px 0}
.annprev .sep{opacity:.65;margin:0 7px}.annprev .nw{white-space:nowrap}
/* the header's order tracking (Bonik's): a truck on a phone, the truck and two lines on a computer */
.hd .icons{gap:12px}
/* four icons on a phone: a centred logo centres in the room between the menu and the icons */
.hd.centred .logo{position:static;transform:none;margin:0 auto}
.hero .tx .badge{align-self:flex-start}
.ann .nw{white-space:nowrap}
.trk{display:flex;align-items:center;gap:8px;color:inherit}
.trk span{display:none}
.hero.auto .tile .tx{padding:0}
@container (min-width:900px){
  .hd .icons{gap:18px}
  .hd.centred .logo{margin:0}
  .trk span{display:block;font-size:11.5px;line-height:1.25;color:var(--muted)}
  .trk b{display:block;font-size:13px;color:var(--hd-fg)}
  .hero.auto .tile .tx{top:auto;max-width:none;display:block;padding:0}
}

/* ---------- Phones (the owner, 2026-11-19, beside Bonik AI): the hero a compact card seen at a glance, a clear gap under
   the category chips, the shop's name cut short beside its mark, and the menu's drawer ---------- */
@container (max-width:639.98px){
  .ann.rot .set.two{display:none}
  .ann.rot .set.one{display:grid}
  .ann.rot .set.one .fr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@container (max-width:899.98px){
  .hd .logo{min-width:0;flex:0 1 auto;font-size:18px}
  .hd .logo > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd .logo small{display:none}
  .hd.centred .logo{margin:0}
  .hd .icons{flex:none}
  /* every design a rounded card, 16px from the edges and under the chips, about as tall as it is wide */
  .hero.overlay .slide,.hero.split .slide,.hero.auto .slide{margin:16px 16px 0;height:auto;aspect-ratio:1/.92;border-radius:max(var(--r-card),12px);overflow:hidden;position:relative}
  .hero.split .slide{display:block;background:#1b1b1b}
  .hero.split .ph{position:absolute;inset:0;aspect-ratio:auto}
  .hero.overlay .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.8))}
  .hero.overlay .tx,.hero.split .tx{position:absolute;left:0;right:0;bottom:0;padding:16px;color:#fff}
  .hero.split .tx{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.8) 40%)}
  .hero.split h1,.hero.split h1 em{color:#fff}
  .hero.overlay h1,.hero.split h1{font-size:24px}
  .hero .kick{font-size:11px}
  .hero.overlay p,.hero.split p{font-size:13px;margin:4px 0 10px;color:#fff;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hero .price{font-size:16px;margin:2px 0 10px}
  .hero .btn{padding:9px 16px;font-size:14px}
  .hero .btn .ico{width:18px;height:18px}
}
/* the menu's drawer: the shop's lists, its categories with their counts, help and the language */
.dscrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:absolute;top:0;left:0;bottom:0;width:88%;max-width:340px;background:var(--bg);color:var(--text);z-index:21;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.drawer .dh b{flex:1;font-family:var(--fh);font-size:19px;line-height:1.25}
.drawer .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.drawer .row.on{background:var(--accent-soft);color:var(--main)}
.drawer .row .ico{width:20px;height:20px;color:var(--main)}
.drawer .row .n{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.drawer .row .go{margin-left:auto;color:var(--muted)}
.drawer .lab{padding:18px 16px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.drawer .langs{display:inline-flex;margin:6px 16px 24px;border:1.5px solid var(--line-strong);border-radius:999px;padding:3px}
.drawer .langs span{padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px}
.drawer .langs span.on{background:var(--main);color:var(--on-main)}
/* Computers (the owner, 2026-11-19): the photo-and-words and full-photo heroes sit inside the page's width as the
   slide-and-tiles one does -- the same side margins, a gap under the header, rounded -- never edge to edge */
@container (min-width:900px){
  .hero.overlay:not(.auto),.hero.split{max-width:1240px;margin:0 auto;padding:16px 32px 0}
  .hero.overlay:not(.auto) .slide,.hero.split .slide{border-radius:max(var(--r-card),12px);overflow:hidden}
  .hero.overlay:not(.auto) .slide{height:460px}
  .hero.overlay:not(.auto) .tx{padding:0 56px}
  .hero.overlay:not(.auto) h1{font-size:48px}
  .hero.split .slide{min-height:420px}
  .hero.split .tx{padding:48px 44px}
  .hero.split h1{font-size:44px}
}
/* ---------- the one product page (the owner, 2026-11-24): Lytro's product page and Bonik's, merged ---------- */
.pp{padding:0 0 96px}
.pp-gal{position:relative;background:var(--img-bg)}
.pp-gal .main{aspect-ratio:4/5;overflow:hidden}
.pp-gal .main img{width:100%;height:100%;object-fit:cover;display:block}
.pp-gal .badge{position:absolute;top:12px;left:12px;background:var(--sale);color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:4px 10px}
.pp-gal .count{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.62);color:#fff;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px}
.pp-gal .fav{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.pp-gal .fav .ico{width:19px;height:19px}
.pp-thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
.pp-thumbs img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:2px solid transparent;flex:none}
.pp-thumbs img.on{border-color:var(--main)}
.pp-buy{display:flex;flex-direction:column;gap:14px;padding:14px 16px 0}
.pp-cat{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--chip-fg);background:var(--chip-bg);border-radius:99px;padding:3px 11px}
.pp-name{font-family:var(--fh);font-size:24px;line-height:1.25;color:var(--text)}
.pp-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px}
.pp-price b{font-size:27px;color:var(--price)}
.pp-price s{color:var(--muted);font-size:15px}
.pp-save{font-size:12.5px;font-weight:700;color:var(--sale);background:color-mix(in srgb,var(--sale) 12%,#fff);border-radius:99px;padding:3px 9px}
.pp-stock{font-size:12.5px;font-weight:600;color:#1b7a43;background:#e3f3e9;border-radius:99px;padding:3px 9px}
.pp-chips{display:flex;flex-wrap:wrap;gap:8px}
.pp-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:8px;padding:5px 10px;background:color-mix(in srgb,var(--line) 55%,#fff);color:var(--muted)}
.pp-chip.ok{background:#e3f3e9;color:#1b7a43;font-weight:600}
.pp-chip .ico{width:15px;height:15px}
.pp-chip a{color:var(--link);font-weight:700}
.pp-opt{display:flex;flex-direction:column;gap:8px}
.pp-lb{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.pp-lb b{color:var(--text)}
.pp-lb a{color:var(--link);font-weight:600;font-size:13.5px}
.pp-designs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pp-designs span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:3px;background:var(--card-bg)}
.pp-designs span.on{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main);font-weight:700}
.pp-designs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}
.pp-sizes{display:flex;flex-wrap:wrap;gap:8px}
.pp-sizes span{min-width:46px;height:42px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--card-bg)}
.pp-sizes span.on{background:var(--main);border-color:var(--main);color:var(--on-main)}

// ---------- section renderers ----------
function head(theme, title, all = true) {
  const kind = THEMES[theme].head;
  const allLink = all ? `<a class="all">${L('সব দেখুন', 'See all')} →</a>` : '';
  if (kind === 'ornament') return `<div class="sh centre"><span class="line"></span><span class="orn">◆</span><h2>${title}</h2><span class="orn">◆</span><span class="line"></span></div>`;
  if (kind === 'petal') return `<div class="sh centre"><span class="line"></span><span class="orn">✿</span><h2>${title}</h2><span class="orn">✿</span><span class="line"></span></div>`;
  if (kind === 'leaf') return `<div class="sh">${ic('leaf', 'leaf')}<h2>${title}</h2>${allLink}</div>`;
  if (kind === 'kicker') return `<div class="sh rule"><h2>${title}</h2>${allLink}</div>`;
  return `<div class="sh"><h2>${title}</h2>${allLink}</div>`;
}

function offersLine(shop) {
  const onSale = shop.products.filter((p) => p.was);
  const best = Math.max(...onSale.map(pct));
  return L(`${onSale.length}টি পণ্যে ${best}% পর্যন্ত ছাড় চলছে`, `Up to ${best}% off on ${onSale.length} products`);
}

function renderShop(theme, outlined, light, given) {
  const shop = given || SHOPS[theme];
  const vars = Object.entries(THEMES[theme].v).map(([k, v]) => `--${k}:${v}`).join(';');
  const body = shop.layout.map((s) => {
    const key = Array.isArray(s) ? s[0] : s;
    const html = Array.isArray(s) ? SECTIONS.products(theme, shop, s[0], s[1]) : SECTIONS[s](theme, shop);
    return key === light ? `<div class="hl">${html}</div>` : html;
  }).join('');
  return `<div class="shop ${outlined ? 'outlined' : ''}" style="${vars}">${body}<span class="chatbtn">${ic('wa')}</span></div>`;
}

// ---------- the editor's section sheets (PR 3b): each section's own sheet, and the pickers a row and a button open ----------
// A field as the slide's are drawn; `area` draws a few lines of text, `sel` a choice that opens a list.
function fld(label, value, hint, opts = {}) {
  const box = opts.area ? `<div class="in" style="min-height:${opts.area}px;align-items:flex-start;line-height:1.5">${value}</div>` : `<div class="in">${value}${opts.sel ? '<span class="caret">⌄</span>' : ''}</div>`;
  return `<div class="field"><label>${label}</label>${box}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
}
// A photo with its focal point, as the slide draws it.
function photoField(label, name, hint, at = [46, 38]) {
  return `<div class="field"><label>${label}</label><div style="position:relative;border-radius:12px;overflow:hidden"><img src="${img(name)}" alt="" style="width:100%;height:150px;object-fit:cover"><span style="position:absolute;left:${at[0]}%;top:${at[1]}%;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0e6b66,0 2px 8px rgba(0,0,0,.4)"></span><button class="dbtn quiet sm" style="position:absolute;right:8px;bottom:8px">${ic('upload')} ${L('ছবি বদলান', 'Change photo')}</button></div><span class="hint">${hint}</span></div>`;
}
const FOCUS_HINT = () => L('বিন্দুটা টেনে রাখুন ছবির মূল অংশে: ছবি কাটার সময় এই অংশ থাকবে। অন্তত ১২০০ পিক্সেল চওড়া।', 'Drag the dot onto what matters: the photo is cropped around it. At least 1200 px wide.');
const DOCK_SECTION = () => `<div class="dock"><button class="dbtn quiet">${L('সেকশন মুছুন', 'Remove section')}</button><button class="dbtn">${L('ঠিক আছে', 'Done')}</button></div>`;
const DOCK_ITEM = () => `<div class="dock"><button class="dbtn quiet">${L('মুছুন', 'Remove')}</button><button class="dbtn">${L('ঠিক আছে', 'Done')}</button></div>`;
const DOCK_DONE = () => `<div class="dock"><button class="dbtn">${L('ঠিক আছে', 'Done')}</button></div>`;
// A step inside a sheet (a row's products, a button's place): a back arrow before its title.
function sheetStep(title, inner, dock) {
  return `<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="shd"><span class="back">${ic('back')}</span><h2>${title}</h2></div><div class="sbody">${inner}</div>${dock}</div>`;
}
const box = (on) => `<span style="width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;${on ? 'background:#0e6b66;color:#fff' : 'border:2px solid #9fb0af'}">${on ? ic('check').replace('class="ico ', 'style="width:16px;height:16px;stroke-width:2.6" class="ico ') : ''}</span>`;
const addQuiet = (words) => `<button class="dbtn quiet" style="width:100%;margin-top:4px">${ic('plus')} ${words}</button>`;
const SAMPLE = () => SHOPS[ED];
const bnNum = (n) => String(n).replace(/\d/g, (x) => '০১২৩৪৫৬৭৮৯'[Number(x)]);
// How much of a field's limit its words take, as the field counts them.
const chars = (text, max) => L(`${bnNum(text.length)}/${bnNum(max)} অক্ষর`, `${text.length}/${max} characters`);
const CHOSEN = [3, 0, 4];

// One banner's fields: a slide's, with the shorter headline a banner holds.
function bannerInner(name, kicker, headline, button, leads) {
  return photoField(L('ছবি', 'Photo'), name, FOCUS_HINT()) + fld(L('ছোট লেখা (ঐচ্ছিক)', 'Kicker (optional)'), kicker) + fld(L('শিরোনাম', 'Headline'), headline, chars(headline, 40)) + fld(L('বিবরণ (ঐচ্ছিক)', 'Description (optional)'), L('শুধু এই মাসে', 'This month only')) + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${fld(L('বোতামের লেখা', 'Button'), button)}${fld(L('বোতাম নিয়ে যাবে', 'Leads to'), leads, '', { sel: true })}</div>`;
}

    note: ['স্লাইড বা ব্যানারের বোতাম কোথায় নেবে: অফার কালেকশন, নতুন এসেছে, বেশি বিক্রি, একটা ক্যাটাগরি বা একটা প্রোডাক্ট। ক্যাটাগরি বা প্রোডাক্ট বাছলে নিচে তালিকা আসে; সেটা পরে লুকানো বা মুছে গেলে বোতাম হোম পেজে নেয়।', "Where a slide's or banner's button leads: On sale, Just in, Best sellers, a category or a product. Picking a category or a product lists them below; one hidden or deleted later leads home instead."],

  'e-announce': {
    label: ['ঘোষণার লাইন', 'Announcement bar'],
    note: ['ঘোষণার লাইন (মালিকের সিদ্ধান্ত, ২০২৬-১১-১৮): একটা তালিকা, দুটো করে দেখায়, ৪ সেকেন্ড পর পরের দুটো (৫টি থাকলে ১-২, ৩-৪, তারপর ৫)। অটো তিনটি: ক্যাশ অন ডেলিভারি, ডেলিভারি চার্জ আর চলমান অফার (অফার না থাকলে নিজে সরে যায়); প্রতিটি বন্ধ করা যায়। নিজের লাইন ৪০ অক্ষর পর্যন্ত, সব মিলিয়ে ৬টি। পেজ স্ক্রল করলে লাইনটা সরে যায়, হেডার থাকে।', 'The announcement bar (the owner, 2026-11-18): one list shown two at a time, the next two after 4 seconds (with five: 1-2, 3-4, then 5). Three are automatic: cash on delivery, the delivery charges and the offers on now (gone by itself with no offer); each can be turned off. Your own lines up to 40 characters, six in all. Scrolling the page hides the bar; the header stays.'],
    render: (d) => {
      const own = ANN_OWN();
      const items = [[L('ক্যাশ অন ডেলিভারি', 'Cash on delivery'), true], [deliveryLine().replace(/<span class="sep">·<\/span><wbr>/g, ' · ').replace(/<[^>]+>/g, ''), true], [offerItem(SAMPLE()).replace(/<span class="pill">.*?<\/span>/, ''), true], [own, false]];
      const rows = items.map(([text, auto]) => `<div class="srow"><span class="grip">${ic('up')}${ic('down')}</span><span class="nm"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${text}</b><span>${auto ? L('অটো · শপের তথ্য থেকে', 'Auto · from your shop') : L('নিজের লেখা', 'Your own words')}</span></span>${auto ? '<span class="switch"></span>' : `<span class="chev">${ic('chev')}</span>`}</div>`).join('');
      const frames = annPairs(annItems(SAMPLE(), [own]));
      const seen = frames.map((pair, at) => `${at ? `<div class="annstep">${L('৪ সেকেন্ড পর', 'After 4 seconds')} ↓</div>` : ''}<div class="annprev">${pair.join('<span class="sep">·</span><wbr>')}</div>`).join('') + `<div class="annstep">${L('তারপর আবার প্রথম দুটো', 'Then the first two again')}</div>`;
      const inner = `<div class="field"><label>${L('লাইনগুলো (৬টির মধ্যে ৪টি), এই ক্রমে', 'Lines (4 of 6), in this order')}</label>${rows}${addQuiet(L('নিজের লাইন যোগ করুন', 'Add a line of your own'))}</div>`
        + `<div class="field" style="margin-bottom:6px"><label>${L('দোকানে যেমন দেখাবে: দুটো করে', 'As shoppers see it: two at a time')}</label></div>${seen}`
        + `<div class="note-line" style="margin-top:10px">${ic('info')}<span>${L('অফারের লাইন শুধু অফার চললে দেখায়, শেষ হলে নিজে সরে যায়। ফোনে (৬৪০ পিক্সেলের কম চওড়া) একটা করে, এক লাইনে দেখায়। ক্রেতা পেজ নিচে স্ক্রল করলে লাইনটা সরে যায়, হেডার উপরে থাকে; একেবারে উপরে ফিরলে আবার দেখায়।', 'The offers line shows only while something is on sale. On a phone (under 640 px wide) one at a time, on one line. When a shopper scrolls down the bar leaves and the header stays; back at the top, it returns.')}</span></div>`;
      return screen(d, L('স্টোরফ্রন্ট ডিজাইন', 'Storefront design'), DRAFT(), designBody('announce'), dockDesign(), sheet(L('ঘোষণার লাইন', 'Announcement bar'), inner, DOCK_SECTION()), 'announce', PANE(ED, swap(ED, { announce: (t, s) => SECTIONS.announce(t, s, [own]) }), 'announce'));
    },
  },

// The bar's items: cash on delivery, the highest delivery charge in and outside Dhaka (the owner's wording), the offers on
// now (only while something is on sale), then the seller's own lines; shown two at a time.
// Each zone by the shop's name for it (DLV-01 names them after the home area until the seller renames them).
const deliveryLine = () => L(`<span class="nw">ঢাকা সিটির ভেতরে ডেলিভারি সর্বোচ্চ ${money(DELIVERY.dhaka)}</span><span class="sep">·</span><wbr><span class="nw">ঢাকা সিটির বাইরে সর্বোচ্চ ${money(DELIVERY.outside)}</span>`, `<span class="nw">Inside Dhaka city: delivery up to ${money(DELIVERY.dhaka)}</span><span class="sep">·</span><wbr><span class="nw">Outside Dhaka city: up to ${money(DELIVERY.outside)}</span>`);
function offerItem(shop) {
  const on = shop.products.filter((p) => p.was);
  if (on.length === 0) return null;
  const best = Math.max(...on.map(pct));
  return `<span class="pill">${L('অফার', 'Offer')}</span>${L(`${on.length}টি পণ্যে ${best}% পর্যন্ত ছাড় চলছে`, `Up to ${best}% off on ${on.length} products`)}`;
}
function annItems(shop, own = []) {
  return [`<span class="nw">${L('ক্যাশ অন ডেলিভারি', 'Cash on delivery')}</span>`, deliveryLine(), offerItem(shop), ...own].filter(Boolean);
}
function annPairs(items) {
  const pairs = [];
  for (let at = 0; at < items.length; at += 2) pairs.push(items.slice(at, at + 2));
  return pairs;
}
const ANN_OWN = () => L('ঈদে ৳২,০০০+ অর্ডারে গিফট', 'A gift with Eid orders over ৳2,000');
// The sketch turns the bar as the shop will (not in a capture).
setInterval(() => {
  if (document.documentElement.classList.contains('shot')) return;
  document.querySelectorAll('.ann.rot .set').forEach((bar) => {
    const frames = [...bar.querySelectorAll('.fr')];
    if (frames.length < 2) return;
    const at = frames.findIndex((frame) => frame.classList.contains('on'));
    frames[at].classList.remove('on');
    frames[(at + 1) % frames.length].classList.add('on');
  });
}, 4000);

// A desktop's wide photo of a product or a banner, where the sample has one; otherwise its own photo.
const wideImg = (name) => img(name.replace('-tall', '') + '-wide');

// What a place shows: a hero tile, or a banner that fills itself. A collection from the shop's own data, its photo a
// product of that collection that isn't on the slide or an earlier place (`skip`), else its last.
const PLACE_NAMES = { sale: ['অফার কালেকশন', 'On sale'], latest: ['নতুন এসেছে', 'Just in'], hot: ['সবচেয়ে বেশি বিক্রি', 'Best sellers'], cat: ['একটা ক্যাটাগরি', 'A category'] };
function placeOf(shop, kind, skip = []) {
  const list = SOURCES[kind].pick(shop.products);
  const p = list.find((x) => !skip.includes(x)) || list[list.length - 1];
  if (kind === 'sale') {
    const on = shop.products.filter((x) => x.was);
    const best = Math.max(...on.map(pct));
    return { p, i: p.i, k: L('অফার চলছে', 'Offers on'), b: L(`${best}% পর্যন্ত ছাড়`, `Up to ${best}% off`), s: L(`${on.length}টি পণ্যে`, `On ${on.length} products`) };
  }

// ha-now: the home as built. The Studio page (newest grid of 4, banners, on-sale carousel of 6) and SB-30's rows for the

// The proposal: rows read top to bottom, each skipping what a row above showed; an automatic row shows only when it can
// fill itself (a grid 4, a carousel 5, what a computer shows at once); SB-30 takes the first three categories that can;
// then "সব প্রোডাক্ট": everything not yet shown, in the shop's order, 12 at a time.
function haProposal(shop, o = {}) {
  const ps = shop.products;
  const seen = new Set();
  const fill = (list, count, need) => {
    const rest = list.filter((p) => !seen.has(p.id));
    if (rest.length < need) return null;
    const take = rest.slice(0, count);
    take.forEach((p) => seen.add(p.id));
    return take;
  };
  const parts = [];
  const caps = o.caps !== false;
  const fresh = fill(haNewest(ps), 4, 4);
  if (fresh) parts.push(haRow(L('নতুন এসেছে', 'Just in'), fresh, 'grid', HA_NAME_NEW()));
  parts.push(haBanners(shop));
  const saleAll = haSale(ps);
  const sale = fill(saleAll, 6, 5);
  if (sale) {
    parts.push(haRow(L('অফার কালেকশন', 'On sale'), sale, 'rail', HA_NAME_SALE()));
    const dropped = saleAll.length - sale.length;
    if (caps && dropped > 0) parts.push(haCap(`অফার কালেকশন: উপরে দেখানো ${bnNum(dropped)}টি আর আসে না, তবু ${bnNum(sale.length)}টি দিয়ে ভরে।`, `On sale: the ${dropped} shown above don’t come again; ${sale.length} still fill it.`));
  } else if (caps && saleAll.length > 0) {
    parts.push(haCap(`অফারে মাত্র ${bnNum(saleAll.length)}টি, সারি ভরে না: সারিটা দেখায় না; উপরে না-আসাগুলো সব প্রোডাক্টে।`, `Only ${saleAll.length} on sale, not enough to fill a row: no row; any not shown above come in All products.`));
  }
  const skipped = [];
  let rows = 0;
  shop.cats.forEach((c) => {
    if (rows >= STARTING_CATEGORY_ROWS_SKETCH) return;
    const list = fill(haCat(ps, c), 4, 4);
    if (list) {
      rows += 1;
      parts.push(haRow(L(HA_CATS[c][0], HA_CATS[c][1]), list, 'grid', HA_NAME_CAT(c)));
    } else skipped.push(c);
  });
  if (caps && skipped.length) {
    const what = skipped.map((c) => L(`${HA_CATS[c][0]}র বাকি ${bnNum(haCat(ps, c).filter((p) => !seen.has(p.id)).length)}টি`, `${haCat(ps, c).filter((p) => !seen.has(p.id)).length} more ${HA_CATS[c][1].toLowerCase()}`));
    parts.push(haCap(`ক্যাটাগরির সারি শুধু যেখানে উপরে না-আসা ৪টি কার্ড আছে। ${what.join(', ')} সারি ভরায় না, তাই নিচে সব প্রোডাক্টে।`, `A category row only where 4 cards are still unshown. ${what.join(', ')} can’t fill one, so they come below in All products.`));
  }
  const rest = ps.filter((p) => !seen.has(p.id));
  const shown = o.more ? rest : rest.slice(0, 12);
  if (caps) parts.push(haCap(o.more ? `“আরও দেখুন” চাপার পর: বাকি ${bnNum(rest.length - 12)}টি এখানেই যোগ হল, পেজ বদলায় না। সব এসে গেলে বোতাম থাকে না।` : `নতুন · সব প্রোডাক্ট: উপরে যা আসেনি তার সবগুলো, ক্যাটাগরি থাকুক বা না থাকুক (কোনো “অন্যান্য” লেবেল নেই)। ১২টি করে।`, o.more ? `After “See more”: the other ${rest.length - 12} join here, on the same page. Once all are in, the button goes.` : 'New · All products: everything not shown above, with or without a category (no “Other” label). 12 at a time.'));
  if (rest.length) {
    const title = `${L('সব প্রোডাক্ট', 'All products')}<span class="ha-n">· ${L(`${ps.length}টি`, `${ps.length}`)}</span>`;
    const more = rest.length > shown.length ? `<a class="ha-btn">${L(`আরও ${rest.length - shown.length}টি প্রোডাক্ট দেখুন`, `See ${rest.length - shown.length} more`)} ${ic('down')}</a>` : '';
    parts.push(`<section class="sec" data-sec="${L('প্রোডাক্ট · অটো: সব প্রোডাক্ট · ১২টি করে (নতুন)', 'Products · auto: all products · 12 at a time (new)')}"><div class="wrap">${head('studio', title)}<div class="grid">${shown.map((p) => haCard(p)).join('')}</div>${more}</div></section>`);
  }
  if (caps && o.small) parts.push(haCap(`৭টি পণ্য, প্রতিটি একবার। সব প্রোডাক্টের শেষ লাইনে একটা কার্ড থাকতে পারে, যেমন ক্যাটাগরি পেজে; ওটা তালিকার শেষ, খালি সারি নয়।`, 'Seven products, each once. All products may end on a single card, as a category page does: the end of a list, not an empty row.'));
  return haPage(shop, parts);
}

  const shop = HA_SHOPS.six;
  const parts = [
    haCap('ফোনে ৬টি ক্যাটাগরির টাইল স্ট্রিপে ধরে না, তাই নিজে থেকে ঘোরে: ৩ সেকেন্ডে একটা টাইল সরে, শেষেরটার পর আবার প্রথমগুলো আসে (লাফ দিয়ে শুরুতে ফেরে না)। ছুঁলে, টানলে, মাউস রাখলে বা ফোকাস করলে থামে, ৪ সেকেন্ড পর আবার চলে; হাতে টেনে দেখা আগের মতোই।', 'On a phone the 6 category tiles overflow the strip, so it rotates: one tile every 3 s, and after the last the first ones follow (no jump back). It holds while touched, dragged, hovered or focused and goes on after 4 s idle; swiping by hand works as before.'),
    haCap('স্ক্রিনের বাইরে, ট্যাব লুকানো থাকলে বা ফোনে “কম নড়াচড়া” (reduced motion) চালু থাকলে নড়ে না। কম্পিউটারে সব টাইল ধরে যায়, তাই কিছুই নড়ে না। হেডারের নিচের ক্যাটাগরি চিপ কখনো নড়ে না।', 'Off-screen, in a hidden tab or with reduced motion it never moves. On a computer every tile fits, so nothing moves. The category chips under the header never move.'),
  ];
  return haPage(shop, parts, haRotatingCats(shop));
}
function haCatNoImage() {
  const shop = HA_SHOPS.noimage;
  const parts = [
    haCap('৬টি ক্যাটাগরির ২টির (উপহার, এক্সেসরিজ) কোনো ছবি নেই: নিজের ছবি নেই, প্রোডাক্টেরও ছবি নেই। খালি টাইল দেখাবে বলে এই সেকশনে আসে না; হেডারের চিপে আর নিজের পেজে আগের মতোই আছে। বাকি ৪টি ধরে না বলে ঘোরে।', 'Two of the 6 categories (Gifts, Accessories) have no picture: none of their own and no product photo. They would draw an empty tile, so this section leaves them out; the header chips and their own pages keep them. The other 4 overflow, so they rotate.'),
    haCap('কোনো ক্যাটাগরিরই ছবি না থাকলে সেকশনটাই দেখায় না।', 'When no category has a picture, the section does not show.'),
  ];
  return haPage(shop, parts, haRotatingCats(shop));
}

Object.assign(EDITOR, {
  'ha-now': { label: ['হোম: আজ যেমন', 'Home: as built'], note: ['বিল্ট হোম, ৩৫টি পণ্যের দোকানে (২৩টি ক্যাটাগরি ছাড়া)। প্রতিটি সারি আলাদা পড়ে: একই কার্ড বারবার, ২টি পণ্যের সারি, আর বেশিরভাগ পণ্য হোমে আসেই না।', 'The built home for a 35-product shop (23 with no category). Each row reads on its own: the same cards again, a row of 2, and most products never on the home page.'], render: () => haNow() },
  'ha-mixed': { label: ['হোম: সব প্রোডাক্ট (অনুমোদিত)', 'Home: all products (approved)'], note: ['অনুমোদিত (২০২৬-১১-২৬): কোনো কার্ড দুবার নয়, যে সারি ভরে না সেটা নেই, আর শেষে “সব প্রোডাক্ট”: বাকি সবগুলো, ক্যাটাগরি থাকুক বা না থাকুক, ১২টি করে।', 'Approved (2026-11-26): no card twice, no row that cannot fill, and “All products” at the end: everything else, with or without a category, 12 at a time.'], render: () => haProposal(HA_SHOPS.mixed) },
  'ha-more': { label: ['হোম: আরও দেখুনের পর', 'Home: after See more'], note: ['“আরও দেখুন” একবার চাপার পর: বাকি ১০টি একই জায়গায় যোগ হয়; সব এসে গেলে বোতাম থাকে না।', 'After one “See more”: the other 10 join in place; once all are in, the button goes.'], render: () => haProposal(HA_SHOPS.mixed, { more: true }) },
  'ha-no-categories': { label: ['হোম: ক্যাটাগরি নেই', 'Home: no categories'], note: ['১৮টি পণ্য, কোনো ক্যাটাগরি নেই: ক্যাটাগরির সেকশন নেই, অফারের সারি ভরে না বলে নেই; নতুন ৪টি, তারপর সব প্রোডাক্ট।', '18 products and no categories: no category section, no on-sale row (it cannot fill); the 4 newest, then All products.'], render: () => haProposal(HA_SHOPS.none) },
  'ha-small': { label: ['হোম: ৭টি পণ্যের দোকান', 'Home: a 7-product shop'], note: ['৭টি পণ্য: প্রতিটি একবার, কোনো আধা-খালি সারি নেই।', 'Seven products: each once, no half-empty row.'], render: () => haProposal(HA_SHOPS.small, { small: true }) },
  'ha-cat-rotate': { label: ['হোম: ক্যাটাগরি ঘোরে', 'Home: categories rotate'], note: ['মালিকের যোগ (২০২৬-১১-২৬): ক্যাটাগরির টাইল না ধরলে নিজে থেকে ঘোরে, ধরে গেলে নড়ে না।', 'The owner’s addition (2026-11-26): category tiles that overflow rotate by themselves; tiles that fit never move.'], render: () => haCatRotate() },
  'ha-cat-noimage': { label: ['হোম: ছবিহীন ক্যাটাগরি বাদ', 'Home: categories without a picture left out'], note: ['মালিক (২০২৬-১১-২৬): ছবি ছাড়া ক্যাটাগরি এই সেকশনে আসে না; হেডারে চিপ তো আছেই।', 'The owner (2026-11-26): a category without a picture is left out of this section; the header has its chip anyway.'], render: () => haCatNoImage() },
  'ha-desktop': { label: ['হোম: সব প্রোডাক্ট, কম্পিউটারে', 'Home: all products, computer'], note: ['ha-mixed, ১২৮০ পিক্সেলে: সব প্রোডাক্ট ৪টি করে কলামে, ১২টি = ৩ লাইন।', 'ha-mixed at 1280 px: All products 4 across, 12 = 3 lines.'], render: () => haProposal(HA_SHOPS.mixed) },
});
/* ---------- end of every product on the home page (approved) ---------- */

function render() {
  const theme = THEMES[STATE.screen];
  const ed = EDITOR[STATE.screen];
  document.documentElement.lang = LANG;
  const btn = (key, label, on, attr) => `<button class="${on ? 'on' : ''}" onclick="${attr}('${key}')">${label}</button>`;
  document.getElementById('tb').innerHTML = `<span class="ttl">${L('স্টোরফ্রন্ট বিল্ডার · স্কেচ', 'Storefront builder · sketch')}</span>
    <span class="grp"><span>${L('থিম', 'Themes')}</span>${Object.keys(THEMES).map((k) => btn(k, T(THEMES[k].name), STATE.screen === k, 'pick')).join('')}</span>
    <span class="grp"><span>${L('এডিটর', 'Editor')}</span>${Object.keys(EDITOR).map((k) => btn(k, T(EDITOR[k].label), STATE.screen === k, 'pick')).join('')}</span>
    <span class="grp"><span>${L('ডিভাইস', 'Device')}</span>${btn('phone', L('ফোন', 'Phone'), STATE.device === 'phone', 'device')}${btn('desktop', L('ডেস্কটপ', 'Desktop'), STATE.device === 'desktop', 'device')}</span>
    <span class="grp">${btn('outline', L('সেকশনের নাম দেখান', 'Show section names'), STATE.outlined, 'toggle')}</span>
    <span class="grp">${btn('bn', 'বাংলা', LANG === 'bn', 'lang')}${btn('en', 'English', LANG === 'en', 'lang')}</span>`;
  document.getElementById('note').innerHTML = ed ? `<b>${T(ed.label)}</b> · ${T(ed.note)}` : theme ? `<b>${T(theme.name)}</b> · ${L('যাদের জন্য', 'For')}: ${T(theme.fits)} · ${L('ফন্ট', 'Fonts')}: ${theme.fonts[0]} / ${theme.fonts[1]} · ${L('প্রতিটি সেকশন দোকানের নিজের তথ্য থেকে নিজে ভরে যায়; বিক্রেতা চাইলে নিজের ছবি আর লেখা দেন।', "Every section fills itself from the shop's own data; the seller can put in their own photos and words.")}` : '';
  document.getElementById('stage').innerHTML = `<div class="frame ${STATE.device}">${ed ? ed.render(STATE.device) : renderShop(STATE.screen, STATE.outlined)}</div>`;
}
function pick(k) { STATE.screen = k; render(); }
function device(k) { STATE.device = k; render(); }
function toggle() { STATE.outlined = !STATE.outlined; render(); }
function lang(k) { LANG = k; render(); }
// Deep links (captures and sharing): #royal/phone/bn/outlined, read again whenever the address changes.
function fromHash() {
  const [screen, dev, lng, outlined] = location.hash.slice(1).split('/');
  if (THEMES[screen] || EDITOR[screen]) STATE.screen = screen;
  if (dev === 'phone' || dev === 'desktop') STATE.device = dev;
  if (lng === 'bn' || lng === 'en') LANG = lng;
  STATE.outlined = outlined === 'outlined';
  document.documentElement.classList.toggle('shot', location.hash.includes('/shot'));
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
