<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img" aria-labelledby="title desc">
  <title id="title">Lytro in two data centres</title>
  <desc id="desc">Cloudflare's edge cache and load balancer in front of two data centres. Centre A at CloudXen holds three app servers, Redis, a worker and the PostgreSQL primary. Centre B at Diana Host holds three app servers, Redis and the PostgreSQL hot standby, which streams from the primary. Centre B's app servers read from their own standby and write to the primary over a private tunnel. A witness at a third provider breaks ties. About 1.49 lakh taka a month.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="739" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <text class="d-h" x="110" y="22" text-anchor="middle">OUTSIDE</text>
  <rect class="nd" x="20" y="40" width="180" height="80" rx="8"/>
  <text class="d-t" x="110" y="72" text-anchor="middle">Shoppers, sellers,</text>
  <text class="d-t" x="110" y="90" text-anchor="middle">phones, couriers</text>
  <text class="d-s" x="110" y="108" text-anchor="middle">every request</text>

  <rect class="region" x="240" y="30" width="840" height="108" rx="10"/>
  <text class="d-h" x="256" y="48">CLOUDFLARE · OUTSIDE BOTH CENTRES</text>
  <rect class="nd-cf" x="260" y="58" width="190" height="64" rx="8"/>
  <text class="d-t" x="355" y="80" text-anchor="middle">Edge cache</text>
  <text class="d-s" x="355" y="98" text-anchor="middle">serves kept pages</text>
  <text class="d-s" x="355" y="113" text-anchor="middle">even if both centres fail</text>
  <rect class="nd-cf nd-new" x="480" y="58" width="290" height="64" rx="8"/>
  <text class="d-t" x="625" y="80" text-anchor="middle">Load balancer</text>
  <text class="d-s" x="625" y="98" text-anchor="middle">pools A and B · health checks</text>
  <text class="d-s" x="625" y="113" text-anchor="middle">a shopper stays in one centre</text>
  <rect class="nd-cf" x="800" y="58" width="260" height="64" rx="8"/>
  <text class="d-t" x="930" y="80" text-anchor="middle">R2</text>
  <text class="d-s" x="930" y="98" text-anchor="middle">photos, app files, backups</text>
  <text class="d-s" x="930" y="113" text-anchor="middle">outside both centres</text>
  <line class="ar" x1="200" y1="80" x2="258" y2="80" marker-end="url(#ah)"/>
  <line class="ar" x1="450" y1="90" x2="478" y2="90" marker-end="url(#ah)"/>
  <text class="d-l" x="464" y="84" text-anchor="middle">miss</text>

  <!-- Centre A -->
  <rect class="dc" x="40" y="170" width="490" height="400" rx="12"/>
  <text class="d-h" x="56" y="192">DATA CENTRE A · CLOUDXEN</text>
  <rect class="nd-back" x="78" y="202" width="220" height="92" rx="8"/>
  <rect class="nd-back" x="74" y="206" width="220" height="92" rx="8"/>
  <rect class="nd nd-new" x="70" y="210" width="220" height="92" rx="8"/>
  <text class="d-t" x="180" y="234" text-anchor="middle">App servers</text>
  <text class="d-badge" x="278" y="228" text-anchor="end">×3</text>
  <text class="d-s" x="180" y="252" text-anchor="middle">storefront · API · Caddy</text>
  <text class="d-s" x="180" y="268" text-anchor="middle">PgBouncer</text>
  <text class="d-cost" x="180" y="290" text-anchor="middle">3 × $25.20 = ৳9,431</text>
  <rect class="nd" x="320" y="210" width="190" height="46" rx="8"/>
  <text class="d-t" x="415" y="229" text-anchor="middle">Redis (centre A)</text>
  <text class="d-cost" x="415" y="246" text-anchor="middle">$13.20 = ৳1,647</text>
  <rect class="nd" x="320" y="266" width="190" height="46" rx="8"/>
  <text class="d-t" x="415" y="285" text-anchor="middle">Worker server</text>
  <text class="d-cost" x="415" y="302" text-anchor="middle">jobs · $25.20 = ৳3,144</text>
  <line class="ar" x1="290" y1="233" x2="318" y2="233" marker-end="url(#ah)"/>
  <rect class="nd nd-new" x="70" y="390" width="430" height="80" rx="8"/>
  <text class="d-t" x="285" y="414" text-anchor="middle">PostgreSQL primary</text>
  <text class="d-s" x="285" y="431" text-anchor="middle">every write, and centre A's reads</text>
  <text class="d-s" x="285" y="447" text-anchor="middle">VPS 14 vCPU / 64 GB / 1 TB</text>
  <text class="d-cost" x="285" y="463" text-anchor="middle">$96 = ৳11,976 a month</text>
  <line class="ar" x1="180" y1="302" x2="180" y2="388" marker-end="url(#ah)"/>
  <text class="d-l" x="188" y="350">reads, writes</text>
  <line class="ar" x1="415" y1="312" x2="415" y2="388" marker-end="url(#ah)"/>
  <text class="d-l" x="423" y="350">jobs</text>

  <!-- Centre B -->
  <rect class="dc" x="570" y="170" width="490" height="400" rx="12"/>
  <text class="d-h" x="586" y="192">DATA CENTRE B · DIANA HOST</text>
  <rect class="nd-back" x="608" y="202" width="220" height="92" rx="8"/>
  <rect class="nd-back" x="604" y="206" width="220" height="92" rx="8"/>
  <rect class="nd nd-new" x="600" y="210" width="220" height="92" rx="8"/>
  <text class="d-t" x="710" y="234" text-anchor="middle">App servers</text>
  <text class="d-badge" x="808" y="228" text-anchor="end">×3</text>
  <text class="d-s" x="710" y="252" text-anchor="middle">storefront · API · Caddy</text>
  <text class="d-s" x="710" y="268" text-anchor="middle">PgBouncer · spare workers</text>
  <text class="d-cost" x="710" y="290" text-anchor="middle">3 × ৳13,124 = ৳39,372</text>
  <rect class="nd nd-new" x="850" y="210" width="190" height="46" rx="8"/>
  <text class="d-t" x="945" y="229" text-anchor="middle">Redis (centre B)</text>
  <text class="d-cost" x="945" y="246" text-anchor="middle">৳6,299</text>
  <line class="ar" x1="820" y1="233" x2="848" y2="233" marker-end="url(#ah)"/>
  <rect class="nd-far" x="600" y="390" width="440" height="80" rx="8"/>
  <text class="d-t" x="820" y="414" text-anchor="middle">PostgreSQL hot standby</text>
  <text class="d-s" x="820" y="431" text-anchor="middle">centre B's reads; promoted if A fails</text>
  <text class="d-s" x="820" y="447" text-anchor="middle">VPS 24 vCPU / 64 GB / 1 TB</text>
  <text class="d-cost" x="820" y="463" text-anchor="middle">৳41,999 a month</text>
  <line class="ar" x1="760" y1="302" x2="760" y2="388" marker-end="url(#ah)"/>
  <text class="d-l" x="768" y="340">reads</text>
  <path class="ar" d="M650,302 V360 H515 V405 H502" marker-end="url(#ah)"/>
  <text class="d-l" x="583" y="354" text-anchor="middle">writes, 1–3 ms</text>
  <line class="ar" x1="500" y1="450" x2="598" y2="450" marker-end="url(#ah)"/>
  <text class="d-l" x="549" y="444" text-anchor="middle">streams</text>

  <!-- Cloudflare's pools -->
  <path class="ar" d="M560,122 V150 H180 V208" marker-end="url(#ah)"/>
  <text class="d-l" x="300" y="164" text-anchor="middle">pool A</text>
  <line class="ar" x1="690" y1="122" x2="690" y2="208" marker-end="url(#ah)"/>
  <text class="d-l" x="698" y="160">pool B</text>

  <!-- The witness -->
  <rect class="nd-far" x="430" y="600" width="240" height="50" rx="8"/>
  <text class="d-t" x="550" y="621" text-anchor="middle">Witness, at a third provider</text>
  <text class="d-s" x="550" y="638" text-anchor="middle">breaks a tie: one primary, ever</text>
  <line class="ar-far" x1="470" y1="600" x2="470" y2="472"/>
  <line class="ar-far" x1="630" y1="600" x2="630" y2="472"/>
  <text class="d-hf" x="550" y="590" text-anchor="middle">WATCHES BOTH</text>

  <rect class="nd-total" x="20" y="668" width="1060" height="56" rx="10"/>
  <text class="d-total" x="40" y="690">About ৳1.49 lakh a month ($1,191) at 2,000 shops · ৳74 a shop</text>
  <text class="d-s" x="40" y="710">Centre A ৳26,198 · centre B ৳87,670 · witness ≈ ৳1,000 · Cloudflare ৳9,980 · R2 ≈ ৳11,228 · monitoring ≈ ৳12,475</text>
</svg>
