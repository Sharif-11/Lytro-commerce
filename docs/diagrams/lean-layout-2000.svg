<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" width="1100" height="610" role="img" aria-labelledby="title desc">
  <title id="title">The lean layout for 2,000 shops</title>
  <desc id="desc">The lean layout: Cloudflare Pro in front of every host with an edge cache and a load balancer; four app servers each running the storefront and the API, one worker server and one Redis server in a CloudXen data centre in Dhaka; a PostgreSQL primary for every read and write, and a hot standby, all on VPS plans. About 71,000 taka a month.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-hit { stroke: #0e6b66; stroke-width: 2.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="609" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <text class="d-h" x="95" y="22" text-anchor="middle">OUTSIDE</text>
  <rect class="region" x="200" y="30" width="210" height="320" rx="10"/>
  <text class="d-h" x="305" y="22" text-anchor="middle">CLOUDFLARE PRO</text>
  <rect class="dc" x="440" y="66" width="640" height="404" rx="12"/>
  <text class="d-h" x="456" y="88">DHAKA · CLOUDXEN · PRIVATE NETWORK</text>
  <rect class="far" x="740" y="492" width="340" height="108" rx="12"/>
  <text class="d-hf" x="756" y="514">STANDBY</text>

  <!-- Outside -->
  <rect class="nd" x="20" y="44" width="150" height="106" rx="8"/>
  <text class="d-t" x="95" y="94" text-anchor="middle">Shoppers</text>
  <text class="d-s" x="95" y="111" text-anchor="middle">every shop, own domains</text>
  <rect class="nd" x="20" y="205" width="150" height="50" rx="8"/>
  <text class="d-t" x="95" y="226" text-anchor="middle">Sellers, operator</text>
  <text class="d-s" x="95" y="243" text-anchor="middle">app. · admin.</text>
  <rect class="nd" x="20" y="280" width="150" height="56" rx="8"/>
  <text class="d-t" x="95" y="302" text-anchor="middle">Websites, phones,</text>
  <text class="d-t" x="95" y="319" text-anchor="middle">couriers, bKash</text>
  <rect class="nd" x="20" y="390" width="150" height="56" rx="8"/>
  <text class="d-t" x="95" y="413" text-anchor="middle">SMS, couriers, bKash</text>
  <text class="d-s" x="95" y="430" text-anchor="middle">Resend, Gemini</text>

  <!-- Cloudflare -->
  <rect class="nd-cf" x="215" y="44" width="180" height="42" rx="8"/>
  <text class="d-t" x="305" y="62" text-anchor="middle">Photos, app files</text>
  <text class="d-s" x="305" y="78" text-anchor="middle">R2</text>
  <rect class="nd-cf nd-new" x="215" y="100" width="180" height="50" rx="8"/>
  <text class="d-t" x="305" y="121" text-anchor="middle">Edge cache</text>
  <text class="d-s" x="305" y="138" text-anchor="middle">own domains too (for SaaS)</text>
  <rect class="nd-cf nd-new" x="215" y="170" width="180" height="166" rx="8"/>
  <text class="d-t" x="305" y="236" text-anchor="middle">Load balancer</text>
  <text class="d-s" x="305" y="253" text-anchor="middle">health checks</text>
  <text class="d-s" x="305" y="269" text-anchor="middle">firewall · abuse limits</text>
  <text class="d-s" x="305" y="296" text-anchor="middle">Pro · LB · for SaaS</text>
  <text class="d-cost" x="305" y="312" text-anchor="middle">$70 = ৳8,733 a month</text>

  <line class="ar" x1="170" y1="65" x2="213" y2="65" marker-end="url(#ah)"/>
  <line class="ar" x1="170" y1="125" x2="213" y2="125" marker-end="url(#ah)"/>
  <line class="ar" x1="305" y1="150" x2="305" y2="168" marker-end="url(#ah)"/>
  <text class="d-l" x="313" y="163">miss</text>
  <line class="ar" x1="170" y1="230" x2="213" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="170" y1="308" x2="213" y2="308" marker-end="url(#ah)"/>

  <!-- App servers: storefront and API together -->
  <rect class="nd-back" x="492" y="138" width="200" height="140" rx="8"/>
  <rect class="nd-back" x="488" y="142" width="200" height="140" rx="8"/>
  <rect class="nd-back" x="484" y="146" width="200" height="140" rx="8"/>
  <rect class="nd nd-new" x="480" y="150" width="200" height="140" rx="8"/>
  <text class="d-t" x="580" y="176" text-anchor="middle">App servers</text>
  <text class="d-badge" x="668" y="170" text-anchor="end">×4</text>
  <text class="d-s" x="580" y="194" text-anchor="middle">8 vCPU / 16 GB each</text>
  <text class="d-s" x="580" y="211" text-anchor="middle">Caddy · storefront · API</text>
  <text class="d-s" x="580" y="228" text-anchor="middle">PgBouncer · a spare worker</text>
  <text class="d-s" x="580" y="245" text-anchor="middle">API calls balanced across all four</text>
  <text class="d-cost" x="580" y="270" text-anchor="middle">4 × $25.20 = ৳12,575 a month</text>
  <line class="ar" x1="395" y1="230" x2="478" y2="230" marker-end="url(#ah)"/>
  <text class="d-l" x="436" y="223" text-anchor="middle">every host</text>

  <rect class="nd nd-new" x="480" y="380" width="200" height="64" rx="8"/>
  <text class="d-t" x="580" y="399" text-anchor="middle">Worker server</text>
  <text class="d-s" x="580" y="415" text-anchor="middle">jobs, SMS, couriers, video</text>
  <text class="d-cost" x="580" y="432" text-anchor="middle">$25.20 = ৳3,144 a month</text>
  <path class="ar" d="M480,412 H200 V418 H172" marker-end="url(#ah)"/>
  <text class="d-l" x="330" y="406" text-anchor="middle">called directly (app servers too)</text>

  <!-- Data -->
  <rect class="nd nd-new" x="760" y="150" width="300" height="56" rx="8"/>
  <text class="d-t" x="910" y="173" text-anchor="middle">Redis</text>
  <text class="d-s" x="910" y="191" text-anchor="middle">limits · page cache · <tspan class="d-cost">$13.20 = ৳1,647 a month</tspan></text>
  <line class="ar" x1="680" y1="178" x2="758" y2="178" marker-end="url(#ah)"/>
  <text class="d-l" x="719" y="172" text-anchor="middle">pages, limits</text>

  <rect class="nd nd-new" x="760" y="240" width="300" height="84" rx="8"/>
  <text class="d-t" x="910" y="264" text-anchor="middle">PostgreSQL primary</text>
  <text class="d-s" x="910" y="281" text-anchor="middle">VPS 14 vCPU / 64 GB / 1 TB NVMe</text>
  <text class="d-s" x="910" y="297" text-anchor="middle">every read and write</text>
  <text class="d-cost" x="910" y="314" text-anchor="middle">$96 = ৳11,976 a month</text>
  <line class="ar" x1="680" y1="270" x2="758" y2="270" marker-end="url(#ah)"/>
  <text class="d-l" x="719" y="264" text-anchor="middle">reads, writes</text>
  <path class="ar" d="M680,412 H730 V312 H758" marker-end="url(#ah)"/>
  <text class="d-l" x="736" y="368">jobs</text>

  <rect class="nd-far" x="760" y="526" width="300" height="64" rx="8"/>
  <text class="d-t" x="910" y="549" text-anchor="middle">Hot standby (PostgreSQL)</text>
  <text class="d-s" x="910" y="565" text-anchor="middle">VPS 14 vCPU / 64 GB / 1 TB</text>
  <text class="d-cost" x="910" y="582" text-anchor="middle">$96 = ৳11,976 a month</text>
  <line class="ar ar-dash" x1="910" y1="324" x2="910" y2="524" marker-end="url(#ah)"/>
  <text class="d-l" x="918" y="430">streams</text>

  <!-- The month's total -->
  <rect class="nd-total" x="20" y="500" width="690" height="90" rx="10"/>
  <text class="d-total" x="40" y="530">About ৳71,000 a month ($571) at 2,000 shops, all at CloudXen</text>
  <text class="d-s" x="40" y="552">8 VPS ৳41,317 · Cloudflare ৳8,733 · R2 ≈ ৳11,228 · monitoring ≈ ৳9,980</text>
  <text class="d-s" x="40" y="572">With a dedicated database server: about ৳91,000. The full 15-server layout: about ৳2.1 lakh.</text>
</svg>
