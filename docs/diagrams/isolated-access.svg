<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="title desc">
  <title id="title">What may reach the data layer</title>
  <desc id="desc">The flows allowed into and out of the data layer: shoppers reach only the API layer through Cloudflare; the API layer reaches the data gateway on port 6432 and its own centre's Redis on 6379; the gateway reaches PostgreSQL on 5432; admins come in only through the bastion over SSH; backups and metrics go outward only. Refused: the API layer reaching PostgreSQL, Patroni or etcd directly, and anything from the internet reaching the data layer.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
    .zone { fill: none; stroke: #7e8f8e; stroke-width: 1; stroke-dasharray: 2 4; }
    .grid { stroke: #d5dfde; stroke-width: 1; }
    .bar-self { fill: #107f78; }
    .bar-managed { fill: #b9770a; }
    .d-bad { fill: #c8323b; font-size: 11.5px; font-weight: 600; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="469" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="region" x="20" y="20" width="210" height="300" rx="10"/>
  <text class="d-h" x="36" y="40">PUBLIC</text>
  <rect class="zone" x="250" y="20" width="230" height="300" rx="10"/>
  <text class="d-l" x="262" y="40">API NETWORK</text>
  <rect class="dc" x="500" y="20" width="580" height="300" rx="10"/>
  <text class="d-h" x="516" y="40">DATA NETWORK · WIREGUARD · NO PUBLIC ADDRESSES</text>

  <rect class="nd-cf" x="40" y="60" width="170" height="50" rx="8"/>
  <text class="d-t" x="125" y="81" text-anchor="middle">Cloudflare</text>
  <text class="d-s" x="125" y="98" text-anchor="middle">every shopper</text>
  <rect class="nd" x="270" y="60" width="190" height="50" rx="8"/>
  <text class="d-t" x="365" y="81" text-anchor="middle">App servers</text>
  <text class="d-s" x="365" y="98" text-anchor="middle">storefront · API · workers</text>
  <line class="ar" x1="210" y1="85" x2="268" y2="85" marker-end="url(#ah)"/>
  <text class="d-l" x="239" y="79" text-anchor="middle">443</text>

  <rect class="nd nd-new" x="520" y="60" width="200" height="50" rx="8"/>
  <text class="d-t" x="620" y="81" text-anchor="middle">Data gateway</text>
  <text class="d-s" x="620" y="98" text-anchor="middle">PgBouncer · HAProxy</text>
  <line class="ar" x1="460" y1="85" x2="518" y2="85" marker-end="url(#ah)"/>
  <text class="d-ok" x="489" y="79" text-anchor="middle">6432</text>
  <rect class="nd nd-new" x="860" y="60" width="200" height="50" rx="8"/>
  <text class="d-t" x="960" y="81" text-anchor="middle">PostgreSQL</text>
  <text class="d-s" x="960" y="98" text-anchor="middle">Patroni · etcd</text>
  <line class="ar" x1="720" y1="85" x2="858" y2="85" marker-end="url(#ah)"/>
  <text class="d-ok" x="789" y="79" text-anchor="middle">5432</text>

  <rect class="nd" x="520" y="150" width="200" height="50" rx="8"/>
  <text class="d-t" x="620" y="171" text-anchor="middle">Redis</text>
  <text class="d-s" x="620" y="188" text-anchor="middle">its own centre's apps only</text>
  <path class="ar" d="M400,110 V175 H518" marker-end="url(#ah)"/>
  <text class="d-ok" x="460" y="169" text-anchor="middle">6379</text>

  <path class="ar-cut" d="M440,110 V240 H858"/>
  <text class="d-x" x="650" y="236" text-anchor="middle">×</text>
  <text class="d-bad" x="650" y="258" text-anchor="middle">refused: app servers to PostgreSQL, Patroni or etcd directly</text>
  <path class="ar-cut" d="M125,110 V290 H858"/>
  <text class="d-x" x="650" y="286" text-anchor="middle">×</text>
  <text class="d-bad" x="650" y="308" text-anchor="middle">refused: anything from the internet</text>
  <text class="d-l" x="960" y="130" text-anchor="middle">5432, 2379–2380, 8008:</text>
  <text class="d-l" x="960" y="144" text-anchor="middle">between data servers only</text>

  <rect class="nd-far" x="270" y="360" width="190" height="56" rx="8"/>
  <text class="d-t" x="365" y="383" text-anchor="middle">Bastion</text>
  <text class="d-s" x="365" y="400" text-anchor="middle">admins: keys, every session logged</text>
  <path class="ar" d="M460,388 H505 V324" marker-end="url(#ah)"/>
  <text class="d-l" x="513" y="352">SSH only, into the data network</text>

  <rect class="nd-cf" x="700" y="360" width="170" height="56" rx="8"/>
  <text class="d-t" x="785" y="383" text-anchor="middle">R2</text>
  <text class="d-s" x="785" y="400" text-anchor="middle">backups, outward</text>
  <rect class="nd" x="890" y="360" width="170" height="56" rx="8"/>
  <text class="d-t" x="975" y="383" text-anchor="middle">Grafana Cloud</text>
  <text class="d-s" x="975" y="400" text-anchor="middle">metrics, outward</text>
  <path class="ar" d="M880,110 V340 H800 V358" marker-end="url(#ah)"/>
  <text class="d-l" x="888" y="300">443 out</text>
  <path class="ar" d="M1040,110 V358" marker-end="url(#ah)"/>
  <text class="d-l" x="1034" y="340" text-anchor="end">443 out</text>
</svg>
