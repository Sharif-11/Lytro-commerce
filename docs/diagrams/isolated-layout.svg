<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770" role="img" aria-labelledby="title desc">
  <title id="title">The isolated data layer across two regions</title>
  <desc id="desc">Cloudflare in front of an API layer in two Dhaka data centres. Below it, a separate data layer on its own private network: a gateway in each centre, the PostgreSQL primary in centre A and its synchronous standby in centre B, and Redis in each centre. Region 2, in Singapore or Mumbai, holds an asynchronous disaster-recovery standby that is never promoted automatically, the etcd witness, and an optional warm API layer. Backups go outward to R2.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
    .zone { fill: none; stroke: #7e8f8e; stroke-width: 1; stroke-dasharray: 2 4; }
    .grid { stroke: #d5dfde; stroke-width: 1; }
    .bar-self { fill: #107f78; }
    .bar-managed { fill: #b9770a; }
    .d-bad { fill: #c8323b; font-size: 11.5px; font-weight: 600; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="769" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect class="region" x="20" y="20" width="1060" height="70" rx="10"/>
  <text class="d-h" x="36" y="40">CLOUDFLARE · EDGE CACHE · LOAD BALANCER</text>
  <text class="d-s" x="36" y="62">Pools A and B in Dhaka take every shopper; pool C in region 2 takes them only if Dhaka is gone.</text>
  <text class="d-s" x="36" y="78">Kept shop pages are served from the edge throughout.</text>

  <!-- Region 1 -->
  <rect class="dc" x="20" y="110" width="760" height="490" rx="12"/>
  <text class="d-h" x="36" y="130">REGION 1 · DHAKA (BDIX) · TWO DATA CENTRES</text>

  <rect class="zone" x="40" y="140" width="720" height="96" rx="10"/>
  <text class="d-l" x="52" y="156">API LAYER</text>
  <rect class="nd" x="60" y="164" width="320" height="56" rx="8"/>
  <text class="d-t" x="220" y="187" text-anchor="middle">App servers · centre A (CloudXen)</text>
  <text class="d-s" x="220" y="205" text-anchor="middle">storefront · API · workers</text>
  <rect class="nd" x="420" y="164" width="320" height="56" rx="8"/>
  <text class="d-t" x="580" y="187" text-anchor="middle">App servers · centre B (Diana Host)</text>
  <text class="d-s" x="580" y="205" text-anchor="middle">storefront · API · spare workers</text>
  <line class="ar" x1="220" y1="90" x2="220" y2="162" marker-end="url(#ah)"/>
  <text class="d-l" x="228" y="104">pool A</text>
  <line class="ar" x1="580" y1="90" x2="580" y2="162" marker-end="url(#ah)"/>
  <text class="d-l" x="588" y="104">pool B</text>

  <rect class="zone" x="40" y="262" width="720" height="324" rx="10"/>
  <text class="d-l" x="52" y="278">DATA LAYER · ITS OWN PRIVATE NETWORK · NO PUBLIC ADDRESSES</text>
  <rect class="nd nd-new" x="60" y="290" width="320" height="50" rx="8"/>
  <text class="d-t" x="220" y="310" text-anchor="middle">Data gateway (A)</text>
  <text class="d-s" x="220" y="327" text-anchor="middle">HAProxy + PgBouncer · the only door</text>
  <rect class="nd nd-new" x="420" y="290" width="320" height="50" rx="8"/>
  <text class="d-t" x="580" y="310" text-anchor="middle">Data gateway (B)</text>
  <text class="d-s" x="580" y="327" text-anchor="middle">HAProxy + PgBouncer · the only door</text>
  <line class="ar" x1="220" y1="220" x2="220" y2="288" marker-end="url(#ah)"/>
  <text class="d-l" x="228" y="252">port 6432 only</text>
  <line class="ar" x1="580" y1="220" x2="580" y2="288" marker-end="url(#ah)"/>
  <text class="d-l" x="588" y="252">port 6432 only</text>

  <rect class="nd nd-new" x="60" y="380" width="320" height="70" rx="8"/>
  <text class="d-t" x="220" y="403" text-anchor="middle">PostgreSQL primary</text>
  <text class="d-s" x="220" y="421" text-anchor="middle">Patroni · etcd member</text>
  <text class="d-s" x="220" y="438" text-anchor="middle">VPS 14 vCPU / 64 GB / 1 TB</text>
  <rect class="nd-far" x="420" y="380" width="320" height="70" rx="8"/>
  <text class="d-t" x="580" y="403" text-anchor="middle">Synchronous standby</text>
  <text class="d-s" x="580" y="421" text-anchor="middle">Patroni · etcd member · B's reads</text>
  <text class="d-s" x="580" y="438" text-anchor="middle">VPS 24 vCPU / 64 GB / 1 TB</text>
  <line class="ar" x1="160" y1="340" x2="160" y2="378" marker-end="url(#ah)"/>
  <path class="ar" d="M500,340 V362 H300 V378" marker-end="url(#ah)"/>
  <text class="d-l" x="400" y="356" text-anchor="middle">B's writes</text>
  <line class="ar" x1="660" y1="340" x2="660" y2="378" marker-end="url(#ah)"/>
  <line class="ar" x1="380" y1="415" x2="418" y2="415" marker-end="url(#ah)"/>
  <text class="d-l" x="399" y="409" text-anchor="middle">sync</text>

  <rect class="nd" x="60" y="480" width="320" height="48" rx="8"/>
  <text class="d-t" x="220" y="499" text-anchor="middle">Redis (A) · limits and kept pages</text>
  <text class="d-s" x="220" y="516" text-anchor="middle">memory only · only A's app servers</text>
  <rect class="nd" x="420" y="480" width="320" height="48" rx="8"/>
  <text class="d-t" x="580" y="499" text-anchor="middle">Redis (B) · limits and kept pages</text>
  <text class="d-s" x="580" y="516" text-anchor="middle">memory only · only B's app servers</text>
  <path class="ar" d="M60,200 H50 V504 H58" marker-end="url(#ah)"/>
  <path class="ar" d="M740,200 H750 V504 H742" marker-end="url(#ah)"/>

  <text class="d-s" x="60" y="560">The data layer deploys on its own schedule; an app release can't change it.</text>

  <!-- Region 2 -->
  <rect class="far" x="800" y="110" width="280" height="490" rx="12"/>
  <text class="d-hf" x="816" y="130">REGION 2 · SINGAPORE OR MUMBAI</text>
  <rect class="nd" x="820" y="164" width="240" height="56" rx="8"/>
  <text class="d-t" x="940" y="187" text-anchor="middle">Warm API layer (optional)</text>
  <text class="d-s" x="940" y="205" text-anchor="middle">2 app servers, or images ready</text>
  <line class="ar ar-far" x1="940" y1="90" x2="940" y2="162" marker-end="url(#ah)"/>
  <text class="d-l" x="948" y="104">pool C</text>
  <rect class="nd-far" x="820" y="380" width="240" height="70" rx="8"/>
  <text class="d-t" x="940" y="403" text-anchor="middle">DR standby (async)</text>
  <text class="d-s" x="940" y="421" text-anchor="middle">never promoted automatically</text>
  <text class="d-s" x="940" y="438" text-anchor="middle">Patroni tag: nofailover</text>
  <line class="ar ar-far" x1="940" y1="220" x2="940" y2="378" marker-end="url(#ah)"/>
  <text class="d-l" x="948" y="300">after a region failover</text>
  <line class="ar" x1="740" y1="430" x2="818" y2="430" marker-end="url(#ah)"/>
  <text class="d-l" x="779" y="424" text-anchor="middle">async</text>
  <rect class="nd-far" x="820" y="480" width="240" height="48" rx="8"/>
  <text class="d-t" x="940" y="499" text-anchor="middle">Witness</text>
  <text class="d-s" x="940" y="516" text-anchor="middle">the third etcd vote · no data</text>

  <!-- Backups -->
  <rect class="nd-cf" x="20" y="620" width="1060" height="46" rx="8"/>
  <text class="d-t" x="40" y="640">R2 (Cloudflare) · locked buckets, outside every region</text>
  <text class="d-s" x="40" y="657">WAL every minute from whichever server leads, the nightly base backup and the encrypted dump. Sent outward only.</text>
  <path class="ar" d="M380,440 H400 V618" marker-end="url(#ah)"/>
  <text class="d-l" x="406" y="604">WAL-G</text>

  <rect class="nd-total" x="20" y="690" width="1060" height="60" rx="10"/>
  <text class="d-total" x="40" y="714">About ৳1.89 lakh a month at 2,000 shops with region 2 cold · ৳2.26 lakh warm</text>
  <text class="d-s" x="40" y="734">DIAGRAM_With region 2 cold in AWS Mumbai, or ৳2.26 lakh with a warm API layer there. The managed cloud was ৳4.15–6.9 lakh, and two centres without region 2 ৳1.49 lakh.</text>
</svg>
