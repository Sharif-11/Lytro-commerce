<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">One shop page, three ways</title>
  <desc id="desc">A page Cloudflare holds costs the server nothing. A page-cache hit costs Caddy and the storefront. A page drawn fresh goes through Caddy twice, the API, PgBouncer and PostgreSQL, where card facts took 78% of the database's time.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-caddy { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-hit { stroke: #0e6b66; stroke-width: 2.4; }
    .nd-hot { stroke: #c8323b; stroke-width: 2.4; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-hot { fill: #c8323b; font-size: 11.5px; font-weight: 600; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="999" height="299" rx="12"/>

  <text class="d-h" x="16" y="20">KEPT AT CLOUDFLARE · PRODUCTION</text>
  <rect class="nd" x="16" y="30" width="104" height="40" rx="7"/>
  <text class="d-t" x="68" y="55" text-anchor="middle">Shopper</text>
  <line class="ar" x1="120" y1="50" x2="136" y2="50" marker-end="url(#ah)"/>
  <rect class="nd-cf nd-hit" x="138" y="30" width="104" height="40" rx="7"/>
  <text class="d-t" x="190" y="47" text-anchor="middle">Edge cache</text>
  <text class="d-ok" x="190" y="62" text-anchor="middle">hit</text>
  <text class="d-s" x="264" y="54">Answered here. The server does no work.</text>

  <text class="d-h" x="16" y="110">KEPT IN THE PAGE CACHE</text>
  <rect class="nd" x="16" y="120" width="104" height="40" rx="7"/>
  <text class="d-t" x="68" y="145" text-anchor="middle">Shopper</text>
  <rect class="nd-cf" x="138" y="120" width="104" height="40" rx="7"/>
  <text class="d-t" x="190" y="137" text-anchor="middle">Edge cache</text>
  <text class="d-s" x="190" y="152" text-anchor="middle">miss</text>
  <rect class="nd-caddy" x="260" y="120" width="104" height="40" rx="7"/>
  <text class="d-t" x="312" y="145" text-anchor="middle">Caddy</text>
  <rect class="nd" x="382" y="120" width="104" height="40" rx="7"/>
  <text class="d-t" x="434" y="145" text-anchor="middle">Storefront</text>
  <rect class="nd nd-hit" x="504" y="120" width="104" height="40" rx="7"/>
  <text class="d-t" x="556" y="137" text-anchor="middle">Page cache</text>
  <text class="d-ok" x="556" y="152" text-anchor="middle">hit</text>
  <line class="ar" x1="120" y1="140" x2="136" y2="140" marker-end="url(#ah)"/>
  <line class="ar" x1="242" y1="140" x2="258" y2="140" marker-end="url(#ah)"/>
  <line class="ar" x1="364" y1="140" x2="380" y2="140" marker-end="url(#ah)"/>
  <line class="ar" x1="486" y1="140" x2="502" y2="140" marker-end="url(#ah)"/>
  <text class="d-s" x="630" y="144">Caddy and the storefront only. No API, no database.</text>

  <text class="d-h" x="16" y="200">DRAWN FRESH</text>
  <rect class="nd" x="16" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="68" y="235" text-anchor="middle">Shopper</text>
  <rect class="nd-cf" x="138" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="190" y="227" text-anchor="middle">Edge cache</text>
  <text class="d-s" x="190" y="242" text-anchor="middle">miss</text>
  <rect class="nd-caddy" x="260" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="312" y="235" text-anchor="middle">Caddy</text>
  <rect class="nd" x="382" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="434" y="235" text-anchor="middle">Storefront</text>
  <rect class="nd-caddy" x="504" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="556" y="235" text-anchor="middle">Caddy :8080</text>
  <rect class="nd" x="626" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="678" y="235" text-anchor="middle">API</text>
  <rect class="nd" x="748" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="800" y="235" text-anchor="middle">PgBouncer</text>
  <rect class="nd nd-hot" x="870" y="210" width="104" height="40" rx="7"/>
  <text class="d-t" x="922" y="235" text-anchor="middle">PostgreSQL</text>
  <line class="ar" x1="120" y1="230" x2="136" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="242" y1="230" x2="258" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="364" y1="230" x2="380" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="486" y1="230" x2="502" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="608" y1="230" x2="624" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="730" y1="230" x2="746" y2="230" marker-end="url(#ah)"/>
  <line class="ar" x1="852" y1="230" x2="868" y2="230" marker-end="url(#ah)"/>
  <path class="ar" d="M434,256 V266 H678 V256"/>
  <text class="d-l" x="556" y="282" text-anchor="middle">several calls a page: the shop, then each product row</text>
  <text class="d-hot" x="922" y="270" text-anchor="middle">card facts:</text>
  <text class="d-hot" x="922" y="285" text-anchor="middle">78% of its time</text>
</svg>
