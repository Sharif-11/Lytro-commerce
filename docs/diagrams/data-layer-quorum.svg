<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="title desc">
  <title id="title">Who may lead the database</title>
  <desc id="desc">Four cases. Centre A lost: B and the witness are two of three, so B becomes primary. Centre B lost: A and the witness keep A as primary. The A to B link cut: both still reach the witness, A keeps the lead. A cut off from both: A has one of three and stops taking writes, while B and the witness make B primary.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="269" rx="12"/>
  <!-- Panel 1: A lost -->
  <text class="d-h" x="16" y="20">CENTRE A LOST</text>
  <rect class="nd-down" x="36" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="68" y="58" text-anchor="middle">A</text>
  <rect class="nd-hit" x="166" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="198" y="58" text-anchor="middle">B</text>
  <rect class="nd-far" x="101" y="116" width="64" height="34" rx="6"/>
  <text class="d-t" x="133" y="138" text-anchor="middle">W</text>
  <line class="ar-cut" x1="100" y1="53" x2="166" y2="53"/>
  <line class="ar-cut" x1="68" y1="70" x2="120" y2="116"/>
  <line class="ar" x1="198" y1="70" x2="146" y2="116"/>
  <text class="d-s" x="16" y="178">B and the witness are 2 of 3.</text>
  <text class="d-s" x="16" y="195">B's standby becomes primary,</text>
  <text class="d-s" x="16" y="212">with nothing lost (it was</text>
  <text class="d-s" x="16" y="229">synchronous).</text>

  <!-- Panel 2: B lost -->
  <text class="d-h" x="262" y="20">CENTRE B LOST</text>
  <rect class="nd-hit" x="282" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="314" y="58" text-anchor="middle">A</text>
  <rect class="nd-down" x="412" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="444" y="58" text-anchor="middle">B</text>
  <rect class="nd-far" x="347" y="116" width="64" height="34" rx="6"/>
  <text class="d-t" x="379" y="138" text-anchor="middle">W</text>
  <line class="ar-cut" x1="346" y1="53" x2="412" y2="53"/>
  <line class="ar" x1="314" y1="70" x2="366" y2="116"/>
  <line class="ar-cut" x1="444" y1="70" x2="392" y2="116"/>
  <text class="d-s" x="262" y="178">A and the witness are 2 of 3.</text>
  <text class="d-s" x="262" y="195">A stays primary and writes</text>
  <text class="d-s" x="262" y="212">alone until B is back, with no</text>
  <text class="d-s" x="262" y="229">second copy meanwhile.</text>

  <!-- Panel 3: link cut -->
  <text class="d-h" x="508" y="20">THE A–B LINK CUT</text>
  <rect class="nd-hit" x="528" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="560" y="58" text-anchor="middle">A</text>
  <rect class="nd" x="658" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="690" y="58" text-anchor="middle">B</text>
  <rect class="nd-far" x="593" y="116" width="64" height="34" rx="6"/>
  <text class="d-t" x="625" y="138" text-anchor="middle">W</text>
  <line class="ar-cut" x1="592" y1="53" x2="658" y2="53"/>
  <text class="d-x" x="625" y="49" text-anchor="middle">×</text>
  <line class="ar" x1="560" y1="70" x2="612" y2="116"/>
  <line class="ar" x1="690" y1="70" x2="638" y2="116"/>
  <text class="d-s" x="508" y="178">Both still reach the witness.</text>
  <text class="d-s" x="508" y="195">A keeps the lead; B waits and</text>
  <text class="d-s" x="508" y="212">catches up. Centre B's writes</text>
  <text class="d-s" x="508" y="229">wait with the busy page.</text>

  <!-- Panel 4: A isolated -->
  <text class="d-h" x="754" y="20">A CUT OFF FROM BOTH</text>
  <rect class="nd-down" x="774" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="806" y="58" text-anchor="middle">A</text>
  <rect class="nd-hit" x="904" y="36" width="64" height="34" rx="6"/>
  <text class="d-t" x="936" y="58" text-anchor="middle">B</text>
  <rect class="nd-far" x="839" y="116" width="64" height="34" rx="6"/>
  <text class="d-t" x="871" y="138" text-anchor="middle">W</text>
  <line class="ar-cut" x1="838" y1="53" x2="904" y2="53"/>
  <line class="ar-cut" x1="806" y1="70" x2="858" y2="116"/>
  <line class="ar" x1="936" y1="70" x2="884" y2="116"/>
  <text class="d-s" x="754" y="178">A is 1 of 3, so it stops taking</text>
  <text class="d-s" x="754" y="195">writes by itself. B and the</text>
  <text class="d-s" x="754" y="212">witness make B primary. Never</text>
  <text class="d-s" x="754" y="229">two primaries at once.</text>
</svg>
