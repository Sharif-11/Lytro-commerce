<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Redis in each data centre</title>
  <desc id="desc">Each centre has its own Redis server running two instances: one for the per-minute limits and one for kept pages, both in memory only. The app servers in each centre use their own centre's Redis. The purge job writes each tag's change time to both centres' kept pages. Exact limits stay in PostgreSQL.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="429" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="dc" x="30" y="20" width="500" height="300" rx="12"/>
  <text class="d-h" x="46" y="42">DATA CENTRE A</text>
  <rect class="dc" x="570" y="20" width="500" height="300" rx="12"/>
  <text class="d-h" x="586" y="42">DATA CENTRE B</text>

  <rect class="nd" x="60" y="62" width="240" height="56" rx="8"/>
  <text class="d-t" x="180" y="85" text-anchor="middle">App servers (A)</text>
  <text class="d-s" x="180" y="103" text-anchor="middle">storefront · API</text>
  <rect class="nd" x="60" y="150" width="240" height="56" rx="8"/>
  <text class="d-t" x="180" y="173" text-anchor="middle">Worker (A)</text>
  <text class="d-s" x="180" y="191" text-anchor="middle">runs the purge job</text>

  <rect class="nd nd-new" x="330" y="56" width="180" height="200" rx="8"/>
  <text class="d-t" x="420" y="76" text-anchor="middle">Redis server (A)</text>
  <text class="d-cost" x="420" y="93" text-anchor="middle">4 vCPU / 8 GB · ৳1,647</text>
  <rect class="nd-inner" x="345" y="104" width="150" height="62" rx="6"/>
  <text class="d-t" x="420" y="124" text-anchor="middle">Limits</text>
  <text class="d-s" x="420" y="141" text-anchor="middle">256 MB · memory only</text>
  <text class="d-s" x="420" y="156" text-anchor="middle">evicts expiring keys</text>
  <rect class="nd-inner" x="345" y="178" width="150" height="62" rx="6"/>
  <text class="d-t" x="420" y="198" text-anchor="middle">Kept pages</text>
  <text class="d-s" x="420" y="215" text-anchor="middle">5 GB · memory only</text>
  <text class="d-s" x="420" y="230" text-anchor="middle">least-used out</text>
  <line class="ar" x1="300" y1="90" x2="328" y2="90" marker-end="url(#ah)"/>
  <line class="ar" x1="300" y1="200" x2="343" y2="200" marker-end="url(#ah)"/>
  <text class="d-l" x="322" y="194" text-anchor="middle">tags</text>

  <rect class="nd" x="600" y="62" width="240" height="56" rx="8"/>
  <text class="d-t" x="720" y="85" text-anchor="middle">App servers (B)</text>
  <text class="d-s" x="720" y="103" text-anchor="middle">storefront · API</text>
  <rect class="nd nd-new" x="870" y="56" width="180" height="200" rx="8"/>
  <text class="d-t" x="960" y="76" text-anchor="middle">Redis server (B)</text>
  <text class="d-cost" x="960" y="93" text-anchor="middle">4 vCPU / 8 GB · ৳6,299</text>
  <rect class="nd-inner" x="885" y="104" width="150" height="62" rx="6"/>
  <text class="d-t" x="960" y="124" text-anchor="middle">Limits</text>
  <text class="d-s" x="960" y="141" text-anchor="middle">256 MB · memory only</text>
  <text class="d-s" x="960" y="156" text-anchor="middle">evicts expiring keys</text>
  <rect class="nd-inner" x="885" y="178" width="150" height="62" rx="6"/>
  <text class="d-t" x="960" y="198" text-anchor="middle">Kept pages</text>
  <text class="d-s" x="960" y="215" text-anchor="middle">5 GB · memory only</text>
  <text class="d-s" x="960" y="230" text-anchor="middle">least-used out</text>
  <line class="ar" x1="840" y1="90" x2="868" y2="90" marker-end="url(#ah)"/>

  <path class="ar" d="M180,206 V286 H960 V242" marker-end="url(#ah)"/>
  <text class="d-l" x="560" y="280" text-anchor="middle">the same tag times, to centre B, before Cloudflare's purge</text>

  <rect class="nd" x="30" y="346" width="1040" height="64" rx="8"/>
  <text class="d-t" x="50" y="370">Exact limits stay in PostgreSQL, the same in both centres: orders, sign-up and sign-in codes, payment sessions, pairing (RED-11).</text>
  <text class="d-s" x="50" y="390">Redis holds only what can be lost: per-minute limits counted in each centre, gateway tokens fetched again, pages drawn again.</text>
</svg>
