<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Lytro at 500 shops</title>
  <desc id="desc">500 shops: one CloudXen server runs everything behind Cloudflare Pro, with backups in R2. About 13,100 taka a month.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="329" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <text class="d-h" x="86" y="22" text-anchor="middle">500 SHOPS · OUTSIDE</text>
  <text class="d-h" x="271" y="22" text-anchor="middle">CLOUDFLARE</text>
  <rect class="dc" x="386" y="30" width="344" height="214" rx="12"/>
  <text class="d-h" x="402" y="50">ONE SERVER · CLOUDXEN</text>

  <rect class="nd" x="16" y="60" width="140" height="56" rx="8"/>
  <text class="d-t" x="86" y="84" text-anchor="middle">Shoppers, sellers,</text>
  <text class="d-t" x="86" y="101" text-anchor="middle">phones, couriers</text>
  <rect class="nd-cf" x="186" y="60" width="170" height="76" rx="8"/>
  <text class="d-t" x="271" y="82" text-anchor="middle">Cloudflare Pro</text>
  <text class="d-s" x="271" y="99" text-anchor="middle">edge cache · photos (R2)</text>
  <text class="d-cost" x="271" y="122" text-anchor="middle">$25 = ৳3,119 a month</text>
  <line class="ar" x1="156" y1="88" x2="184" y2="88" marker-end="url(#ah)"/>

  <rect class="nd nd-new" x="406" y="64" width="300" height="160" rx="8"/>
  <text class="d-t" x="556" y="90" text-anchor="middle">One server</text>
  <text class="d-s" x="556" y="110" text-anchor="middle">BDIX VPS 320 GB: 8 vCPU / 16 GB / 320 GB</text>
  <text class="d-s" x="556" y="130" text-anchor="middle">Caddy · storefront · API · worker</text>
  <text class="d-s" x="556" y="150" text-anchor="middle">PostgreSQL · Redis · page cache</text>
  <text class="d-cost" x="556" y="176" text-anchor="middle">$25.20 = ৳3,144 a month</text>
  <line class="ar" x1="356" y1="98" x2="404" y2="98" marker-end="url(#ah)"/>
  <text class="d-l" x="380" y="92" text-anchor="middle">miss</text>

  <rect class="nd-cf" x="760" y="64" width="204" height="60" rx="8"/>
  <text class="d-t" x="862" y="88" text-anchor="middle">Backups in R2</text>
  <text class="d-s" x="862" y="106" text-anchor="middle">WAL each minute · nightly dump</text>
  <line class="ar" x1="706" y1="94" x2="758" y2="94" marker-end="url(#ah)"/>
  <text class="d-s" x="760" y="150">No standby yet: a failure is</text>
  <text class="d-s" x="760" y="166">restored from R2 (4-hour target).</text>

  <rect class="nd" x="16" y="172" width="140" height="50" rx="8"/>
  <text class="d-t" x="86" y="193" text-anchor="middle">SMS, couriers, bKash,</text>
  <text class="d-s" x="86" y="210" text-anchor="middle">Resend, Gemini</text>
  <line class="ar" x1="406" y1="197" x2="158" y2="197" marker-end="url(#ah)"/>
  <text class="d-l" x="281" y="191" text-anchor="middle">called directly</text>

  <rect class="nd-total" x="16" y="262" width="968" height="52" rx="10"/>
  <text class="d-total" x="36" y="284">About ৳13,100 a month ($105) · ৳26 a shop</text>
  <text class="d-s" x="36" y="303">1 server ৳3,144 · Cloudflare Pro ৳3,119 · R2 ≈ ৳3,119 · monitoring ≈ ৳3,743</text>
</svg>
