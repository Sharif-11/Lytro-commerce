<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">When all of Dhaka goes dark</title>
  <desc id="desc">Dhaka goes dark; Cloudflare's checks fail within a minute and shops show kept pages; someone confirms it's a regional outage in 5 to 15 minutes; region 2's standby is promoted and fenced in about 5 minutes; the API layer there starts, in 1 to 2 minutes if warm or 20 to 30 minutes from images; orders work again after about 10 to 20 minutes warm, 30 to 60 cold. Coming back, Dhaka is rebuilt as standbys of region 2 and switched over in a quiet hour.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
    .zone { fill: none; stroke: #7e8f8e; stroke-width: 1; stroke-dasharray: 2 4; }
    .grid { stroke: #d5dfde; stroke-width: 1; }
    .bar-self { fill: #107f78; }
    .bar-managed { fill: #b9770a; }
    .d-bad { fill: #c8323b; font-size: 11.5px; font-weight: 600; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="299" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <text class="d-h" x="16" y="20">GOING TO REGION 2</text>
  <rect class="nd-down" x="16" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="90" y="55" text-anchor="middle">Dhaka goes dark</text>
  <text class="d-s" x="90" y="74" text-anchor="middle">0</text>
  <rect class="nd" x="180" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="254" y="55" text-anchor="middle">Checks fail</text>
  <text class="d-s" x="254" y="72" text-anchor="middle">kept pages still served</text>
  <text class="d-s" x="254" y="87" text-anchor="middle">≈ 1 min</text>
  <rect class="nd" x="344" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="418" y="55" text-anchor="middle">You confirm it</text>
  <text class="d-s" x="418" y="72" text-anchor="middle">a region, not a blip</text>
  <text class="d-s" x="418" y="87" text-anchor="middle">≈ 5–15 min</text>
  <rect class="nd" x="508" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="582" y="55" text-anchor="middle">Promote region 2</text>
  <text class="d-s" x="582" y="72" text-anchor="middle">fence Dhaka first</text>
  <text class="d-s" x="582" y="87" text-anchor="middle">≈ 5 min</text>
  <rect class="nd" x="672" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="746" y="55" text-anchor="middle">API layer starts</text>
  <text class="d-s" x="746" y="72" text-anchor="middle">warm 1–2 min</text>
  <text class="d-s" x="746" y="87" text-anchor="middle">from images 20–30</text>
  <rect class="nd-hit" x="836" y="30" width="148" height="64" rx="7"/>
  <text class="d-t" x="910" y="55" text-anchor="middle">Orders work again</text>
  <text class="d-s" x="910" y="72" text-anchor="middle">warm ≈ 10–20 min</text>
  <text class="d-s" x="910" y="87" text-anchor="middle">cold ≈ 30–60 min</text>
  <line class="ar" x1="164" y1="62" x2="178" y2="62" marker-end="url(#ah)"/>
  <line class="ar" x1="328" y1="62" x2="342" y2="62" marker-end="url(#ah)"/>
  <line class="ar" x1="492" y1="62" x2="506" y2="62" marker-end="url(#ah)"/>
  <line class="ar" x1="656" y1="62" x2="670" y2="62" marker-end="url(#ah)"/>
  <line class="ar" x1="820" y1="62" x2="834" y2="62" marker-end="url(#ah)"/>

  <text class="d-h" x="16" y="136">COMING BACK TO DHAKA, IN A QUIET HOUR</text>
  <rect class="nd" x="16" y="146" width="230" height="56" rx="7"/>
  <text class="d-t" x="131" y="169" text-anchor="middle">Dhaka is back</text>
  <text class="d-s" x="131" y="187" text-anchor="middle">its old primary stays fenced</text>
  <rect class="nd" x="262" y="146" width="230" height="56" rx="7"/>
  <text class="d-t" x="377" y="169" text-anchor="middle">Rebuild Dhaka's servers</text>
  <text class="d-s" x="377" y="187" text-anchor="middle">as standbys of region 2</text>
  <rect class="nd" x="508" y="146" width="230" height="56" rx="7"/>
  <text class="d-t" x="623" y="169" text-anchor="middle">Switch over to Dhaka</text>
  <text class="d-s" x="623" y="187" text-anchor="middle">writes wait under a minute</text>
  <rect class="nd-hit" x="754" y="146" width="230" height="56" rx="7"/>
  <text class="d-t" x="869" y="169" text-anchor="middle">Region 2 is a copy again</text>
  <text class="d-s" x="869" y="187" text-anchor="middle">nofailover tag back on</text>
  <line class="ar" x1="246" y1="174" x2="260" y2="174" marker-end="url(#ah)"/>
  <line class="ar" x1="492" y1="174" x2="506" y2="174" marker-end="url(#ah)"/>
  <line class="ar" x1="738" y1="174" x2="752" y2="174" marker-end="url(#ah)"/>

  <rect class="nd-cf" x="16" y="226" width="968" height="56" rx="8"/>
  <text class="d-t" x="36" y="249">Data lost going to region 2: the few seconds the asynchronous stream was behind.</text>
  <text class="d-s" x="36" y="268">Orders in those seconds are found again by the daily money check against bKash and the couriers (DAT-52).</text>
</svg>
