<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Monthly cost at 2,000 shops, self-managed and managed</title>
  <desc id="desc">Monthly cost at 2,000 shops in lakh taka. Self-managed: one centre 0.71, two centres 1.49. Managed: AWS Mumbai with a 1-year commitment 4.15, DigitalOcean 4.82, Google Cloud with a 1-year commitment 5.22, AWS on demand 5.36, Google Cloud on demand 6.80, Aiven 6.86.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
    .zone { fill: none; stroke: #7e8f8e; stroke-width: 1; stroke-dasharray: 2 4; }
    .grid { stroke: #d5dfde; stroke-width: 1; }
    .bar-self { fill: #107f78; }
    .bar-managed { fill: #b9770a; }
    .d-bad { fill: #c8323b; font-size: 11.5px; font-weight: 600; }
    .d-ok { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="759" height="329" rx="12"/>
  <line class="grid" x1="250" y1="34" x2="250" y2="290"/>
  <line class="grid" x1="370" y1="34" x2="370" y2="290"/>
  <line class="grid" x1="490" y1="34" x2="490" y2="290"/>
  <line class="grid" x1="610" y1="34" x2="610" y2="290"/>
  <line class="grid" x1="730" y1="34" x2="730" y2="290"/>
  <text class="d-l" x="250" y="310" text-anchor="middle">0</text>
  <text class="d-l" x="370" y="310" text-anchor="middle">2</text>
  <text class="d-l" x="490" y="310" text-anchor="middle">4</text>
  <text class="d-l" x="610" y="310" text-anchor="middle">6</text>
  <text class="d-l" x="730" y="310" text-anchor="end">8 lakh taka a month</text>
  <rect class="bar-self" x="250" y="10" width="12" height="12" rx="2"/>
  <text class="d-l" x="268" y="20">self-managed, in Bangladesh</text>
  <rect class="bar-managed" x="450" y="10" width="12" height="12" rx="2"/>
  <text class="d-l" x="468" y="20">managed, in Mumbai or Bangalore</text>

  <g><title>One centre, self-managed: ৳71,260 a month</title>
    <text class="d-t" x="240" y="52" text-anchor="end">One centre (lean)</text>
    <path class="bar-self" d="M250,40 H288.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="300" y="52">0.71</text></g>
  <g><title>Two centres, self-managed: ৳1.49 lakh a month</title>
    <text class="d-t" x="240" y="82" text-anchor="end">Two centres</text>
    <path class="bar-self" d="M250,70 H335.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="347" y="82">1.49</text></g>
  <g><title>AWS Mumbai, 1-year commitment: ৳4.15 lakh a month ($3,330)</title>
    <text class="d-t" x="240" y="112" text-anchor="end">AWS Mumbai, 1 year</text>
    <path class="bar-managed" d="M250,100 H495 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="507" y="112">4.15</text></g>
  <g><title>DigitalOcean Bangalore: ৳4.82 lakh a month ($3,860), no commitment offered</title>
    <text class="d-t" x="240" y="142" text-anchor="end">DigitalOcean Bangalore</text>
    <path class="bar-managed" d="M250,130 H535.2 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="547" y="142">4.82</text></g>
  <g><title>Google Cloud Mumbai, 1-year commitment: ৳5.22 lakh a month ($4,185)</title>
    <text class="d-t" x="240" y="172" text-anchor="end">Google Cloud, 1 year</text>
    <path class="bar-managed" d="M250,160 H559.2 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="571" y="172">5.22</text></g>
  <g><title>AWS Mumbai on demand: ৳5.36 lakh a month ($4,299)</title>
    <text class="d-t" x="240" y="202" text-anchor="end">AWS Mumbai, on demand</text>
    <path class="bar-managed" d="M250,190 H567.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="580" y="202">5.36</text></g>
  <g><title>Google Cloud Mumbai on demand: ৳6.80 lakh a month ($5,449)</title>
    <text class="d-t" x="240" y="232" text-anchor="end">Google Cloud, on demand</text>
    <path class="bar-managed" d="M250,220 H654 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="666" y="232">6.80</text></g>
  <g><title>Aiven (on AWS Mumbai) with AWS servers: ৳6.86 lakh a month ($5,503)</title>
    <text class="d-t" x="240" y="262" text-anchor="end">Aiven + AWS servers</text>
    <path class="bar-managed" d="M250,250 H657.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 H250 Z"/>
    <text class="d-t" x="670" y="262">6.86</text></g>
</svg>
