<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="1100" height="630" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL across two data centres</title>
  <desc id="desc">In each centre, app servers reach PostgreSQL through PgBouncer and HAProxy, which asks Patroni which server leads. Centre A holds the primary; centre B holds a synchronous standby that takes centre B's reads. Writes from centre B cross the tunnel to the primary. Patroni on each database server and a witness at a third provider form an etcd quorum of three. The primary sends its WAL to R2 every minute.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d5dfde; stroke-width: 1; }
    .nd { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1.2; }
    .nd-back { fill: #ffffff; stroke: #7e8f8e; stroke-width: 1; }
    .nd-inner { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1; }
    .nd-cf { fill: #fdf0d1; stroke: #9a6004; stroke-width: 1.2; }
    .nd-far { fill: #ffffff; stroke: #5b4a86; stroke-width: 1.4; }
    .nd-new { stroke: #0e6b66; stroke-width: 2; }
    .nd-hit { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 2; }
    .nd-slow { fill: #fdf0d1; stroke: #9a6004; stroke-width: 2; }
    .nd-down { fill: #fbe9ea; stroke: #c8323b; stroke-width: 2; }
    .nd-total { fill: #ddf5f2; stroke: #0e6b66; stroke-width: 1.4; }
    .region { fill: #fbf6ea; }
    .dc { fill: #f1f7f6; stroke: #7e8f8e; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .far { fill: #f4f1f8; stroke: #5b4a86; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ar { fill: none; stroke: #2c3f3e; stroke-width: 1.4; }
    .ar-dash { stroke-dasharray: 5 4; }
    .ar-far { fill: none; stroke: #5b4a86; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .ar-cut { fill: none; stroke: #c8323b; stroke-width: 2; stroke-dasharray: 4 4; }
    .ah { fill: #2c3f3e; }
    text { font-family: Inter, "Segoe UI", "Nirmala UI", Helvetica, Arial, sans-serif; }
    .d-h { fill: #2c3f3e; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-hf { fill: #5b4a86; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .d-t { fill: #10201f; font-size: 13px; font-weight: 600; }
    .d-s { fill: #2c3f3e; font-size: 11.5px; }
    .d-l { fill: #2c3f3e; font-size: 11px; font-weight: 500; }
    .d-x { fill: #c8323b; font-size: 16px; font-weight: 700; }
    .d-badge { fill: #0e6b66; font-size: 12px; font-weight: 700; }
    .d-cost { fill: #0e6b66; font-size: 11.5px; font-weight: 600; }
    .d-total { fill: #10201f; font-size: 15px; font-weight: 700; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1099" height="629" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect class="dc" x="30" y="20" width="500" height="400" rx="12"/>
  <text class="d-h" x="46" y="42">DATA CENTRE A · CLOUDXEN</text>
  <rect class="dc" x="570" y="20" width="500" height="400" rx="12"/>
  <text class="d-h" x="586" y="42">DATA CENTRE B · DIANA HOST</text>

  <!-- Centre A's path to the database -->
  <rect class="nd" x="60" y="58" width="240" height="44" rx="8"/>
  <text class="d-t" x="180" y="77" text-anchor="middle">App servers (A)</text>
  <text class="d-s" x="180" y="93" text-anchor="middle">storefront · API · workers</text>
  <rect class="nd" x="60" y="122" width="240" height="44" rx="8"/>
  <text class="d-t" x="180" y="141" text-anchor="middle">PgBouncer, on each</text>
  <text class="d-s" x="180" y="157" text-anchor="middle">pools the connections</text>
  <rect class="nd nd-new" x="60" y="186" width="240" height="44" rx="8"/>
  <text class="d-t" x="180" y="205" text-anchor="middle">HAProxy, on each</text>
  <text class="d-s" x="180" y="221" text-anchor="middle">asks Patroni which server leads</text>
  <line class="ar" x1="180" y1="102" x2="180" y2="120" marker-end="url(#ah)"/>
  <line class="ar" x1="180" y1="166" x2="180" y2="184" marker-end="url(#ah)"/>

  <rect class="nd nd-new" x="60" y="300" width="440" height="90" rx="8"/>
  <text class="d-t" x="280" y="324" text-anchor="middle">PostgreSQL 17 · primary</text>
  <text class="d-s" x="280" y="342" text-anchor="middle">Patroni agent · etcd member</text>
  <text class="d-s" x="280" y="358" text-anchor="middle">VPS 14 vCPU / 64 GB / 1 TB</text>
  <text class="d-cost" x="280" y="378" text-anchor="middle">$96 = ৳11,976 a month</text>
  <line class="ar" x1="180" y1="230" x2="180" y2="298" marker-end="url(#ah)"/>
  <text class="d-l" x="188" y="270">writes, and A's reads</text>

  <!-- Centre B's path to the database -->
  <rect class="nd" x="800" y="58" width="240" height="44" rx="8"/>
  <text class="d-t" x="920" y="77" text-anchor="middle">App servers (B)</text>
  <text class="d-s" x="920" y="93" text-anchor="middle">storefront · API · spare workers</text>
  <rect class="nd" x="800" y="122" width="240" height="44" rx="8"/>
  <text class="d-t" x="920" y="141" text-anchor="middle">PgBouncer, on each</text>
  <text class="d-s" x="920" y="157" text-anchor="middle">pools the connections</text>
  <rect class="nd nd-new" x="800" y="186" width="240" height="44" rx="8"/>
  <text class="d-t" x="920" y="205" text-anchor="middle">HAProxy, on each</text>
  <text class="d-s" x="920" y="221" text-anchor="middle">asks Patroni which server leads</text>
  <line class="ar" x1="920" y1="102" x2="920" y2="120" marker-end="url(#ah)"/>
  <line class="ar" x1="920" y1="166" x2="920" y2="184" marker-end="url(#ah)"/>

  <rect class="nd-far" x="600" y="300" width="440" height="90" rx="8"/>
  <text class="d-t" x="820" y="324" text-anchor="middle">PostgreSQL 17 · synchronous standby</text>
  <text class="d-s" x="820" y="342" text-anchor="middle">Patroni agent · etcd member · takes B's reads</text>
  <text class="d-s" x="820" y="358" text-anchor="middle">VPS 24 vCPU / 64 GB / 1 TB</text>
  <text class="d-cost" x="820" y="378" text-anchor="middle">৳41,999 a month</text>
  <line class="ar" x1="980" y1="230" x2="980" y2="298" marker-end="url(#ah)"/>
  <text class="d-l" x="972" y="270" text-anchor="end">B's reads</text>
  <path class="ar" d="M860,230 V262 H515 V330 H502" marker-end="url(#ah)"/>
  <text class="d-l" x="688" y="256" text-anchor="middle">writes, across the tunnel (1–3 ms)</text>
  <line class="ar" x1="500" y1="365" x2="598" y2="365" marker-end="url(#ah)"/>
  <text class="d-l" x="549" y="359" text-anchor="middle">streams</text>

  <!-- Quorum -->
  <rect class="nd-far" x="400" y="470" width="300" height="56" rx="8"/>
  <text class="d-t" x="550" y="492" text-anchor="middle">Witness, at a third provider</text>
  <text class="d-s" x="550" y="510" text-anchor="middle">etcd member only · holds no data</text>
  <line class="ar-far" x1="450" y1="470" x2="450" y2="392"/>
  <line class="ar-far" x1="650" y1="470" x2="650" y2="392"/>
  <text class="d-hf" x="550" y="458" text-anchor="middle">ETCD QUORUM: 2 OF 3</text>

  <!-- Backups -->
  <rect class="nd-cf" x="30" y="470" width="320" height="56" rx="8"/>
  <text class="d-t" x="190" y="492" text-anchor="middle">R2 (Cloudflare), locked buckets</text>
  <text class="d-s" x="190" y="510" text-anchor="middle">WAL every minute · nightly base backup + dump</text>
  <line class="ar" x1="100" y1="390" x2="100" y2="468" marker-end="url(#ah)"/>
  <text class="d-l" x="108" y="436">WAL-G, from whichever leads</text>

  <rect class="nd-total" x="740" y="470" width="330" height="56" rx="10"/>
  <text class="d-total" x="760" y="494">PostgreSQL ≈ ৳54,975 a month</text>
  <text class="d-s" x="760" y="513">primary ৳11,976 · standby ৳41,999 · witness ≈ ৳1,000</text>

  <rect class="nd" x="30" y="548" width="1040" height="62" rx="8"/>
  <text class="d-t" x="50" y="572">A failover moves only the leader. HAProxy notices in seconds and sends new connections to the new primary;</text>
  <text class="d-s" x="50" y="592">no app setting changes, and the old primary rejoins as a standby (pg_rewind), never as a second primary.</text>
</svg>
